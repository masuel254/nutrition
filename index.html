<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F2F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Suivi">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3F1; --card:#FFFFFF; --ink:#17262A; --soft:#6E7F82; --nav:#7A8A8C;
  --rule:#D4D9D6; --under:#16715C; --over:#B85C15; --focus:#16715C; --creux:#E3E5E3;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#10181A; --card:#172224; --ink:#E8ECEA; --soft:#9BA8A3; --nav:#AEBDBF;
         --rule:#2A383A; --under:#3DA88C; --over:#D8853A; --focus:#3DA88C; --creux:#252A2B; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;overscroll-behavior-y:none}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(58px + env(safe-area-inset-bottom));
}
h1,h2{font-weight:600;margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}

.bandeau{padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--rule)}
.bandeau .qui{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bandeau h1{font-size:19px;letter-spacing:-0.01em}
.lejour{font-size:13px;font-weight:300;color:var(--soft);display:block;margin-top:1px}
.perime{margin-top:9px;padding:7px 10px;border-radius:4px;background:var(--over);color:var(--paper);
  font-size:12.5px;font-weight:400;line-height:1.35}
.bandeau .roue{font-size:13px;color:var(--soft);padding:4px 2px}
.mesures{display:flex;gap:6px 0;margin-top:8px;font-size:13px;color:var(--soft);font-weight:300;flex-wrap:wrap}
.mesures span{padding-right:10px;margin-right:10px;border-right:1px solid var(--rule)}
.mesures span:last-child{border-right:none;padding-right:0;margin-right:0}
.badge{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.badge.sous{background:var(--under);color:var(--paper)}
.badge.sur{background:var(--over);color:var(--paper)}
.conso{font-size:14px;color:var(--soft);font-weight:300;margin-top:10px}
.conso b{font-weight:600;color:var(--ink)}
.rappel{font-size:13px;margin-top:10px;line-height:1.45}
.periode{display:flex;gap:6px;margin-bottom:12px}
.periode button{padding:5px 12px;border:1px solid var(--rule);border-radius:999px;font-size:12.5px;color:var(--soft)}
.periode button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.detailjour{margin-top:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;
  background:var(--card);font-size:13px;line-height:1.5}
.detailjour b{font-weight:600}
.peson{display:flex;align-items:stretch;gap:8px}
.peson input{text-align:center;font-size:26px;font-weight:300;letter-spacing:-0.01em;padding:10px 4px}
.peson button{width:58px;flex:none;border:1px solid var(--rule);border-radius:3px;font-size:24px;font-weight:300;background:var(--card)}
.raccourci{width:100%;margin-top:14px;padding:11px;border:1px solid var(--ink);border-radius:3px;
  font-size:14.5px;font-weight:600}
.mesures b{font-weight:600;color:var(--ink)}

main{padding:18px 18px 8px;max-width:640px;margin:0 auto;width:100%;overflow-x:hidden;min-width:0}
.vue{display:none;min-width:0}.vue.on{display:block}
section{margin-bottom:26px;min-width:0;max-width:100%;overflow-wrap:anywhere}
section h2{font-size:14px;font-weight:600;margin-bottom:10px}
.v-ajout section{margin-bottom:16px}
.v-ajout section h2{margin-bottom:7px}
.note{font-size:12.5px;color:var(--soft);font-weight:400;margin-top:8px;line-height:1.4}
.vide{color:var(--soft);font-size:14px;font-weight:300;padding:8px 0}
svg{display:block;width:100%;max-width:100%;height:auto}

.reste{margin:2px 0 6px}
.reste .val{font-size:56px;font-weight:300;letter-spacing:-0.035em;line-height:1}
.reste .val.depasse{color:var(--over)}
.reste .leg{font-size:13.5px;color:var(--soft);font-weight:300;margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;text-align:right;font-size:12.5px;color:var(--soft);padding:0 0 6px}
th:first-child{text-align:left}
td{padding:7px 0;border-top:1px solid var(--rule);text-align:right}
td:first-child{text-align:left}
.sous{color:var(--under)}.sur{color:var(--over)}

.jour{margin:22px 0 0;padding-top:14px;border-top:2px solid var(--ink)}
.jour:first-child{margin-top:0}
.jour-titre{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600}
.jour-titre .tot{font-size:17px}
.jour-sous{font-size:12px;color:var(--soft);font-weight:400;margin-top:2px;
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.repas-titre{display:flex;justify-content:space-between;font-size:12.5px;color:var(--soft);
  font-weight:600;margin:12px 0 0}
.ligne{display:flex;align-items:flex-start;gap:12px;padding:7px 0;border-top:1px solid var(--rule)}
.ligne .quoi{flex:1;min-width:0}
.ligne .detail{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.ligne.ouvert .detail{-webkit-line-clamp:unset;overflow:visible}
.ligne .macro{font-size:11.5px;color:var(--soft);font-weight:300;margin-top:2px}
.ligne .kcal{font-size:14px;white-space:nowrap;padding-top:1px}
.ligne .sup{font-size:18px;color:var(--soft);line-height:1;padding:0 2px 4px 8px;position:relative}
.ligne .sup::before{content:"";position:absolute;inset:-11px;min-width:44px;min-height:44px}
.puces{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.puces button{padding:6px 11px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--rule);border-radius:999px;
  font-size:12.5px;color:var(--soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puces button small{font-size:10px;font-weight:600;color:var(--ink)}
.zone{margin-top:12px;border:1px solid var(--rule);border-radius:5px;padding:18px;text-align:center;background:var(--card)}
.zone img{max-width:100%;border-radius:3px;display:block;margin:0 auto 10px}
.zone .taille{font-size:12px;color:var(--soft);font-weight:400;margin-top:8px}
.zone.compact-photo{padding:12px;margin-top:8px}
.zone.compact-photo .taille{margin-top:4px;line-height:1.35}
.zone.compact-photo>div:first-child{font-size:22px!important;margin-bottom:2px}
.deux{display:flex;gap:8px;margin-top:12px}
.deux button{flex:1;padding:11px;border:1px solid var(--ink);border-radius:3px;font-size:14px;font-weight:600}
.confirme{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.trois{display:flex;gap:7px;margin-top:9px}
.trois button{flex:1;padding:10px 4px;border:1px solid var(--ink);border-radius:3px;font-size:13.5px;font-weight:600}
.trois button#e-non{border-color:var(--rule);color:var(--soft);font-weight:400}
.aide{font-size:12.5px;color:var(--soft);font-weight:400;margin-top:8px;text-align:center}

nav{position:fixed;left:0;right:0;bottom:0;width:100vw;
  box-sizing:border-box;display:flex;flex-wrap:nowrap;align-items:stretch;
  height:calc(58px + env(safe-area-inset-bottom));
  min-height:calc(58px + env(safe-area-inset-bottom));
  max-height:calc(58px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--card);border-top:1px solid var(--rule);
  z-index:50;box-shadow:0 -3px 12px rgba(23,38,42,.08);
  transform:translateZ(0)}
nav button{flex:1 1 0;min-width:0;width:0;box-sizing:border-box;
  min-height:44px;padding:5px 2px 6px;font-size:11px;font-weight:500;color:var(--nav);
  border-top:3px solid transparent;margin-top:-1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.6;fill:none;flex:none}
nav button.on{color:var(--ink);font-weight:600;border-top-color:var(--ink)}

.ecran{max-width:420px;margin:0 auto;padding:40px 22px}
.ecran h1{font-size:26px;font-weight:300;letter-spacing:-0.02em;margin-bottom:6px}
.ecran p{color:var(--soft);font-size:14px;font-weight:300;margin:0 0 22px}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 5px}
input,textarea{width:100%;padding:11px 12px;font:inherit;font-size:15px;background:var(--card);
  color:var(--ink);border:1px solid var(--rule);border-radius:3px;-webkit-appearance:none}
textarea{min-height:78px;resize:vertical}
#a-desc{min-height:52px}
input::placeholder,textarea::placeholder{color:var(--soft);font-weight:300}
.primaire{width:100%;margin-top:18px;padding:13px;background:var(--ink);color:var(--paper);
  border-radius:3px;font-weight:600;font-size:15px}
.primaire[disabled]{opacity:.45}
.secondaire{width:100%;margin-top:14px;padding:12px;background:var(--card);color:var(--ink);
  border:1.5px solid var(--ink);border-radius:3px;font-weight:600;font-size:14.5px}
.histo{margin-top:18px}
.histo>h2{font-size:14px;font-weight:600;margin-bottom:4px}
.histo .note{margin-top:0;margin-bottom:10px}
.repas-cache{border:1px solid var(--rule);border-radius:4px;padding:12px 13px;margin-top:10px;background:var(--card)}
.repas-cache .tt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.repas-cache .tt b{font-size:16px;font-weight:600}
.repas-cache .quand{font-size:11.5px;color:var(--soft);font-weight:300;margin-top:2px}
.repas-cache .liste{font-size:13px;color:var(--soft);font-weight:300;margin-top:6px;line-height:1.4}
.repas-cache .reenr{margin-top:10px;padding:9px;border:1px solid var(--ink);border-radius:3px;font-size:13.5px;font-weight:600;width:100%}
/* Bloc Progression : réel (balance) vs théorique (déficit) */
.prog{display:flex;gap:10px;margin-top:4px}
.prog .col{flex:1;border:1px solid var(--rule);border-radius:6px;padding:13px 12px;background:var(--card);text-align:center;min-width:0}
.prog .col .lib{font-size:11.5px;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.prog .col .big{font-size:30px;font-weight:300;letter-spacing:-0.03em;line-height:1.05;margin-top:6px}
.prog .col .big.pos{color:var(--under)}
.prog .col .big.neg{color:var(--over)}
.prog .col .sub{font-size:12px;color:var(--soft);font-weight:300;margin-top:3px}
.prog-ryth{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;
  padding:11px 13px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}
.prog-ryth .k{font-size:13px;color:var(--soft);font-weight:400}
.prog-ryth .v{font-size:18px;font-weight:600}
.prog-accord{margin-top:12px;padding:11px 13px;border-radius:6px;font-size:13px;line-height:1.45;
  border:1px solid var(--rule)}
.prog-accord.ok{border-color:var(--under);background:color-mix(in srgb,var(--under) 8%,var(--card))}
.prog-accord.ecart{border-color:var(--over);background:color-mix(in srgb,var(--over) 8%,var(--card))}
.prog-accord b{font-weight:600}
.lien{display:block;width:100%;margin-top:14px;text-align:center;font-size:13.5px;color:var(--soft);
  text-decoration:underline;text-underline-offset:3px}
.alerte{margin-top:14px;font-size:13.5px;color:var(--over);line-height:1.4}
.bien{margin-top:14px;font-size:13.5px;color:var(--under);line-height:1.4}

.choix{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.choix button{padding:8px 13px;border:1px solid var(--rule);border-radius:999px;font-size:14px;color:var(--soft)}
.choix button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.repart{display:flex;gap:8px;margin-top:5px}
.repart-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.repart-i span{font-size:12px;color:var(--soft)}
.repart-i input{width:100%;text-align:center;padding:8px 4px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.photo{margin-top:14px;border:1px dashed var(--rule);border-radius:4px;padding:22px;text-align:center;
  color:var(--soft);font-size:14px;font-weight:300}
.photo img{max-width:100%;border-radius:3px;display:block;margin:0 auto}
.photo .taille{font-size:12px;margin-top:8px}

.bulle{padding:11px 13px;border-radius:12px;margin-bottom:10px;font-size:14.5px;line-height:1.5;
  max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.bulle.moi{background:var(--ink);color:var(--paper);margin-left:auto;border-bottom-right-radius:3px}
.bulle.coach{background:var(--card);border:1px solid var(--rule);border-bottom-left-radius:3px}

.resu{border:1px solid var(--rule);border-radius:4px;padding:14px;margin-top:16px;background:var(--card)}
.resu .tt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.resu .tt b{font-size:22px;font-weight:600}
.resu ul{list-style:none;margin:0;padding:0;font-size:14px}
.resu li{padding:5px 0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px}
.resu li span:last-child{color:var(--soft);white-space:nowrap}

.attente{display:inline-block;width:13px;height:13px;border:2px solid var(--rule);
  border-top-color:currentColor;border-radius:50%;vertical-align:-2px;margin-right:7px}
/* Scanner code-barres plein écran */
.scan-overlay{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
.scan-video{flex:1;width:100%;object-fit:cover;background:#000}
.scan-cadre{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scan-cadre .box{width:76%;max-width:340px;height:170px;border:2px solid rgba(255,255,255,.9);
  border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);position:relative}
.scan-cadre .box::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;
  background:var(--over);box-shadow:0 0 8px var(--over);opacity:.9}
.scan-haut{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  color:#fff;font-size:14px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:2}
.scan-bas{position:absolute;bottom:0;left:0;right:0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  display:flex;gap:10px;z-index:2}
.scan-bas button{flex:1;padding:13px;border-radius:8px;font-size:15px;font-weight:600;
  background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
.scan-bas button.stop{background:#fff;color:#111;border-color:#fff}
.scan-err{position:absolute;bottom:88px;left:16px;right:16px;z-index:2;color:#fff;text-align:center;
  font-size:13.5px;background:rgba(0,0,0,.5);padding:10px 12px;border-radius:8px}
/* Pastille Nutri-Score a..e */
.nutri{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;
  font-weight:700;font-size:15px;color:#fff;text-transform:uppercase;letter-spacing:0}
.nutri.a{background:#188040}.nutri.b{background:#7ac13c}.nutri.c{background:#f2c200;color:#3a2f00}
.nutri.d{background:#ea7c1b}.nutri.e{background:#d63636}
.nutri-lg{width:40px;height:40px;font-size:22px;border-radius:8px}
/* Bloc distribution Nutri-Score (onglet Courbes) */
.ns-tete{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ns-note{flex:none;width:58px;height:58px;border-radius:12px;background:var(--card);border:1px solid var(--rule);
  display:flex;align-items:baseline;justify-content:center;gap:1px}
.ns-note b{font-size:26px;font-weight:700;color:var(--ink);line-height:1}
.ns-note small{font-size:12px;color:var(--soft)}
.ns-tete-t{display:flex;flex-direction:column;gap:2px}
.ns-tete-t b{font-size:16px;font-weight:600;color:var(--ink)}
.ns-tete-t small{font-size:12.5px;color:var(--soft)}
.ns-barre{display:flex;width:100%;height:40px;border-radius:8px;overflow:hidden;background:var(--creux)}
.ns-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  color:#fff;min-width:0;transition:width .25s ease}
.ns-seg b{font-size:13px;font-weight:700}
.ns-seg small{font-size:10px;opacity:.92;margin-top:1px}
.ns-leg{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px}
.ns-leg-i{display:flex;align-items:center;gap:7px}
.ns-leg-i>div{display:flex;flex-direction:column;line-height:1.15}
.ns-leg-i b{font-size:14px;font-weight:600;color:var(--ink)}
.ns-leg-i small{font-size:11.5px;color:var(--soft)}
/* Panneau produit scanné */
.prod{border:1px solid var(--rule);border-radius:6px;padding:14px;background:var(--card);margin-top:4px}
.prod .haut{display:flex;align-items:flex-start;gap:12px}
.prod .haut .txt{flex:1;min-width:0}
.prod .haut .nom{font-size:16px;font-weight:600;line-height:1.25}
.prod .haut .marque{font-size:13px;color:var(--soft);font-weight:300;margin-top:2px}
.prod .p100{font-size:12.5px;color:var(--soft);font-weight:300;margin-top:10px;line-height:1.5}
.prod .qte-lab{font-size:13px;font-weight:600;margin:14px 0 6px}
.prod .raccourcis{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.prod .raccourcis button{padding:7px 12px;border:1px solid var(--rule);border-radius:999px;
  font-size:13px;color:var(--soft)}
.prod .raccourcis button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.prod .qte-saisie{display:flex;align-items:center;gap:8px}
.prod .qte-saisie input{flex:1}
.prod .qte-saisie .unite{font-size:14px;color:var(--soft);white-space:nowrap}
.prod .calc{margin-top:12px;padding:11px 13px;border:1px solid var(--rule);border-radius:6px;
  background:var(--paper);display:flex;justify-content:space-between;align-items:baseline}
.prod .calc .kc{font-size:22px;font-weight:600}
.prod .calc .mac{font-size:12px;color:var(--soft);font-weight:300}
@media (prefers-reduced-motion: no-preference){
  .attente{animation:tourne .7s linear infinite}
  @keyframes tourne{to{transform:rotate(360deg)}}
  .vue.on{animation:entree .18s ease-out}
  @keyframes entree{from{opacity:0}to{opacity:1}}
  .scan-cadre .box::after{animation:scanline 2s ease-in-out infinite}
  @keyframes scanline{0%,100%{transform:translateY(-70px)}50%{transform:translateY(70px)}}
}
</style>
</head>
<body>
<div id="racine"></div>
<script>
"use strict";
let dernierAppel=0;
const APP_VERSION='12/09/2026 15h05';
const VERSION_KEY='suivi.version.installee';
const S={cle:'suivi.config',cache:'suivi.dernier',chat:'suivi.chat',repas:'suivi.repas',
  cfg:null,data:null,vue:'jour',reglages:false,insp:null,inspCal:null,periode:30,periodeProg:30,
  ajout:{repas:'midi',confirm:null,dateAutre:'',photo:null,apercu:null,taille:0,desc:'',etat:null,message:'',resultat:null,histo:[],
    scan:{ouvert:false,etat:null,message:'',produit:null,mode:'portion',qte:0}},
  pesée:{etat:null,message:'',val:null},para:{etat:null,message:''},coach:{fil:[],etat:null}};

const $=(s,r)=>(r||document).querySelector(s);

/* ---------- clavier iOS ----------
   La nav a une géométrie verrouillée en CSS (hauteur fixe, box-sizing,
   largeurs de boutons bornées), donc le clavier ne peut plus la déformer.
   On ne masque plus la nav pendant la frappe : c'était la source du bug
   où elle restait rétrécie/décalée après navigation. Rien à faire ici. */
const nb=n=>(n===null||n===undefined||isNaN(n))?'\u2014':Math.round(n).toLocaleString('fr-FR');
const sgn=n=>(n===null||n===undefined||isNaN(n))?'\u2014':(n>0?'+':'')+Math.round(n).toLocaleString('fr-FR');
const jjmm=d=>d.slice(8,10)+'/'+d.slice(5,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const auj=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const dateLongue=()=>{const d=new Date();return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()];};
const formatVersion=v=>{const m=String(v||'').match(/^(\d{2}\/\d{2}\/\d{4})\s+(\d{2}h\d{2})$/);return m?m[1]+' à '+m[2]:String(v||'');};
/* jour de la semaine capitalisé à partir d'une date AAAA-MM-JJ, construite en heure locale */
const jourSemaine=s=>{
  if(!s)return '';
  const a=Number(s.slice(0,4)),m=Number(s.slice(5,7)),j=Number(s.slice(8,10));
  if(!a||!m||!j)return '';
  const n=JOURS[new Date(a,m-1,j).getDay()];
  return n.charAt(0).toUpperCase()+n.slice(1);
};
/* etiquette complete : 08/09 - Mardi */
const jjmmJour=s=>jjmm(s)+' - '+jourSemaine(s);

/* Cache des repas analysés/estimés, conservés après fermeture de l'app.
   On garde le repas actif (celui avec les boutons d'enregistrement) et
   jusqu'à 2 repas précédents, pour les retrouver et pouvoir les ré-enregistrer.
   Structure stockée : {actif:{...}|null, histo:[{...}, ...]} */
const MAX_HISTO=2;
function paquetRepas(){
  const A=S.ajout;
  if(!A.resultat)return null;
  return {repas:A.repas,desc:A.desc,resultat:A.resultat,confirm:A.confirm,message:A.message,quand:Date.now()};
}
function ecrireRepasCache(){
  try{
    const actif=paquetRepas();
    localStorage.setItem(S.repas,JSON.stringify({actif:actif,histo:(S.ajout.histo||[]).slice(0,MAX_HISTO)}));
  }catch(e){}
}
function lireRepasCache(){
  try{
    const raw=JSON.parse(localStorage.getItem(S.repas));
    if(!raw)return null;
    // compat : ancien format = un seul objet repas
    if(raw.resultat)return {actif:raw,histo:[]};
    return {actif:raw.actif||null,histo:Array.isArray(raw.histo)?raw.histo:[]};
  }catch(e){return null;}
}

async function appel(corps){
  const url=S.cfg.api.trim().replace(/\/+$/,'');
  const r=await fetch(url,{method:'POST',cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=UTF-8'},
    body:JSON.stringify(Object.assign({token:S.cfg.token.trim()},corps))});
  let j=null;
  try{j=await r.json();}catch(e){}
  if(r.status===429)throw new Error('Trop de requêtes vers Google Sheets. Attends une minute et réessaie.');
  if(!j)throw new Error('Le serveur a répondu '+r.status+' sans contenu lisible.');
  if(j.ok!==true)throw new Error(j.erreur||('Le serveur a répondu '+r.status+'.'));
  return j;
}
async function rafraichir(){
  const d=await appel({action:'data'});
  dernierAppel=Date.now();
  localStorage.setItem(S.cache,JSON.stringify(d));
  S.data=d;return d;
}

/* ---------- photo ---------- */
function redim(fichier){
  return new Promise((res,rej)=>{
    const img=new Image();
    const u=URL.createObjectURL(fichier);
    img.onload=()=>{
      URL.revokeObjectURL(u);
      const MAX=1024;
      let w=img.naturalWidth,h=img.naturalHeight;
      if(!w||!h){rej(new Error('Image illisible.'));return;}
      if(w>h&&w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      else if(h>=w&&h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');
      x.fillStyle='#ffffff';x.fillRect(0,0,w,h);
      x.drawImage(img,0,0,w,h);
      const url=c.toDataURL('image/jpeg',0.8);
      res({dataUrl:url,b64:url.split(',')[1],octets:Math.round(url.length*0.75)});
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Format d image non pris en charge.'));};
    img.src=u;
  });
}

/* ---------- scanner code-barres ---------- */
const ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js';
let zxingPromise=null;
function chargerZXing(){
  if(window.ZXingBrowser)return Promise.resolve(window.ZXingBrowser);
  if(zxingPromise)return zxingPromise;
  zxingPromise=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=ZXING_URL;s.async=true;
    s.onload=()=>window.ZXingBrowser?res(window.ZXingBrowser):rej(new Error('Bibliothèque de scan illisible.'));
    s.onerror=()=>{zxingPromise=null;rej(new Error('Impossible de charger le scanner. Vérifie ta connexion.'));};
    document.head.appendChild(s);
  });
  return zxingPromise;
}
let scanControls=null;
let scanEnCours=false;
function vibrer(ms){try{if(navigator.vibrate)navigator.vibrate(ms||60);}catch(e){}}
async function demarrerScan(){
  if(scanEnCours)return;
  scanEnCours=true;
  const SC=S.ajout.scan;
  SC.message='';
  let ZX;
  try{ZX=await chargerZXing();}
  catch(e){SC.etat='ko';SC.message=e.message;scanEnCours=false;rendre();return;}
  const video=document.getElementById('scan-video');
  if(!video){SC.etat=null;scanEnCours=false;return;}
  try{
    const hints=new Map();
    const F=ZX.BarcodeFormat, H=ZX.DecodeHintType;
    if(F&&H){
      hints.set(H.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E]);
    }
    const reader=new ZX.BrowserMultiFormatReader(hints);
    const onResult=(result,err,controls)=>{
      if(result){
        const code=result.getText?result.getText():String(result.text||result);
        if(code){controls&&controls.stop&&controls.stop();scanControls=null;onCodeScanne(code);}
      }
    };
    // decodeFromConstraints permet de forcer la caméra arrière ; repli sur decodeFromVideoDevice
    if(typeof reader.decodeFromConstraints==='function'){
      scanControls=await reader.decodeFromConstraints(
        {video:{facingMode:{ideal:'environment'}}},video,onResult);
    }else{
      scanControls=await reader.decodeFromVideoDevice(undefined,video,onResult);
    }
    // le flux est attaché à la vidéo : on ne re-rend PAS (cela détruirait l'élément).
    // on met juste à jour le texte du bandeau haut à la main.
    SC.etat='scan';
    scanEnCours=false;
    const haut=document.querySelector('.scan-haut');
    if(haut)haut.textContent='Vise le code-barres du produit';
  }catch(e){
    scanEnCours=false;
    SC.etat='ko';
    SC.message=/permission|denied|NotAllowed/i.test(e.name+e.message)
      ?'Accès caméra refusé. Autorise la caméra dans les réglages Safari.'
      :'Caméra indisponible. '+(e.message||'');
    rendre();
  }
}
function arreterScan(){
  try{if(scanControls&&scanControls.stop)scanControls.stop();}catch(e){}
  scanControls=null;
  scanEnCours=false;
}
function fermerScan(){
  arreterScan();
  S.ajout.scan.ouvert=false;S.ajout.scan.etat=null;
  rendre();
}
async function onCodeScanne(code){
  vibrer(70);
  const SC=S.ajout.scan;
  SC.ouvert=false;SC.etat='recherche';SC.message='';SC.produit=null;
  rendre();window.scrollTo(0,0);
  try{
    const r=await appel({action:'barcode',code:code});
    if(r.trouve===false){
      SC.etat='absent';SC.message=r.message||'Produit introuvable.';
      rendre();return;
    }
    const p=r.produit;
    SC.produit=p;SC.etat='ok';
    // quantité initiale : portion si dispo, sinon 100
    if(p.portion){SC.mode='portion';SC.qte=p.portion;}
    else{SC.mode='libre';SC.qte=100;}
    rendre();window.scrollTo(0,0);
  }catch(e){
    SC.etat='ko';SC.message=e.message;rendre();
  }
}
// calcule kcal + macros pour la quantité choisie
function calculProduit(p,grammes){
  const f=(grammes||0)/100;
  return {
    kcal:Math.round(p.per100.kcal*f),prot:Math.round(p.per100.prot*f),
    lip:Math.round(p.per100.lip*f),gluc:Math.round(p.per100.gluc*f)
  };
}

/* ---------- graphiques ---------- */
function serieCourbe(vals,opt){
  const w=320,h=opt.h||140,pt=16,pb=22,pl=4,pr=4,n=vals.length;
  if(n<2)return '<p class="vide">Deux points sont nécessaires pour tracer une courbe.</p>';
  let mn=Math.min.apply(null,vals.map(p=>p.v)),mx=Math.max.apply(null,vals.map(p=>p.v));
  if(mn===mx){mn-=1;mx+=1;}
  const pad=(mx-mn)*0.2;mn-=pad;mx+=pad;
  const X=i=>pl+(i/(n-1))*(w-pl-pr);
  const Y=v=>pt+(1-(v-mn)/(mx-mn))*(h-pt-pb);
  const dec=opt.dec||0,u=opt.unite||'',col=opt.couleur||'var(--ink)';
  let o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(opt.titre||'courbe')+'">';
  if(opt.aire){
    let a='M'+X(0).toFixed(1)+' '+Y(vals[0].v).toFixed(1)+' ';
    vals.forEach((p,i)=>{if(i)a+='L'+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)+' ';});
    a+='L'+X(n-1).toFixed(1)+' '+(h-pb)+' L'+X(0).toFixed(1)+' '+(h-pb)+' Z';
    o+='<path d="'+a+'" fill="'+col+'" opacity="0.12"/>';
  }
  if(opt.moyenne&&n>=5){
    const ms=[];
    vals.forEach((p,i)=>{const d=vals.slice(Math.max(0,i-6),i+1);ms.push(d.reduce((s,x)=>s+x.v,0)/d.length);});
    let m='';ms.forEach((v,i)=>{m+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';});
    o+='<path d="'+m+'" fill="none" stroke="var(--soft)" stroke-width="1" stroke-dasharray="3 3"/>';
  }
  let d='';vals.forEach((p,i)=>{d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)+' ';});
  o+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>';
  if(n<=40)vals.forEach((p,i)=>{o+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="2.3" fill="'+col+'"/>';});
  o+='<text x="'+(X(n-1)-2).toFixed(1)+'" y="'+(Y(vals[n-1].v)-8).toFixed(1)+'" text-anchor="end" font-size="11.5" font-weight="600" fill="'+col+'">'+vals[n-1].v.toFixed(dec)+u+'</text>';
  o+='<text x="'+(X(0)+2).toFixed(1)+'" y="'+(Y(vals[0].v)-8).toFixed(1)+'" font-size="10.5" font-weight="300" fill="var(--soft)">'+vals[0].v.toFixed(dec)+u+'</text>';
  o+='<text x="'+X(0).toFixed(1)+'" y="'+(h-5)+'" font-size="10.5" fill="var(--soft)" font-weight="300">'+jjmm(vals[0].date)+'</text>';
  o+='<text x="'+X(n-1).toFixed(1)+'" y="'+(h-5)+'" text-anchor="end" font-size="10.5" fill="var(--soft)" font-weight="300">'+jjmm(vals[n-1].date)+'</text>';
  return o+'</svg>';
}

function barresLigne(items,h){
  const w=320,pt=16,pb=20;
  if(!items.length)return '<p class="vide">Aucun jour complet pour l\'instant.</p>';
  const amp=Math.max(200,Math.max.apply(null,items.map(i=>Math.abs(i.v))));
  const zero=pt+(h-pt-pb)/2,ech=((h-pt-pb)/2)/amp,pas=w/items.length;
  const lg=Math.max(2,Math.min(15,pas*0.6));
  let o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Écart quotidien">';
  o+='<line x1="0" y1="'+zero+'" x2="'+w+'" y2="'+zero+'" stroke="var(--rule)"/>';
  items.forEach((it,i)=>{
    const cx=pas*(i+0.5),ht=Math.abs(it.v)*ech,y=it.v<0?zero:zero-ht;
    const sel=(S.insp&&S.insp.date===it.date);
    o+='<rect data-jour="'+it.date+'" x="'+(cx-lg/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+lg.toFixed(1)+
       '" height="'+Math.max(1,ht).toFixed(1)+'" fill="'+(it.v<0?'var(--under)':'var(--over)')+'" rx="1"'+
       (sel?' stroke="var(--ink)" stroke-width="1.4"':'')+'/>';
    if(sel)o+='<text x="'+cx.toFixed(1)+'" y="'+(it.v<0?zero+ht+11:zero-ht-4).toFixed(1)+
       '" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">'+sgn(it.v)+'</text>';
  });
  if(items.length>=5){
    let m='';
    items.forEach((it,i)=>{
      const d=items.slice(Math.max(0,i-6),i+1);
      const v=d.reduce((s,x)=>s+x.v,0)/d.length;
      m+=(i?'L':'M')+(pas*(i+0.5)).toFixed(1)+' '+(zero-v*ech).toFixed(1)+' ';
    });
    o+='<path d="'+m+'" fill="none" stroke="var(--ink)" stroke-width="1.3" opacity="0.7"/>';
  }
  o+='<text x="0" y="'+(zero-5)+'" font-size="10" fill="var(--soft)" font-weight="300">besoins du jour</text>';
  o+='<text x="0" y="'+(h-4)+'" font-size="10.5" fill="var(--soft)" font-weight="300">'+jjmm(items[0].date)+'</text>';
  o+='<text x="'+w+'" y="'+(h-4)+'" text-anchor="end" font-size="10.5" fill="var(--soft)" font-weight="300">'+jjmm(items[items.length-1].date)+'</text>';
  return o+'</svg>';
}

function calendrier(jours){
  const par={};jours.forEach(j=>{par[j.date]=j;});
  const sem=4,w=320,cell=Math.floor((w-28)/7),g=3;
  const fin=new Date();fin.setHours(12,0,0,0);
  const dec=(fin.getDay()+6)%7;
  const debut=new Date(fin);debut.setDate(debut.getDate()-dec-(sem-1)*7);
  const h=sem*(cell+g)+18;
  let o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Régularité des dernières semaines">';
  ['L','M','M','J','V','S','D'].forEach((d,i)=>{
    o+='<text x="'+(28+i*(cell+g)+cell/2)+'" y="10" text-anchor="middle" font-size="9.5" fill="var(--soft)" font-weight="300">'+d+'</text>';
  });
  for(let sm=0;sm<sem;sm++){
    for(let d=0;d<7;d++){
      const dt=new Date(debut);dt.setDate(dt.getDate()+sm*7+d);
      if(dt>fin)continue;
      const k=dt.toISOString().slice(0,10),j=par[k];
      const x=28+d*(cell+g),y=16+sm*(cell+g);
      const saisi=!!(j&&j.repas>=1&&j.kcal>0);
      let f='var(--creux)',op=1,cadre='';
      if(saisi&&j.ecart!==null){
        const inten=Math.min(1,Math.abs(j.ecart)/900);
        f=j.ecart<0?'var(--under)':'var(--over)';
        op=0.3+inten*0.7;
      }else if(saisi){f='var(--soft)';op=0.4;}
      if(S.inspCal&&S.inspCal.date===k)cadre=' stroke="var(--ink)" stroke-width="1.6"';
      o+='<rect data-jour-cal="'+k+'" x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+
         '" rx="2" fill="'+f+'" opacity="'+op.toFixed(2)+'"'+cadre+'></rect>';
      if(d===0)o+='<text x="0" y="'+(y+cell/2+3)+'" font-size="10px" fill="var(--soft)" font-weight="300">'+jjmm(k)+'</text>';
    }
  }
  return o+'</svg>';
}

function detailJour(d,date){
  if(!date)return '<p class="note">Touche une case pour voir la journée.</p>';
  const j=(d.jours||[]).filter(x=>x.date===date)[0];
  if(!j||!j.repas)return '<div class="detailjour"><b>'+jjmmJour(date)+'</b> \u00b7 aucune saisie ce jour-là.</div>';
  const lignes=(d.journal||[]).filter(r=>r.date===date);
  let o='<div class="detailjour"><b>'+jjmmJour(date)+'</b> \u00b7 '+nb(j.kcal)+' kcal';
  if(j.tdee)o+=' \u00b7 besoins '+nb(j.tdee)+' \u00b7 <span class="'+(j.ecart>0?'sur':'sous')+'">'+sgn(j.ecart)+'</span>';
  o+='<br><span style="color:var(--soft)">P '+nb(j.prot)+' \u00b7 L '+nb(j.lip)+' \u00b7 G '+nb(j.gluc)+
     ' \u00b7 '+j.repas+' repas</span>';
  lignes.forEach(r=>{o+='<br>'+esc(r.repas)+' \u00b7 '+esc((r.detail||'').slice(0,60))+' \u00b7 '+nb(r.kcal)+' kcal';});
  if(!lignes.length)o+='<br><span style="color:var(--soft)">Détail hors des 100 dernières saisies.</span>';
  return o+'</div>';
}

function jauge(conso,cible){
  if(!cible)return '';
  const w=320,h=30,maxi=Math.max(conso,cible)*1.06;
  const lx=(cible/maxi)*w,cx=Math.min((conso/maxi)*w,w),trop=conso>cible;
  let o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Consommé par rapport à la cible">';
  o+='<rect x="0" y="6" width="'+w+'" height="13" fill="var(--creux)" rx="1.5"/>';
  o+='<rect x="0" y="6" width="'+cx.toFixed(1)+'" height="13" fill="'+(trop?'var(--over)':'var(--under)')+'" rx="1.5"/>';
  o+='<line x1="'+lx.toFixed(1)+'" y1="1" x2="'+lx.toFixed(1)+'" y2="24" stroke="var(--ink)" stroke-width="1.5"/>';
  o+='<text x="'+(lx>w-70?lx-5:lx+5).toFixed(1)+'" y="'+(h-1)+'" text-anchor="'+(lx>w-70?'end':'start')+
     '" font-size="10.5" fill="var(--soft)" font-weight="300">cible '+nb(cible)+'</text>';
  return o+'</svg>';
}

function barreMacros(a){
  const tot=(a.prot*4)+(a.lip*9)+(a.gluc*4);

  const w=320,h=32;
  const seg=[['Protéines',a.prot*4,'var(--under)'],['Lipides',a.lip*9,'var(--over)'],['Glucides',a.gluc*4,'var(--ink)']];

    o+='<rect x="'+x.toFixed(1)+'" y="0" width="'+Math.max(0,lg-1.5).toFixed(1)+'" height="12" fill="'+s[2]+'" rx="1.5"/>';

    x+=lg;

/* ---------- vues ---------- */
const REPAS=[['matin','Matin'],['midi','Midi'],['encas','En-cas'],['soir','Soir'],['autre','Autre']];
function libelleRepas(r){return {matin:'Matin',midi:'Midi',soir:'Soir',encas:'En-cas',estim:'Estimation'}[r]||r;}

/* Répartition des cibles par repas. Stockée dans Params (colonne repartition)
   au format "matin/midi/encas/soir" en pourcentages entiers, ex "25/40/5/30".
   Renvoie des fractions {matin,midi,encas,soir}. Défaut 25/40/5/30. */
const REPART_DEFAUT={matin:25,midi:40,encas:5,soir:30};
function repartPct(d){
  const src=(d&&d.reference&&d.reference.repartition)?String(d.reference.repartition):'';
  const p=src.split('/').map(x=>parseInt(String(x).replace(/[^0-9]/g,''),10));
  if(p.length===4&&p.every(n=>!isNaN(n))&&p.reduce((a,b)=>a+b,0)>0)
    return {matin:p[0],midi:p[1],encas:p[2],soir:p[3]};
  return {...REPART_DEFAUT};
}
function repartFrac(d){
  const pct=repartPct(d),tot=pct.matin+pct.midi+pct.encas+pct.soir||100;
  return {matin:pct.matin/tot,midi:pct.midi/tot,encas:pct.encas/tot,soir:pct.soir/tot};
}
const ACTIV=[[1.2,'Sédentaire'],[1.375,'Peu actif'],[1.55,'Modérément actif'],[1.725,'Très actif'],[1.9,'Extrêmement actif']];

function couleurMacro(nom,v,t){
  if(!t)return '';
  const r=v/t;
  if(nom==='prot'){            // les protéines sont un plancher, pas un plafond
    if(r>=0.9)return 'sous';
    if(r>=0.7)return 'sur';
    return 'sur';
  }
  if(r<=1)return 'sous';
  if(r<=1.1)return '';
  return 'sur';
}

function vueJour(d){

  h+='<section><h2>Par Repas (Kcal)</h2><table><thead><tr><th>Repas</th><th>Mang\u00e9es</th><th>Pr\u00e9vu</th><th>\u00c9cart</th></tr></thead><tbody>';

  h+='</tbody></table><p class="note">R\u00e9partition r\u00e9gl\u00e9e : '+pc.matin+' % le matin, '+pc.midi+' % le midi, '+pc.encas+' % en-cas, '+pc.soir+' % le soir. Modifiable dans les R\u00e9glages.</p></section>';

  // Tableau P/L/G par repas (prevu vs consomme, avec ecart) sur le meme decoupage.
  if(c.prot||c.lip||c.gluc){

    REPAS.forEach(r=>{

    });

  }

  const m=d.moyennes;
  h+='<section><h2>Moyennes par jour</h2><table><thead><tr><th>Période</th><th>kcal</th><th>P</th><th>L</th><th>G</th></tr></thead><tbody>';
  function fleche(v){
    if(v===null||v===undefined||!c.kcal)return '';
    return v>c.kcal?' <span class="sur">\u25B2</span>':' <span class="sous">\u25BC</span>';
  }
  h+='<tr><td>Aujourd\'hui</td><td>'+nb(a.kcal)+fleche(a.kcal)+'</td><td>'+nb(a.prot)+'</td><td>'+nb(a.lip)+'</td><td>'+nb(a.gluc)+'</td></tr>';
  [['3 jours','j3'],['7 jours','j7'],['30 jours','j30']].forEach(p=>{
    const v=m[p[1]];
    h+='<tr><td>'+p[0]+'</td><td>'+nb(v.kcal)+fleche(v.kcal)+'</td><td>'+nb(v.prot)+'</td><td>'+nb(v.lip)+'</td><td>'+nb(v.gluc)+'</td></tr>';
  });
  h+='</tbody></table><p class="note">La flèche compare à ta cible. Les moyennes portent sur les jours pleins précédents (au moins deux repas), le jour en cours n\'est pas compté tant qu\'il n\'est pas terminé.</p></section>';
  return h;
}

function repasParHeure(){

}

/* Bloc Progression : compare la perte réelle (balance) au théorique (déficit).
   periode en jours (7, 30) ou 0 = tout l'historique. */
function progression(d,periode){
  const pes=(d.poids||[]).filter(x=>x&&x.date&&typeof x.poids==='number');
  const cumule=d.deficit&&d.deficit.cumule?d.deficit.cumule:[];
  if(pes.length<2&&cumule.length<2)
    return '<p class="vide">Pas encore assez de données. Ajoute quelques pesées et repas pour voir ta progression.</p>';

  // borne de début selon la période (fenêtre glissante à partir de la dernière pesée)
  const finDate=pes.length?pes[pes.length-1].date:(cumule.length?cumule[cumule.length-1].date:auj());
  let debutISO=null;
  if(periode>0){
    const f=new Date(finDate+'T00:00:00Z');f.setUTCDate(f.getUTCDate()-periode);
    debutISO=f.toISOString().slice(0,10);
  }
  // Poids estimé à une date donnée : interpolation linéaire entre les deux
  // pesées qui l'encadrent. Avant la première pesée -> première pesée.
  // Après la dernière -> dernière pesée. Pile sur une pesée -> sa valeur.
  const jours=iso=>Math.round((new Date(iso+'T00:00:00Z'))/86400000);
  function poidsAEstime(iso){
    if(!pes.length)return null;
    if(iso<=pes[0].date)return pes[0].poids;
    if(iso>=pes[pes.length-1].date)return pes[pes.length-1].poids;
    for(let i=0;i<pes.length-1;i++){
      const a=pes[i],b=pes[i+1];
      if(iso>=a.date&&iso<=b.date){
        if(iso===a.date)return a.poids;
        if(iso===b.date)return b.poids;
        const da=jours(a.date),db=jours(b.date),di=jours(iso);
        const t=(di-da)/(db-da);
        return a.poids+(b.poids-a.poids)*t;
      }
    }
    return pes[pes.length-1].poids;
  }
  // pesée de référence : réelle si "Tout", sinon poids estimé pile à la borne
  const pFin=pes.length?pes[pes.length-1]:null;
  let pRef=null,refDate=null,refEstime=false;
  if(pes.length){
    if(!debutISO){ pRef=pes[0]; refDate=pes[0].date; }
    else if(debutISO<=pes[0].date){ pRef=pes[0]; refDate=pes[0].date; }  // recul avant la 1re pesée
    else { const w=poidsAEstime(debutISO); pRef={date:debutISO,poids:w}; refDate=debutISO;
           refEstime=!pes.some(x=>x.date===debutISO); }
  }
  const reel=(pRef&&pFin)?(pFin.poids-pRef.poids):null; // <0 = perte

  // déficit théorique sur la même fenêtre : cumul(fin) - cumul(début)
  function cumulAt(iso){
    if(!cumule.length)return null;
    let v=cumule[0].cumul;
    for(let i=0;i<cumule.length;i++){if(cumule[i].date<=iso)v=cumule[i].cumul;else break;}
    return v;
  }
  let theoKg=null;
  if(cumule.length){
    const finK=cumule[cumule.length-1].cumul;
    const debK=debutISO?cumulAt(debutISO):0;
    theoKg=(finK-(debK||0))/7000; // <0 = perte prévue
  }

  // rythme réel hebdo
  let ryth=null,nbJours=null;
  if(pRef&&pFin&&refDate!==pFin.date){
    nbJours=Math.round((new Date(pFin.date+'T00:00:00Z')-new Date(refDate+'T00:00:00Z'))/86400000);
    if(nbJours>0)ryth=(reel/nbJours)*7;
  }

  function kg(v){return (v>0?'+':'')+v.toFixed(1);}
  const cls=v=>v===null?'':(v<0?'pos':(v>0?'neg':''));
  let h='<div class="prog">';
  h+='<div class="col"><div class="lib">Réel · balance</div><div class="big '+cls(reel)+'">'+
     (reel===null?'\u2014':kg(reel)+'<span style="font-size:16px"> kg</span>')+'</div>'+
     '<div class="sub">'+(pRef&&pFin?(refEstime?'~':'')+jjmm(refDate)+' \u2192 '+jjmm(pFin.date):'\u2014')+'</div></div>';
  h+='<div class="col"><div class="lib">Théorique · déficit</div><div class="big '+cls(theoKg)+'">'+
     (theoKg===null?'\u2014':kg(theoKg)+'<span style="font-size:16px"> kg</span>')+'</div>'+
     '<div class="sub">selon tes apports</div></div>';
  h+='</div>';

  if(ryth!==null){
    h+='<div class="prog-ryth"><span class="k">Rythme réel</span>'+
       '<span class="v '+cls(ryth)+'" style="color:'+(ryth<0?'var(--under)':(ryth>0?'var(--over)':'inherit'))+'">'+
       kg(ryth)+' kg / semaine</span></div>';
  }

  // accord réel vs théorique
  if(reel!==null&&theoKg!==null){
    const diff=reel-theoKg; // écart entre mesuré et prévu
    const proche=Math.abs(diff)<=0.8;
    h+='<div class="prog-accord '+(proche?'ok':'ecart')+'">';
    if(proche){
      h+='La balance et le calcul concordent (écart '+Math.abs(diff).toFixed(1)+' kg). '+
         'Ton estimation de besoins est bien calibrée, tu peux t\'y fier.';
    }else if(reel>theoKg){
      h+='<b>Tu perds moins vite que prévu</b> ('+Math.abs(diff).toFixed(1)+' kg d\'écart). '+
         'Soit tes besoins réels sont plus bas qu\'estimés, soit quelques apports passent sous le radar. '+
         'Vérifie les portions ou baisse un peu la cible.';
    }else{
      h+='<b>Tu perds plus vite que prévu</b> ('+Math.abs(diff).toFixed(1)+' kg d\'écart). '+
         'Tant mieux, mais garde un rythme tenable pour préserver ta masse musculaire.';
    }
    h+='</div>';
  }
  h+='<p class="note">Réel : différence de poids à la balance sur la période. Théorique : ce que ton déficit prévoit '+
     '(7000 kcal = 1 kg). L\'eau et la digestion font varier la balance au jour le jour, c\'est la tendance qui compte.</p>';
  return h;
}
function blocNutriscore(d){
  // Distribution des Nutri-Scores sur les seuls produits CONSOMMÉS.
  // d.journal ne contient que les repas enregistrés : les estimations
  // (repas 'estim') ne sont jamais écrites, donc elles sont exclues de fait.
  const N={a:0,b:0,c:0,d:0,e:0};
  let tot=0;
  (d.journal||[]).forEach(r=>{
    const s=String(r.nutriscore||'').trim().toLowerCase();
    if(/^[abcde]$/.test(s)){N[s]++;tot++;}
  });
  if(!tot)return '';
  const ORD=['a','b','c','d','e'];
  const COUL={a:'#188040',b:'#7ac13c',c:'#f2c200',d:'#ea7c1b',e:'#d63636'};
  const pct=g=>N[g]/tot*100;

  // Barre empilée : un segment par grade présent, largeur = part.
  let barre='<div class="ns-barre">';
  ORD.forEach(g=>{ if(N[g]) barre+='<span class="ns-seg" style="width:'+pct(g).toFixed(2)+'%;background:'+COUL[g]+'"'+
    ' title="'+g.toUpperCase()+' : '+Math.round(pct(g))+'%">'+
    (pct(g)>=11?'<b>'+g.toUpperCase()+'</b><small>'+Math.round(pct(g))+'%</small>':'')+'</span>'; });
  barre+='</div>';

  // Légende : une pastille + part + effectif par grade présent.
  let leg='<div class="ns-leg">';
  ORD.forEach(g=>{ if(N[g]) leg+='<div class="ns-leg-i"><span class="nutri '+g+'" style="width:22px;height:22px;font-size:13px">'+g.toUpperCase()+'</span>'+
    '<div><b>'+Math.round(pct(g))+'%</b><small>'+N[g]+(N[g]>1?' produits':' produit')+'</small></div></div>'; });
  leg+='</div>';

  // Score de qualité : moyenne pondérée A=5..E=1, sur 5, et lecture.
  const PTS={a:5,b:4,c:3,d:2,e:1};
  const moy=ORD.reduce((s,g)=>s+PTS[g]*N[g],0)/tot;
  let lecture,cls;
  if(moy>=4){lecture='Très bon panier : la majorité de tes produits emballés sont bien notés.';cls='bien';}
  else if(moy>=3){lecture='Panier correct. Viser un peu plus de A et B ferait la différence.';cls='';}
  else{lecture='Beaucoup de produits mal notés (D et E). C\'est le poste le plus simple à améliorer.';cls='alerte';}

  // En-tête : part de A et de B affichées séparément (pas regroupées).
  const tete=[];
  if(N.a)tete.push('<span class="nutri a" style="width:18px;height:18px;font-size:10px;vertical-align:-3px;margin-right:4px">A</span>'+Math.round(pct('a'))+'%');
  if(N.b)tete.push('<span class="nutri b" style="width:18px;height:18px;font-size:10px;vertical-align:-3px;margin-right:4px">B</span>'+Math.round(pct('b'))+'%');
  const teteTxt=tete.length?tete.join('<span style="color:var(--soft);margin:0 6px">·</span>'):'Aucun produit bien noté';

  let h='<section><h2>Qualité des produits scannés</h2>';
  h+='<div class="ns-tete"><div class="ns-note"><b>'+moy.toFixed(1).replace('.',',')+'</b><small>/5</small></div>'+
     '<div class="ns-tete-t"><b>'+teteTxt+'</b>'+
     '<small>sur '+tot+(tot>1?' produits consommés':' produit consommé')+'</small></div></div>';
  h+=barre+leg;
  h+='<p class="note '+cls+'">'+lecture+' Basé uniquement sur les produits que tu as enregistrés dans un repas, avec un Nutri-Score officiel Open Food Facts.</p>';
  h+='</section>';
  return h;
}

function vueJournal(d){
  if(!d.journal.length)return '<p class="vide">Rien d\'enregistré pour le moment. Passe par Ajouter.</p>';
  const infoJour={};(d.jours||[]).forEach(j=>{infoJour[j.date]=j;});
  const par={};d.journal.forEach((r,i)=>{r.__i=i;(par[r.date]=par[r.date]||[]).push(r);});
  let h='<section>';
  Object.keys(par).sort().reverse().forEach(k=>{
    const l=par[k],j=infoJour[k];
    const tot=j?j.kcal:l.reduce((s,r)=>s+r.kcal,0);
    const cible=j?j.cible:0;
    let cls='';
    if(cible)cls=(tot<=cible)?'sous':(tot<=cible*1.1?'':'sur');
    h+='<div class="jour"><div class="jour-titre"><span>'+jjmmJour(k)+'</span>'+
       '<span class="tot '+cls+'">'+nb(tot)+' kcal</span></div>';
    h+='<div class="jour-sous"><span>'+
       (cible?(tot<=cible?'sous la cible de '+nb(cible):'au-dessus de '+nb(cible))+' \u00b7 '+sgn(tot-cible):'aucune cible ce jour-là')+
       '</span><span>'+(j?'P '+nb(j.prot)+' \u00b7 L '+nb(j.lip)+' \u00b7 G '+nb(j.gluc):'')+'</span></div>';
    const groupes={};
    l.forEach(r=>{(groupes[r.repas]=groupes[r.repas]||[]).push(r);});
    Object.keys(groupes).forEach(nom=>{
      const g=groupes[nom],st=g.reduce((s,r)=>s+r.kcal,0);
      h+='<div class="repas-titre"><span>'+esc(nom)+'</span><span>'+nb(st)+' kcal</span></div>';
      g.forEach(r=>{
        const ns=String(r.nutriscore||'').trim().toLowerCase();
        const pastille=/^[abcde]$/.test(ns)?'<span class="nutri '+ns+'" style="width:20px;height:20px;font-size:12px;vertical-align:-4px;margin-right:6px">'+ns+'</span>':'';
        h+='<div class="ligne" data-ouvre="'+r.__i+'"><div class="quoi">'+
           '<div class="detail">'+pastille+esc(r.detail||'sans description')+'</div>'+
           '<div class="macro">P '+nb(r.prot)+' \u00b7 L '+nb(r.lip)+' \u00b7 G '+nb(r.gluc)+'</div></div>'+
           '<div class="kcal">'+nb(r.kcal)+' kcal</div>'+
           '<button class="sup" data-sup="'+r.__i+'" aria-label="Supprimer cette ligne">\u00d7</button></div>';
      });
    });
    h+='</div>';
  });
  return h+'</section>';
}

function bandeau(d){
  const r=d.reference;
  let m='';
  if(r.tdee){
    m='<div class="mesures">'+
      '<span><b>'+(r.poids?r.poids.toFixed(1):'\u2014')+'</b> kg</span>'+
      '<span>métabolisme <b>'+nb(r.mb)+'</b></span>'+
      '<span>besoins <b>'+nb(r.tdee)+'</b></span>'+
      '<span>cible <b>'+(r.cible?nb(r.cible):'\u2014')+'</b></span>'+
      '</div><span class="badge '+(r.ecart>0?'sur':'sous')+'">'+esc(r.mode)+
      (r.ecart!==null?' '+sgn(r.ecart)+' kcal/j':'')+'</span>';
  }
  const perime=(d.reference&&d.reference.date&&d.reference.date!==auj());
  if(perime)m+='<div class="perime">Ce relevé date du '+jjmm(d.reference.date)+
    '. Touche Actualiser pour passer à aujourd\'hui.</div>';
  return '<div class="bandeau"><div class="qui"><h1>'+esc(d.profil.prenom||'Suivi')+
    ' <span class="lejour">'+dateLongue()+'</span></h1>'+
    '<div><button class="roue" id="b-maj">Actualiser</button>'+
    '<button class="roue" id="b-reglages" style="margin-left:14px">'+(S.reglages?'Fermer':'Réglages')+'</button></div></div>'+m+'</div>';
}

function rendre(){
  const d=S.data,r=$('#racine');
  let h=bandeau(d)+'<main>';
  if(S.reglages){
    h+='<div class="vue on">'+vueRéglages(d)+'</div>';
  } else {
    h+='<div class="vue'+(S.vue==='jour'?' on':'')+'">'+vueJour(d)+'</div>';
    h+='<div class="vue v-ajout'+(S.vue==='ajout'?' on':'')+'">'+vueAjout(d)+'</div>';
    h+='<div class="vue'+(S.vue==='courbes'?' on':'')+'">'+vueCourbes(d)+'</div>';
    h+='<div class="vue'+(S.vue==='journal'?' on':'')+'">'+vueJournal(d)+'</div>';
    h+='<div class="vue'+(S.vue==='coach'?' on':'')+'">'+vueCoach()+'</div>';
  }
  h+='</main><nav>';
  VUES.forEach(v=>{h+='<button data-vue="'+v[0]+'" class="'+(!S.reglages&&S.vue===v[0]?'on':'')+'" aria-label="'+v[1]+'">'+v[2]+v[1]+'</button>';});
  r.innerHTML=h+'</nav>'+overlayScan();
  brancher();
}

function brancher(){
  const on=(sel,ev,fn)=>{const e=$(sel);if(e)e.addEventListener(ev,fn);};
  document.querySelectorAll('nav button').forEach(b=>{
    b.addEventListener('click',()=>{
      if(S.ajout.scan.ouvert){arreterScan();S.ajout.scan.ouvert=false;S.ajout.scan.etat=null;}
      S.vue=b.dataset.vue;S.reglages=false;rendre();window.scrollTo(0,0);
    });
  });
  on('#b-maj','click',async e=>{
    e.target.textContent='Mise à jour…';
    try{await actualiserApplication();await rafraichir();}
    catch(err){window.alert(err.message||'Impossible de mettre à jour l’application.');}
    rendre();
  });
  on('#b-reglages','click',()=>{S.reglages=!S.reglages;S.para.etat=null;rendre();window.scrollTo(0,0);});
  on('#g-actualiser','click',async e=>{
    e.target.disabled=true;e.target.textContent='Actualisation…';
    try{await actualiserApplication();await rafraichir();}
    catch(err){window.alert(err.message||'Impossible d’actualiser l’application.');}
    rendre();
  });

  document.querySelectorAll('#ch-repas button').forEach(b=>{
    b.addEventListener('click',()=>{
      S.ajout.desc=(($('#a-desc')||{}).value)||S.ajout.desc;
      S.ajout.repas=b.dataset.r;S.ajout.etat=null;rendre();
    });
  });
  document.querySelectorAll('[data-jour]').forEach(el=>{
    el.addEventListener('click',()=>{
      const k=el.getAttribute('data-jour');
      S.insp=(S.insp&&S.insp.date===k)?null:{date:k};
      rendre();
    });
  });
  document.querySelectorAll('[data-jour-cal]').forEach(el=>{
    el.addEventListener('click',()=>{
      const k=el.getAttribute('data-jour-cal');
      S.inspCal=(S.inspCal&&S.inspCal.date===k)?null:{date:k};
      rendre();
    });
  });
  document.querySelectorAll('#ch-periode button').forEach(b=>{
    b.addEventListener('click',()=>{S.periode=Number(b.dataset.p);rendre();});
  });
  document.querySelectorAll('#ch-periode-prog button').forEach(b=>{
    b.addEventListener('click',()=>{S.periodeProg=Number(b.dataset.pp);rendre();});
  });
  on('#j-ajout','click',()=>{S.vue='ajout';rendre();window.scrollTo(0,0);});
  on('#a-cam','click',()=>{const f=$('#a-photo');if(f)f.click();});
  on('#a-gal','click',()=>{const f=$('#a-galerie');if(f)f.click();});
  document.querySelectorAll('[data-ouvre]').forEach(l=>{
    l.addEventListener('click',e=>{
      if(e.target.closest('.sup'))return;
      l.classList.toggle('ouvert');
    });
  });
  ['#a-photo','#a-galerie'].forEach(sel=>on(sel,'change',async e=>{
    const f=e.target.files&&e.target.files[0];
    if(!f)return;
    S.ajout.desc=(($('#a-desc')||{}).value)||S.ajout.desc;
    try{
      const r=await redim(f);
      S.ajout.photo=r.b64;S.ajout.apercu=r.dataUrl;S.ajout.taille=r.octets;S.ajout.etat=null;
    }catch(err){S.ajout.etat='ko';S.ajout.message=err.message;}
    rendre();
  }));
  on('#a-retire','click',()=>{S.ajout.photo=null;S.ajout.apercu=null;S.ajout.taille=0;rendre();});

  // --- scanner code-barres ---
  on('#sc-ouvre','click',()=>{
    const SC=S.ajout.scan;SC.ouvert=true;SC.etat='demarrage';SC.message='';SC.produit=null;
    rendre();
  });
  on('#scan-fermer','click',fermerScan);
  // lance la caméra dès que l'overlay est dans le DOM
  if(S.ajout.scan.ouvert&&document.getElementById('scan-video')&&!scanControls&&S.ajout.scan.etat!=='ko'){
    demarrerScan();
  }
  on('#sc-relance','click',()=>{
    const SC=S.ajout.scan;SC.ouvert=true;SC.etat='demarrage';SC.message='';SC.produit=null;
    rendre();
  });
  on('#sc-oublie','click',()=>{S.ajout.scan.etat=null;S.ajout.scan.message='';rendre();});
  on('#sc-annule','click',()=>{S.ajout.scan.etat=null;S.ajout.scan.produit=null;rendre();});
  document.querySelectorAll('#sc-racc button').forEach(b=>{
    b.addEventListener('click',()=>{
      const SC=S.ajout.scan,p=SC.produit;SC.mode=b.dataset.m;
      if(SC.mode==='portion')SC.qte=p.portion;
      else if(SC.mode==='paquet')SC.qte=p.paquet;
      else if(!SC.qte||SC.qte===p.portion||SC.qte===p.paquet)SC.qte=100;
      rendre();
    });
  });
  on('#sc-qte','input',e=>{
    const v=Number(String(e.target.value).replace(',','.'));
    S.ajout.scan.qte=isNaN(v)?0:v;
    // maj live du calcul sans re-rendre tout (garde le focus clavier)
    const p=S.ajout.scan.produit;
    if(p){const c=calculProduit(p,S.ajout.scan.qte);
      const box=document.querySelector('.prod .calc');
      if(box)box.innerHTML='<div><div class="kc">'+nb(c.kcal)+' kcal</div>'+
        '<div class="mac">P '+nb(c.prot)+' · L '+nb(c.lip)+' · G '+nb(c.gluc)+' g pour '+nb(S.ajout.scan.qte)+' g</div></div>';
      const vb=$('#sc-valide');if(vb)vb.disabled=(S.ajout.scan.qte<=0);
    }
  });
  on('#sc-valide','click',()=>{
    const SC=S.ajout.scan,p=SC.produit,g=Number(SC.qte)||0;
    if(!p||g<=0)return;
    const c=calculProduit(p,g);
    const A=S.ajout;
    // basculer un éventuel repas actif en historique, comme une nouvelle analyse
    const precedent=paquetRepas();
    if(precedent)A.histo=[precedent].concat(A.histo||[]).slice(0,MAX_HISTO);
    const detail=p.nom+(p.marque?' ('+p.marque+')':'')+' · '+nb(g)+' g';
    A.resultat={
      repas:libelleRepas(A.repas),estimation:(A.repas==='estim'),
      aliments:[{nom:p.nom+(p.marque?' '+p.marque:''),quantite:nb(g)+' g',kcal:c.kcal}],
      total:c,incertitude:'faible',
      note:'Valeurs Open Food Facts'+(p.nutriscore?' · Nutri-Score '+p.nutriscore.toUpperCase():'')+'.',
      nutriscore:p.nutriscore||'',
      ligne:{repas:libelleRepas(A.repas),detail:detail,kcal:c.kcal,prot:c.prot,lip:c.lip,gluc:c.gluc,nutriscore:p.nutriscore||''}
    };
    A.confirm=null;A.dateAutre=auj();A.desc='';A.photo=null;A.apercu=null;A.taille=0;
    SC.etat=null;SC.produit=null;
    ecrireRepasCache();
    rendre();window.scrollTo(0,0);
  });

  on('#a-nouveau','click',()=>{
    const A=S.ajout;
    const actuel=paquetRepas();
    if(actuel)A.histo=[actuel].concat(A.histo||[]).slice(0,MAX_HISTO);
    A.resultat=null;A.confirm=null;A.message='';A.desc='';A.etat=null;
    A.photo=null;A.apercu=null;A.taille=0;A.repas=repasParHeure();
    ecrireRepasCache();
    rendre();window.scrollTo(0,0);
  });
  on('#a-vider-histo','click',()=>{
    if(!window.confirm('Effacer le repas en cours et tout l\'historique ?'))return;
    const A=S.ajout;
    A.histo=[];A.resultat=null;A.confirm=null;A.message='';A.desc='';A.etat=null;
    A.photo=null;A.apercu=null;A.taille=0;A.repas=repasParHeure();
    localStorage.removeItem(S.repas);
    rendre();window.scrollTo(0,0);
  });
  document.querySelectorAll('[data-histo-enr]').forEach(b=>{
    b.addEventListener('click',()=>{
      const i=Number(b.dataset.histoEnr);
      const item=(S.ajout.histo||[])[i];
      if(!item||!item.resultat)return;
      // on rend ce repas actif pour pouvoir l'enregistrer, l'ancien actif part en historique
      const A=S.ajout;
      const actuel=paquetRepas();
      A.histo=(A.histo||[]).filter((_,k)=>k!==i);
      if(actuel)A.histo=[actuel].concat(A.histo).slice(0,MAX_HISTO);
      A.resultat=item.resultat;A.repas=item.repas||A.repas;A.desc='';
      A.confirm=null;A.message='';A.dateAutre=auj();
      ecrireRepasCache();rendre();window.scrollTo(0,0);
    });
  });
  on('#a-desc','input',e=>{
    S.ajout.desc=e.target.value;
    const b=$('#a-envoi');
    if(b)b.disabled=(!S.ajout.photo&&!e.target.value.trim());
  });
  on('#a-envoi','click',async()=>{
    const A=S.ajout;
    A.desc=(($('#a-desc')||{}).value)||'';
    // l'ancien repas analysé bascule en historique (on en garde 2)
    const precedent=paquetRepas();
    A.etat='envoi';A.resultat=null;rendre();
    try{
      const r=await appel({action:'repas',repas:A.repas,description:A.desc,photo:A.photo||'',mime:'image/jpeg'});
      if(precedent)A.histo=[precedent].concat(A.histo||[]).slice(0,MAX_HISTO);
      A.etat=null;A.resultat=r;A.confirm=null;A.dateAutre=auj();
      A.photo=null;A.apercu=null;A.taille=0;A.desc='';
      ecrireRepasCache();
    }catch(e){A.etat='ko';A.message=e.message;}
    rendre();
  });

  async function enregistrer(date){
    const A=S.ajout,l=A.resultat&&A.resultat.ligne;
    if(!l)return;
    A.confirm='envoi';rendre();
    try{
      const r=await appel(Object.assign({action:'enregistrer',date:date},l));
      await rafraichir();
      A.confirm='fait';
      A.message=nb(r.kcal)+' kcal enregistrées en '+r.repas+' le '+jjmm(r.date)+'.';
      ecrireRepasCache();
    }catch(e){A.confirm='ko';A.message=e.message;}
    rendre();
  }
  on('#e-auj','click',()=>enregistrer(auj()));
  on('#e-autre','click',()=>{S.ajout.confirm='date';rendre();});
  on('#e-non','click',()=>{S.ajout.confirm='refus';rendre();});
  on('#e-date','change',e=>{S.ajout.dateAutre=e.target.value;});
  on('#e-valide','click',()=>enregistrer(S.ajout.dateAutre||auj()));

  function litPoids(){
    const e=$('#p-val');
    const v=Number(String((e&&e.value)||'').replace(',','.'));
    return isNaN(v)?null:Math.round(v*10)/10;
  }
  on('#p-moins','click',()=>{const v=litPoids();S.pesée.val=Math.max(30,(v===null?S.pesée.val:v)-0.1);S.pesée.etat=null;rendre();});
  on('#p-plus','click',()=>{const v=litPoids();S.pesée.val=Math.min(300,(v===null?S.pesée.val:v)+0.1);S.pesée.etat=null;rendre();});
  on('#p-val','input',()=>{const v=litPoids();if(v!==null)S.pesée.val=v;});
  on('#p-envoi','click',async()=>{
    const v=litPoids();
    if(v===null||v<30||v>300){
      S.pesée.etat='ko';
      S.pesée.message='Saisis un poids entre 30 et 300 kg.';
      rendre();return;
    }
    S.pesée.val=v;
    S.pesée.etat='envoi';rendre();
    try{
      const r=await appel({action:'poids',poids:v,date:auj()});
      await rafraichir();
      S.pesée.etat='ok';
      S.pesée.message=r.poids+' kg enregistrés. Métabolisme et besoins recalculés.';
    }catch(e){S.pesée.etat='ko';S.pesée.message=e.message;}
    rendre();
  });

  document.querySelectorAll('#ch-act button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('#ch-act button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    });
  });
  function lireRepart(){
    const o={};
    document.querySelectorAll('#ch-repart input[data-rp]').forEach(i=>{
      o[i.dataset.rp]=parseInt(String(i.value).replace(/[^0-9]/g,''),10)||0;
    });
    return o;
  }
  document.querySelectorAll('#ch-repart input[data-rp]').forEach(i=>{
    i.addEventListener('input',()=>{
      const o=lireRepart(),t=(o.matin||0)+(o.midi||0)+(o.encas||0)+(o.soir||0);
      const el=document.getElementById('repart-tot');
      if(el)el.innerHTML='Total : '+t+' %.'+(t===100?' \u2713':' La somme doit faire 100.')+' Ce d\u00e9coupage pilote les tableaux \u00ab Par repas \u00bb du jour, dans l\'appli et sur Telegram.';
    });
  });
  on('#g-envoi','click',async()=>{
    const cible=(($('#g-cible')||{}).value)||'';
    const sel=$('#ch-act button.on');
    const f=sel?sel.dataset.f:'';
    const o=lireRepart();
    const t=(o.matin||0)+(o.midi||0)+(o.encas||0)+(o.soir||0);
    if(t!==100){S.para.etat='ko';S.para.message='La répartition par repas doit totaliser 100 % (actuellement '+t+' %).';rendre();return;}
    const repartition=o.matin+'/'+o.midi+'/'+o.encas+'/'+o.soir;
    S.para.etat='envoi';rendre();
    try{
      const r=await appel({action:'params',cible:cible,facteur:f,repartition:repartition});
      await rafraichir();
      S.para.etat='ok';
      S.para.message='Cible '+r.cible+' kcal, '+(r.activite||r.activité||'')+'. Programme en '+String(r.mode).toLowerCase()+
        (r.ecart!==null?' de '+Math.abs(r.ecart)+' kcal par jour.':'.');
    }catch(e){S.para.etat='ko';S.para.message=e.message;}
    rendre();
  });

  document.querySelectorAll('[data-sup]').forEach(b=>{
    b.addEventListener('click',async()=>{
      const l=S.data.journal[Number(b.dataset.sup)];
      if(!l)return;
      if(!window.confirm('Supprimer '+(l.detail||l.repas)+' ?'))return;
      b.textContent='\u2026';
      try{
        await appel({action:'suppr',date:l.date,repas:l.repas,detail:l.detail,kcal:l.kcal});
        await rafraichir();
      }catch(e){window.alert(e.message);}
      rendre();
    });
  });

  on('#c-envoi','click',async()=>{
    const q=((($('#c-q')||{}).value)||'').trim();
    if(!q)return;
    S.coach.fil.push({role:'moi',texte:q});
    S.coach.etat='envoi';rendre();
    try{
      const r=await appel({action:'conseil',question:q,
        historique:S.coach.fil.slice(-6).map(m=>({role:m.role,texte:m.texte}))});
      S.coach.fil.push({role:'coach',texte:r.texte});
    }catch(e){S.coach.fil.push({role:'coach',texte:e.message});}
    S.coach.etat=null;
    localStorage.setItem(S.chat,JSON.stringify(S.coach.fil.slice(-20)));
    rendre();
    window.scrollTo(0,document.body.scrollHeight);
  });
  on('#c-vider','click',()=>{S.coach.fil=[];localStorage.removeItem(S.chat);rendre();});

  const ok=$('#r-ok');
  if(ok){
    ok.addEventListener('click',()=>{
      ecrireCfg({api:$('#r-api').value.trim(),token:$('#r-token').value.trim()});
      S.reglages=false;demarrer();
    });
    $('#r-out').addEventListener('click',()=>{
      [S.cle,S.cache,S.chat,S.repas].forEach(k=>localStorage.removeItem(k));
      S.cfg=null;S.data=null;connexion();
    });
  }
}

function connexion(msg){
  $('#racine').innerHTML=
    '<div class="ecran"><h1>Suivi</h1>'+
    '<p>Colle l\'adresse de ton serveur et le code fourni par le bot, menu Application. Une seule fois.</p>'+
    '<label for="c-api">Adresse de l\'API</label>'+
    '<input id="c-api" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://\u2026/webhook/nutrition/api">'+
    '<label for="c-token">Code d\'accès</label>'+
    '<input id="c-token" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="24 caractères">'+
    '<button class="primaire" id="c-ok">Se connecter</button>'+
    (msg?'<p class="alerte">'+esc(msg)+'</p>':'')+'</div>';
  $('#c-ok').addEventListener('click',()=>{
    const api=$('#c-api').value.trim(),token=$('#c-token').value.trim();
    if(!api||!token){connexion('Renseigne les deux champs.');return;}
    ecrireCfg({api:api,token:token});demarrer();
  });
}

async function demarrer(){
  S.ajout.repas=repasParHeure();
  S.cfg=S.cfg||lireCfg();
  if(!S.cfg||!S.cfg.api||!S.cfg.token){connexion();return;}
  try{S.coach.fil=JSON.parse(localStorage.getItem(S.chat))||[];}catch(e){S.coach.fil=[];}
  const cache=lireRepasCache();
  if(cache){
    S.ajout.histo=Array.isArray(cache.histo)?cache.histo.slice(0,MAX_HISTO):[];
    const a=cache.actif;
    if(a&&a.resultat){
      S.ajout.repas=a.repas||S.ajout.repas;
      S.ajout.desc=a.desc||'';
      S.ajout.resultat=a.resultat;
      S.ajout.confirm=a.confirm||null;
      S.ajout.message=a.message||'';
      S.ajout.dateAutre=auj();
    }
  }
  const vieux=lireCache();
  if(vieux){S.data=vieux;rendre();}
  try{await rafraichir();rendre();}
  catch(e){
    if(S.data)return;
    connexion(e.message+' Vérifie l\'adresse et le code.');
  }
}

function jourChange(){
  return !!(S.data&&S.data.reference&&S.data.reference.date&&S.data.reference.date!==auj());
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(S.ajout.scan.ouvert){arreterScan();S.ajout.scan.ouvert=false;S.ajout.scan.etat=null;rendre();}return;}
  if(!S.cfg||!S.data||S.reglages)return;
  // on force le rafraichissement si on a changé de jour, sinon un par minute au plus
  if(!jourChange()&&Date.now()-dernierAppel<60000)return;
  rafraichir().then(rendre).catch(()=>{});
});
// controle du passage de minuit tant que l'app reste ouverte
setInterval(()=>{
  if(document.hidden||!S.cfg||!S.data)return;
  if(jourChange())rafraichir().then(rendre).catch(()=>{});
},60000);
async function actualiserApplication(){
  if(!('serviceWorker' in navigator))return;
  const registration=await navigator.serviceWorker.ready;
  await registration.update();
  const worker=registration.waiting||registration.installing;
  if(!worker)return;
  if(worker.state==='installing'){
    await new Promise(resolve=>worker.addEventListener('statechange',()=>{
      if(worker.state==='installed')resolve();
    }));
  }
  worker.postMessage({type:'SKIP_WAITING'});
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data&&e.data.type==='VERSION_ACTIVATED'){
      localStorage.setItem(VERSION_KEY,e.data.version);
      if(S.data)rendre();
    }
  });
  // Bascule automatique quand un nouveau SW prend la main.
  // Garde-fou : on ne recharge qu'une fois, jamais au tout premier lancement.
  let rechargEnCours=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(rechargEnCours)return;
    rechargEnCours=true;
    window.location.reload();
  });
  window.addEventListener('load',async()=>{try{
    const registration=await navigator.serviceWorker.register('./sw.js');
    await registration.update();
  }catch(e){}});
}
if(!localStorage.getItem(VERSION_KEY))localStorage.setItem(VERSION_KEY,APP_VERSION);
demarrer();
</script>
