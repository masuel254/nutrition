<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Suivi</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F2F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10181A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Suivi">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3F1; --card:#FFFFFF; --ink:#17262A; --soft:#5A6B6E; --nav:#7A8A8C;
  --rule:#D4D9D6; --under:#16715C; --over:#B85C15; --focus:#16715C; --creux:#E3E5E3; --ambre:#C79A2E; --jaune:#D6A400; --rouge:#C22E2E;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#10181A; --card:#172224; --ink:#E8ECEA; --soft:#9BA8A3; --nav:#AEBDBF;
         --rule:#2A383A; --under:#3DA88C; --over:#D8853A; --focus:#3DA88C; --creux:#252A2B; --ambre:#D9B443; --jaune:#E5B93A; --rouge:#E05555; }
}
*{box-sizing:border-box}
/* Coquille d'application : le document ne défile JAMAIS. Seul #defile défile, la barre
   est un élément normal en bas d'une colonne flex. Sur iOS en mode écran d'accueil, un
   position:fixed dépend du défilement du document et WebKit finit par le décaler
   (bug connu, non corrigeable côté CSS de la barre) : on supprime donc la cause. */
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iOS zoome sur tout champ de saisie dont le texte fait moins de 16 px, et ne dézoome pas
   toujours ensuite : l'écran reste agrandi et décalé sur le côté. Tous les champs à 16 px mini. */
input:not([type=range]),textarea,select{font-size:max(16px,1em)}
#racine{display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden}
#defile{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
h1,h2{font-weight:600;margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}

.bandeau{padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--rule)}
.bandeau .qui{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bandeau h1{font-size:19px;letter-spacing:-0.01em}
.lejour{font-size:13px;font-weight:300;color:var(--soft);display:block;margin-top:1px}
.perime{margin-top:9px;padding:7px 10px;border-radius:4px;background:var(--over);color:var(--paper);
  font-size:12.5px;font-weight:400;line-height:1.35}
.bandeau .roue{font-size:13px;color:var(--soft);padding:4px 2px}
.mesures{display:flex;gap:6px 0;margin-top:8px;font-size:13px;color:var(--soft);font-weight:300;flex-wrap:wrap}
.mesures span{padding-right:10px;margin-right:10px;border-right:1px solid var(--rule)}
.mesures span:last-child{border-right:none;padding-right:0;margin-right:0}
.badge{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.badge.sous{background:var(--under);color:var(--paper)}
.badge.sur{background:var(--over);color:var(--paper)}
.conso{font-size:14px;color:var(--soft);font-weight:300;margin-top:10px;text-align:center}
.conso b{font-weight:600;color:var(--ink)}
.rappel{font-size:13px;margin-top:10px;line-height:1.45}
.periode{display:flex;gap:6px;margin-bottom:12px}
.periode-ligne{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.periode-ligne .periode{margin-bottom:0;flex-wrap:wrap}
.periode-delta{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.periode-delta .pd-lib{font-size:10.5px;color:var(--soft);font-weight:300}
.periode-delta .pd-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.periode button{padding:5px 12px;border:1px solid var(--rule);border-radius:999px;font-size:12.5px;color:var(--soft)}
.periode button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.courbe-tabs{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.courbe-tabs button{flex:1;padding:9px 0;font-size:14px;color:var(--soft);background:transparent;border:none;font-weight:400}
.courbe-tabs button.on{background:var(--ink);color:var(--paper);font-weight:600}
.detailjour{margin-top:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;
  background:var(--card);font-size:13px;line-height:1.5}
.detailjour b{font-weight:600}
.peson{display:flex;align-items:stretch;gap:8px}
.peson input{text-align:center;font-size:26px;font-weight:300;letter-spacing:-0.01em;padding:10px 4px}
.peson button{width:58px;flex:none;border:1px solid var(--rule);border-radius:3px;font-size:24px;font-weight:300;background:var(--card)}
.raccourci{width:100%;margin-top:14px;padding:11px;border:1px solid var(--ink);border-radius:3px;
  font-size:14.5px;font-weight:600}
.mesures b{font-weight:600;color:var(--ink)}

main{padding:18px 18px 8px;max-width:640px;margin:0 auto;width:100%;overflow-x:hidden;min-width:0}
.vue{display:none;min-width:0}.vue.on{display:block}
section{margin-bottom:26px;min-width:0;max-width:100%;overflow-wrap:anywhere}
section h2{font-size:14px;font-weight:600;margin-bottom:10px}
.v-ajout section{margin-bottom:16px}
.v-ajout section h2{margin-bottom:7px}
.note{font-size:12.5px;color:var(--soft);font-weight:400;margin-top:8px;line-height:1.4}
.vide{color:var(--soft);font-size:14px;font-weight:300;padding:8px 0}
svg{display:block;width:100%;max-width:100%;height:auto}

.reste{margin:2px 0 6px}
.cal-anneau{display:flex;flex-direction:column;align-items:center;margin:6px 0 2px}
.cal-pastille{margin-top:10px;padding:8px 18px;border-radius:999px;color:var(--paper);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cal-anneau svg{width:160px;height:160px;max-width:52vw;max-height:52vw}
.reste .val{font-size:56px;font-weight:300;letter-spacing:-0.035em;line-height:1}
.reste .val.depasse{color:var(--over)}
.reste .leg{font-size:13.5px;color:var(--soft);font-weight:300;margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;text-align:right;font-size:12.5px;color:var(--soft);padding:0 0 6px}
th:first-child{text-align:left}
td{padding:7px 0;border-top:1px solid var(--rule);text-align:right}
td:first-child{text-align:left}
.sous{color:var(--under)}.sur{color:var(--over)}

.jour{margin:22px 0 0;padding-top:14px;border-top:2px solid var(--ink)}
.jour:first-child{margin-top:0}
.jour-titre{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600}
.jour-titre .tot{font-size:17px}
.jour-sous{font-size:12px;color:var(--soft);font-weight:400;margin-top:2px;
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.repas-titre{display:flex;justify-content:space-between;font-size:12.5px;color:var(--soft);
  font-weight:600;margin:12px 0 0}
.ligne{display:flex;align-items:flex-start;gap:12px;padding:7px 0;border-top:1px solid var(--rule)}
.ligne .quoi{flex:1;min-width:0}
.ligne .detail{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.ligne.ouvert .detail{-webkit-line-clamp:unset;overflow:visible}
.ligne .macro{font-size:11.5px;color:var(--soft);font-weight:300;margin-top:2px}
.ligne .kcal{font-size:14px;white-space:nowrap;padding-top:1px}
.ligne .sup{font-size:18px;color:var(--soft);line-height:1;padding:0 2px 4px 8px;position:relative}
.ligne .sup::before{content:"";position:absolute;inset:-11px;min-width:44px;min-height:44px}
.ligne .jmod{font-size:15px;color:var(--soft);line-height:1;padding:0 2px 4px 6px;position:relative;background:none;border:none}
.ligne .jmod::before{content:"";position:absolute;inset:-11px;min-width:44px;min-height:44px}
.puces{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.puces button{padding:6px 11px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--rule);border-radius:999px;
  font-size:12.5px;color:var(--soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puces button small{font-size:10px;font-weight:600;color:var(--ink)}
.zone{margin-top:12px;border:1px solid var(--rule);border-radius:5px;padding:18px;text-align:center;background:var(--card)}
.zone img{max-width:100%;border-radius:3px;display:block;margin:0 auto 10px}
.zone .taille{font-size:12px;color:var(--soft);font-weight:400;margin-top:8px}
.zone.compact-photo{padding:12px;margin-top:8px}
.zone.compact-photo .taille{margin-top:4px;line-height:1.35}
.zone.compact-photo>div:first-child{font-size:22px!important;margin-bottom:2px}
.deux{display:flex;gap:8px;margin-top:12px}
.deux button{flex:1;padding:11px;border:1px solid var(--ink);border-radius:3px;font-size:14px;font-weight:600}
.confirme{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.trois{display:flex;gap:7px;margin-top:9px}
.trois button{flex:1;padding:10px 4px;border:1px solid var(--ink);border-radius:3px;font-size:13.5px;font-weight:600}
.trois button#e-non{border-color:var(--rule);color:var(--soft);font-weight:400}
.aide{font-size:12.5px;color:var(--soft);font-weight:400;margin-top:8px;text-align:center}

nav{position:relative;flex:none;width:100%;
  box-sizing:border-box;display:flex;flex-wrap:nowrap;align-items:stretch;
  height:calc(58px + env(safe-area-inset-bottom));
  min-height:calc(58px + env(safe-area-inset-bottom));
  max-height:calc(58px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--card);border-top:1px solid var(--rule);
  z-index:50;box-shadow:0 -3px 12px rgba(23,38,42,.08)}
nav button{flex:1 1 0;min-width:0;width:0;box-sizing:border-box;
  min-height:44px;padding:5px 2px 6px;font-size:11px;font-weight:500;color:var(--nav);
  border-top:3px solid transparent;margin-top:-1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.6;fill:none;flex:none}
nav button.on{color:var(--ink);font-weight:600;border-top-color:var(--ink)}

.ecran{max-width:420px;margin:0 auto;padding:40px 22px}
.ecran h1{font-size:26px;font-weight:300;letter-spacing:-0.02em;margin-bottom:6px}
.ecran p{color:var(--soft);font-size:14px;font-weight:300;margin:0 0 22px}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 5px}
input,textarea{width:100%;padding:11px 12px;font:inherit;font-size:16px;background:var(--card);
  color:var(--ink);border:1px solid var(--rule);border-radius:3px;-webkit-appearance:none}
textarea{min-height:78px;resize:vertical}
#a-desc{min-height:52px}
input::placeholder,textarea::placeholder{color:var(--soft);font-weight:300}
.primaire{width:100%;margin-top:18px;padding:13px;background:var(--ink);color:var(--paper);
  border-radius:3px;font-weight:600;font-size:15px}
.primaire[disabled]{opacity:.45}
.secondaire{width:100%;margin-top:14px;padding:12px;background:var(--card);color:var(--ink);
  border:1.5px solid var(--ink);border-radius:3px;font-weight:600;font-size:14.5px}
.histo{margin-top:18px}
.histo>h2{font-size:14px;font-weight:600;margin-bottom:4px}
.histo .note{margin-top:0;margin-bottom:10px}
.repas-cache{border:1px solid var(--rule);border-radius:4px;padding:12px 13px;margin-top:10px;background:var(--card)}
.repas-cache .tt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.repas-cache .tt b{font-size:16px;font-weight:600}
.repas-cache .quand{font-size:11.5px;color:var(--soft);font-weight:300;margin-top:2px}
.repas-cache .liste{font-size:13px;color:var(--soft);font-weight:300;margin-top:6px;line-height:1.4}
.repas-cache .reenr{margin-top:10px;padding:9px;border:1px solid var(--ink);border-radius:3px;font-size:13.5px;font-weight:600;width:100%}
/* Bloc Progression : réel (balance) vs théorique (déficit) */
.prog{display:flex;gap:10px;margin-top:4px}
.prog .col{flex:1;border:1px solid var(--rule);border-radius:6px;padding:13px 12px;background:var(--card);text-align:center;min-width:0}
.prog .col .lib{font-size:11.5px;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.prog .col .big{font-size:30px;font-weight:300;letter-spacing:-0.03em;line-height:1.05;margin-top:6px}
.prog .col .big.pos{color:var(--under)}
.prog .col .big.neg{color:var(--over)}
.prog .col .sub{font-size:12px;color:var(--soft);font-weight:300;margin-top:3px}
.prog-ryth,.ryth-poids{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;
  padding:11px 13px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}
.prog-ryth .k,.ryth-poids .k{font-size:13px;color:var(--soft);font-weight:400}
.prog-ryth .v,.ryth-poids .v{font-size:18px;font-weight:600}
.prog-accord{margin-top:12px;padding:11px 13px;border-radius:6px;font-size:13px;line-height:1.45;
  border:1px solid var(--rule)}
.prog-accord.ok{border-color:var(--under);background:color-mix(in srgb,var(--under) 8%,var(--card))}
.prog-accord.ecart{border-color:var(--over);background:color-mix(in srgb,var(--over) 8%,var(--card))}
.prog-accord b{font-weight:600}
.lien{display:block;width:100%;margin-top:14px;text-align:center;font-size:13.5px;color:var(--soft);
  text-decoration:underline;text-underline-offset:3px}
.alerte{margin-top:14px;font-size:13.5px;color:var(--over);line-height:1.4}
.bien{margin-top:14px;font-size:13.5px;color:var(--under);line-height:1.4}

.choix{display:flex;flex-wrap:wrap;gap:7px;margin-top:5px}
.choix button{padding:8px 13px;border:1px solid var(--rule);border-radius:999px;font-size:14px;color:var(--soft)}
.choix button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.choix-repas{margin:2px 0 12px}
.repart{display:flex;gap:8px;margin-top:5px}
.repart-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.repart-i span{font-size:12px;color:var(--soft)}
.repart-i input{width:100%;text-align:center;padding:8px 4px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.photo{margin-top:14px;border:1px dashed var(--rule);border-radius:4px;padding:22px;text-align:center;
  color:var(--soft);font-size:14px;font-weight:300}
.photo img{max-width:100%;border-radius:3px;display:block;margin:0 auto}
.photo .taille{font-size:12px;margin-top:8px}

.bulle{padding:11px 13px;border-radius:12px;margin-bottom:10px;font-size:14.5px;line-height:1.5;
  max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.bulle.moi{background:var(--ink);color:var(--paper);margin-left:auto;border-bottom-right-radius:3px}
.bulle.coach{background:var(--card);border:1px solid var(--rule);border-bottom-left-radius:3px}

.resu{border:1px solid var(--rule);border-radius:4px;padding:14px;margin-top:16px;background:var(--card)}
.resu .tt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.resu .tt b{font-size:22px;font-weight:600}
.resu ul{list-style:none;margin:0;padding:0;font-size:14px}
.resu li{padding:5px 0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px}
.resu li span:last-child{color:var(--soft);white-space:nowrap}
.resu .resu-al li{display:block}
/* Aliment sur deux lignes : nom (entier) + kcal + croix ; puis stepper dessous */
.al-tete{display:flex;align-items:baseline;gap:8px}
.al-nom{flex:1;min-width:0;line-height:1.3}
.al-kc{color:var(--soft);white-space:nowrap;flex:0 0 auto;font-variant-numeric:tabular-nums}
.al-sup{flex:0 0 auto;background:none;border:none;color:var(--soft);font-size:18px;line-height:1;padding:0 0 0 4px;align-self:center}
.al-ctrl{display:flex;align-items:center;gap:8px;margin-top:5px}
.al-ctrl .al-mm{width:30px;height:30px;border:1px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.al-q{font-size:13px;color:var(--soft);min-width:0}
.al-q.fixe{margin-top:2px}
.resu-al .al-plg{display:flex;justify-content:space-between;gap:10px;margin-top:2px}
.resu-al .al-plg span:last-child{color:var(--soft)}

.attente{display:inline-block;width:13px;height:13px;border:2px solid var(--rule);
  border-top-color:currentColor;border-radius:50%;vertical-align:-2px;margin-right:7px}
/* Scanner code-barres plein écran */
.scan-overlay{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
.modale-fond{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.modale{background:var(--card);color:var(--ink);border-radius:14px;padding:20px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modale-txt{font-size:15px;line-height:1.45;margin:0 0 18px}
.modale-btns{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.modale-btns .primaire{width:auto;margin:0;padding:10px 18px}
.modale-btns .primaire.danger{background:var(--over)}
.modale-btns .lien{width:auto;margin:0;padding:10px 6px}
.scan-video{flex:1;width:100%;object-fit:cover;background:#000}
.scan-cadre{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scan-cadre .box{width:76%;max-width:340px;height:170px;border:2px solid rgba(255,255,255,.9);
  border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);position:relative}
.scan-cadre .box::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;
  background:var(--over);box-shadow:0 0 8px var(--over);opacity:.9}
.scan-haut{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  color:#fff;font-size:14px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:2}
.scan-bas{position:absolute;bottom:0;left:0;right:0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  display:flex;gap:10px;z-index:2}
.scan-bas button{flex:1;padding:13px;border-radius:8px;font-size:15px;font-weight:600;
  background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
.scan-bas button.stop{background:#fff;color:#111;border-color:#fff}
.scan-err{position:absolute;bottom:88px;left:16px;right:16px;z-index:2;color:#fff;text-align:center;
  font-size:13.5px;background:rgba(0,0,0,.5);padding:10px 12px;border-radius:8px}
/* Pastille Nutri-Score a..e */
.nutri{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;
  font-weight:700;font-size:15px;color:#fff;text-transform:uppercase;letter-spacing:0}
.nutri.a{background:#188040}.nutri.b{background:#7ac13c;color:#17262A}.nutri.c{background:#f2c200;color:#3a2f00}
.nutri.d{background:#ea7c1b}.nutri.e{background:#d63636}
.nutri-lg{width:40px;height:40px;font-size:22px;border-radius:8px}
/* Bloc distribution Nutri-Score (onglet Courbes) */
.ns-tete{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ns-note{flex:none;width:58px;height:58px;border-radius:12px;background:var(--card);border:1px solid var(--rule);
  display:flex;align-items:baseline;justify-content:center;gap:1px}
.ns-note b{font-size:26px;font-weight:700;color:var(--ink);line-height:1}
.ns-note small{font-size:12px;color:var(--soft)}
.ns-tete-t{display:flex;flex-direction:column;gap:2px}
.ns-tete-t b{font-size:16px;font-weight:600;color:var(--ink)}
.ns-tete-t small{font-size:12.5px;color:var(--soft)}
.ns-barre{display:flex;width:100%;height:40px;border-radius:8px;overflow:hidden;background:var(--creux)}
.ns-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  color:#fff;min-width:0;transition:width .25s ease}
.ns-seg b{font-size:13px;font-weight:700}
.ns-seg small{font-size:10px;opacity:.92;margin-top:1px}
.ns-leg{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px}
.ns-leg-i{display:flex;align-items:center;gap:7px}
.ns-leg-i>div{display:flex;flex-direction:column;line-height:1.15}
.ns-leg-i b{font-size:14px;font-weight:600;color:var(--ink)}
.ns-leg-i small{font-size:11.5px;color:var(--soft)}
/* Panneau produit scanné */
.prod{border:1px solid var(--rule);border-radius:6px;padding:14px;background:var(--card);margin-top:4px}
.prod .haut{display:flex;align-items:flex-start;gap:12px}
.prod .haut .txt{flex:1;min-width:0}
.prod .haut .nom{font-size:16px;font-weight:600;line-height:1.25}
.prod .haut .marque{font-size:13px;color:var(--soft);font-weight:300;margin-top:2px}
.prod .p100{font-size:12.5px;color:var(--soft);font-weight:300;margin-top:10px;line-height:1.5}
.micro{font-size:11.5px;color:var(--soft);font-weight:300;margin-top:6px;line-height:1.4}
/* Bloc Recents (historique aliments repliable) */
.recents{padding:2px 0}
.recents-tete{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;padding:6px 0;font-size:14px;color:var(--soft);cursor:pointer}
.recents-n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;font-size:11px;font-weight:600;color:var(--paper);background:var(--nav);border-radius:999px;text-align:center;line-height:16px}
.recents-cr{color:var(--ink);font-weight:600}
.recents-chev{color:var(--soft);font-size:16px;transition:transform .15s}
.recents-chev.o{transform:rotate(90deg)}
.recents-puces{display:flex;gap:7px;overflow-x:auto;padding:6px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.recents-puces::-webkit-scrollbar{display:none}
.puce{flex:0 0 auto;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);font-size:13px}
.puce-ic{color:var(--soft);font-weight:700;letter-spacing:-1px;margin-right:5px;font-size:12px}
.puce-r{border-style:dashed}
/* Anneaux P/L/G (onglet Jour) */
.anneaux{display:flex;justify-content:space-around;gap:8px;margin:-6px 0 2px}
.anneaux svg{flex:0 0 auto}
.anneaux-leg{display:flex;justify-content:space-around;gap:6px;margin:2px 0 14px}
.anneaux-leg>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.mac-pastille{max-width:100%;padding:6px 10px;border-radius:999px;color:var(--paper);font-size:13.5px;font-weight:700;line-height:1.2;text-align:center;font-variant-numeric:tabular-nums}
.mac-sur{font-size:11px;color:var(--soft);font-weight:300}
@media (max-width:400px){.mac-pastille{font-size:12px;padding:5px 8px}}
/* Liste Par repas repliable */
.repas-liste{margin-top:2px}
.rep-ligne{border-top:1px solid var(--rule);padding:9px 0;cursor:pointer}
.rep-ligne:first-child{border-top:none}
.rep-tete{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rep-nom{font-size:15px;font-weight:400}
.rep-chev{display:inline-block;color:var(--soft);font-size:15px;margin-left:6px;transition:transform .15s}
.rep-ligne.ouvert .rep-chev{transform:rotate(90deg)}
.rep-kcal{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rep-cible{color:var(--soft);font-weight:300}
.rep-detail{display:none;gap:14px;margin-top:7px;font-size:12.5px;color:var(--soft);font-weight:300}
.rep-ligne.ouvert .rep-detail{display:flex}
.rep-micro{display:none}
.rep-ligne.ouvert .rep-micro{display:block}
.rep-micro .micro{margin-top:4px}
.rep-ligne:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.rep-detail span{white-space:nowrap}
/* Accordeon moyennes */
.accord summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
.accord summary::-webkit-details-marker{display:none}
.accord summary h2{margin:0}
.accord summary::after{content:"\203A";color:var(--soft);font-size:18px;transition:transform .15s}
.accord[open] summary::after{transform:rotate(90deg)}
.prod .qte-lab{font-size:13px;font-weight:600;margin:14px 0 6px}
.prod .raccourcis{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.prod .raccourcis button{padding:7px 12px;border:1px solid var(--rule);border-radius:999px;
  font-size:13px;color:var(--soft)}
.prod .raccourcis button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.prod .qte-saisie{display:flex;align-items:center;gap:8px}
.prod .qte-saisie input{flex:1}
.prod .qte-saisie .unite{font-size:14px;color:var(--soft);white-space:nowrap}
.prod .stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.prod .stepper-lab{font-size:13px;color:var(--soft)}
.prod .stepper-ctrl{display:flex;align-items:center;gap:2px}
.prod .stepper-ctrl button{width:40px;height:40px;border:1px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.prod .stepper-ctrl button:disabled{opacity:.35}
.prod .stepper-val{min-width:34px;text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.prod .calc{margin-top:12px;padding:11px 13px;border:1px solid var(--rule);border-radius:6px;
  background:var(--paper);display:flex;justify-content:space-between;align-items:baseline}
.prod .calc .kc{font-size:22px;font-weight:600}
.prod .calc .mac{font-size:12px;color:var(--soft);font-weight:300}
/* Purines */
.pur{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-size:11.5px;color:var(--soft);white-space:nowrap}
.pur::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--under);flex:none}
.pur.p-m::before{background:var(--ambre)}
.pur.p-e::before{background:var(--over)}
.pur.p-e{color:var(--over);font-weight:600}
.pur-tete{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px;font-size:15px}
.pur-tete b{font-size:22px;font-weight:600}
.pur-lib{font-size:12.5px;color:var(--soft)}
.pur7-t{font-size:12.5px;font-weight:600;margin:14px 0 6px}
.pur7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pur7-c{border-radius:8px;padding:7px 1px;text-align:center;display:flex;flex-direction:column;gap:1px;border:1.5px solid transparent;min-width:0}
.pur7-c .j{font-size:10.5px;opacity:.85;white-space:nowrap}
.pur7-c b{font-size:15px;font-variant-numeric:tabular-nums}
.pur7-c .u{font-size:9.5px;opacity:.8}
.pur7-c.bas{background:color-mix(in srgb,var(--under) 22%,var(--card))}
.pur7-c.moyen{background:color-mix(in srgb,var(--ambre) 32%,var(--card))}
.pur7-c.haut{background:var(--over);color:#fff}
.pur7-c.vide{background:var(--creux);color:var(--soft)}
.pur7-c.auj{border-color:var(--ink)}
.mes-aide p{margin:6px 0 0}
.mes-aide b{color:var(--ink);font-weight:600}
.goutte{border:1px solid var(--over);border-left-width:4px;border-radius:6px;padding:10px 13px;background:color-mix(in srgb,var(--over) 8%,var(--card))}
.goutte-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--over);margin-bottom:4px}
.goutte p{margin:6px 0 0;font-size:13.5px;line-height:1.45}
.goutte p:first-of-type{margin-top:0}
.pur-top{margin-top:12px;border:1px solid var(--rule);border-radius:6px;background:var(--card);padding:9px 12px}
.pur-top-t{font-size:12px;color:var(--soft);font-weight:600;margin-bottom:4px}
.pur-top-l{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--rule)}
.pur-top-l:first-of-type{border-top:none}
.pur-top-l span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.pur-top-l b{white-space:nowrap;color:var(--over)}
/* Corps */
.pas-saisie{margin-top:8px;display:flex;gap:8px;align-items:stretch}
.pas-saisie input{flex:1;min-width:0}
.pas-saisie .secondaire{width:auto;margin:0;padding:11px 16px;flex:none}
.mes-saisie{margin-top:14px}
.cmp-dates{display:flex;gap:10px;margin-top:10px}
.cmp-dates label{flex:1;margin:0;font-size:12px;color:var(--soft);font-weight:600;display:flex;flex-direction:column;gap:4px}
.cmp-dates select{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink);-webkit-appearance:none}
.cmp{position:relative;width:100%;aspect-ratio:3/4;margin-top:10px;border-radius:8px;overflow:hidden;background:var(--creux)}
.cmp-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cmp-avant{position:absolute;inset:0}
.cmp-trait{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.5);pointer-events:none}
.cmp-eti{position:absolute;top:8px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600}
.cmp-eti.g{left:8px}.cmp-eti.d{right:8px}
#k-cmp-r{width:100%;margin-top:10px;padding:0;border:none;background:none;height:30px;-webkit-appearance:auto;appearance:auto;accent-color:var(--ink)}
.cmp-info{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--soft);margin-top:2px}
/* Appareil photo d'évolution */
.cam .scan-video.miroir{transform:scaleX(-1)}
.cam-fantome{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35;pointer-events:none}
.cam-apercu{flex:1;width:100%;height:100%;object-fit:contain;background:#000}
.cam-compte{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:300;color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
.cam .scan-bas button{padding:13px 6px;font-size:14px}
.cam .scan-bas button:disabled{opacity:.45}
@media (prefers-reduced-motion: no-preference){
  .attente{animation:tourne .7s linear infinite}
  @keyframes tourne{to{transform:rotate(360deg)}}
  .vue.on{animation:entree .18s ease-out}
  @keyframes entree{from{opacity:0}to{opacity:1}}
  .scan-cadre .box::after{animation:scanline 2s ease-in-out infinite}
  @keyframes scanline{0%,100%{transform:translateY(-70px)}50%{transform:translateY(70px)}}
}
/* Raccourcis Ajouter : refaire un repas, composer avec ses aliments */
.rac{margin-bottom:22px}
.rac-acc{border:1px solid var(--rule);border-radius:12px;background:var(--card);margin-bottom:10px}
.rac-tete{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left}
.rac-ic{width:36px;height:36px;border-radius:9px;background:var(--creux);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.rac-t{flex:1;min-width:0}.rac-t b{display:block;font-size:16px;font-weight:600}.rac-t small{display:block;font-size:12.5px;color:var(--soft)}
.rac-ch{font-size:20px;color:var(--soft);transition:transform .15s;flex:none}
.rac-acc.o .rac-ch{transform:rotate(90deg)}
.rac-contenu{border-top:1px solid var(--rule);padding:12px}
.rac-onglets{flex-wrap:wrap}
.rac-repas{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--paper);margin-bottom:8px}
.rac-rt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rac-rt b{font-size:14.5px}.rac-rt span{font-size:13px;color:var(--soft);white-space:nowrap}
.rac-repas small{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
.rac-repas small.rac-ancien{font-style:italic}
.rac-btns{display:flex;gap:8px;margin-top:9px}
.rac-btns button{flex:1;padding:10px 6px;border-radius:8px;font-weight:700;font-size:14px}
.rac-btns .p{background:var(--under);color:var(--paper)}
.rac-btns .s{border:1px solid var(--rule);color:var(--ink)}
.rac-cherche{margin-bottom:10px}
.rac-grille{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rac-tuile{border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--paper);display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-width:0}
.rac-tuile[hidden]{display:none}
.rac-tn{min-width:0}.rac-tn b{display:block;font-size:14px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.rac-tn small{display:block;font-size:11.5px;color:var(--soft);margin-top:2px}
.rac-tuile.sel{border:2px solid var(--under);padding:9px;background:color-mix(in srgb,var(--under) 12%,var(--paper))}
.rac-pas{display:flex;align-items:center;justify-content:space-between}
.rac-pas.zero{justify-content:flex-end}
.rac-pas button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--rule);font-size:20px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;line-height:1}
.rac-pas button.pl{background:var(--under);border-color:var(--under);color:var(--paper)}
.rac-pas span{font-size:17px;font-weight:700}
.rac-barre{position:sticky;bottom:8px;z-index:2;width:100%;margin-top:12px;padding:13px 14px;border-radius:10px;background:var(--ink);color:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:15px}
.rac-barre[disabled]{opacity:.55}
/* Journal par semaines */
.jn-t{font-size:12px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.jn-t:first-child{margin-top:0}
.jn-carte{border:1px solid var(--rule);border-radius:12px;background:var(--card);overflow:hidden}
.jn-carte.jn-dans{border:none;border-top:1px solid var(--rule);border-radius:0}
.jn-j{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-top:1px solid var(--rule);text-align:left}
.jn-carte>.jn-j:first-child{border-top:none}
.jn-j.o{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.jn-d{width:96px;flex:none;font-size:14px;font-weight:600}.jn-d small{display:block;font-weight:400;color:var(--soft);font-size:11.5px}
.jn-bar{flex:1;min-width:30px;height:8px;border-radius:4px;background:var(--creux);position:relative;overflow:hidden}
.jn-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.jn-k{width:74px;flex:none;text-align:right;font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.jn-k small{display:block;font-weight:400;font-size:11px;color:var(--soft)}
.jn-ch{color:var(--soft);font-size:18px;flex:none;transition:transform .15s}
.jn-j.o .jn-ch,.jn-sem.o>.jn-sem-t .jn-ch{transform:rotate(90deg)}
.jn-det{padding:0 14px 12px;border-top:1px solid var(--rule)}
.jn-det .repas-titre:first-child{margin-top:10px}
.jn-sem{border:1px solid var(--rule);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.jn-sem-t{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left}
.jn-sem-n{flex:1;min-width:0}.jn-sem-n b{display:block;font-size:15px}.jn-sem-n small{display:block;font-size:12px;color:var(--soft);margin-top:2px}
.jn-moy{flex:none;text-align:right;font-size:15px;white-space:nowrap;line-height:1.3;font-variant-numeric:tabular-nums}
.jn-moy small{font-size:11.5px;color:var(--soft)}.jn-moy small.e{display:block}
.jn-plus{width:100%;padding:13px;border:1px dashed var(--rule);border-radius:12px;color:var(--ink);font-weight:600;font-size:14.5px;margin-top:6px}
/* Objectif de poids */
.obj-tete{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.obj-tete b{font-size:19px}
.obj-reste{font-weight:700;font-size:15px}
.obj-barre{height:10px;border-radius:5px;background:var(--creux);margin:10px 0 4px;overflow:hidden}
.obj-barre i{display:block;height:100%;border-radius:5px;background:var(--under)}
.obj-bornes{display:flex;justify-content:space-between;font-size:11.5px;color:var(--soft)}
.obj-l{list-style:none;margin:10px 0 0;padding:0;font-size:13.5px;line-height:1.45}
.obj-l li{padding:3px 0}
/* Bilan de la semaine dernière (Journal) */
.bilan-s{border:1px solid var(--rule);border-left:4px solid var(--under);border-radius:10px;background:var(--card);padding:12px 14px;margin-bottom:6px}
.bilan-t{font-weight:700;font-size:15px;margin-bottom:6px}.bilan-t small{font-weight:400;color:var(--soft);font-size:12.5px;margin-left:4px}
.bilan-s ul{list-style:none;margin:0;padding:0;font-size:13.5px;line-height:1.45}
.bilan-s li{padding:2px 0}
/* Écran Jour, version C : anneau compact + barres de macros, onglets en bas */
.hero{display:flex;align-items:center;gap:14px}
.hero .cal-anneau{margin:0;flex:none}
.hero .cal-anneau svg{width:140px;height:140px;max-width:38vw;max-height:38vw}
.hero-d{flex:1;min-width:0}
.hero-d .cal-pastille{display:inline-block;margin:0 0 6px;font-size:15px;padding:6px 12px}
.hm{margin-top:8px;font-size:12.5px}
.hm-l{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}.hm-l b{font-weight:600}
.hm-e{font-weight:700;white-space:nowrap}
.hm-b{height:7px;border-radius:4px;background:var(--creux);margin-top:3px;overflow:hidden}
.hm-b i{display:block;height:100%;border-radius:4px}
.vg{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--over);border-left:4px solid var(--over);border-radius:10px;padding:10px 12px;font-size:14px;text-align:left;background:color-mix(in srgb,var(--over) 8%,var(--card))}
.vg b{color:var(--over)}
.vg-n{margin-left:auto;background:var(--over);color:var(--paper);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.vg-ch{color:var(--soft);font-size:18px;transition:transform .15s}
.vg[aria-expanded="true"] .vg-ch{transform:rotate(90deg)}
.vg+.goutte{margin-top:8px}
.seg{display:flex;background:var(--creux);border-radius:10px;padding:3px;margin:0 0 12px}
.seg button{flex:1;min-width:0;padding:8px 2px;border-radius:8px;font-size:13.5px;color:var(--soft);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
details.aide{margin-top:10px}
details.aide summary{font-size:13px;color:var(--soft);cursor:pointer}
.cg-per{display:flex;gap:6px;margin:0 0 10px}
.cg-per button{flex:1;min-width:0;padding:6px 0;border:1px solid var(--rule);border-radius:999px;font-size:12.5px;color:var(--soft)}
.cg-per button.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.tuiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.tu{border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:9px 10px;min-width:0}
.tu small{display:block;font-size:10.5px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
"use strict";
let dernierAppel=0;
const APP_VERSION='29/09/2026 21h24';
const VERSION_KEY='suivi.version.installee';
const S={cle:'suivi.config',cache:'suivi.dernier',chat:'suivi.chat',repas:'suivi.repas',foods:'suivi.foods',pending:'suivi.pending',
  cfg:null,data:null,vue:'jour',reglages:false,insp:null,inspCal:null,crb:{onglet:'poids',per:30},
  ajout:{repas:'midi',confirm:null,dateAutre:'',photo:null,apercu:null,taille:0,desc:'',etat:null,message:'',resultat:null,enregistre:null,ajoutEnCours:false,histo:[],
    scan:{ouvert:false,etat:null,message:'',produit:null,mode:'portion',qte:0,mult:1}},
  foods:[],recentsOuv:false,jour:{onglet:'repas',alerteOuv:false},jn:{ouv:null,nbSem:4,charge:{},err:{}},rac:{ouvR:false,ouvC:false,crR:null,crC:null,sel:{},q:'',msg:'',liste:[]},file:[],att:[],attFait:null,attEtat:null,attDernier:0,man:{ouvert:false,als:[],msg:'',cr:null},courbeVue:'poids',
  pesée:{etat:null,message:'',val:null},regl:{obj:null,ecart:null},regTab:'objectif',prof:{etat:null,message:'',sexe:null},
  adm:{etat:null,message:'',comptes:null,invitations:[],cree:null,prenom:''},cpt:{etat:null,message:''},ins:null,gt:{quand:'auj',date:'',art:null,int:null,rem:'',etat:null,message:''},para:{etat:null,message:''},coach:{fil:[],etat:null},
  corps:{onglet:'pesee',periodePas:14,selBar:{},pasEtat:null,pasMsg:'',mesEtat:null,mesMsg:'',photoMsg:'',cmpType:'face',cmpA:null,cmpB:null,courbe:'taille'},
  cam:{ouvert:false}};

const $=(s,r)=>(r||document).querySelector(s);

/* ---------- clavier iOS ----------
   La nav a une géométrie verrouillée en CSS (hauteur fixe, box-sizing,
   largeurs de boutons bornées), donc le clavier ne peut plus la déformer.
   On ne masque plus la nav pendant la frappe : c'était la source du bug
   où elle restait rétrécie/décalée après navigation. Rien à faire ici. */
const nb=n=>(n===null||n===undefined||isNaN(n))?'\u2014':Math.round(n).toLocaleString('fr-FR');
const sgn=n=>(n===null||n===undefined||isNaN(n))?'\u2014':(n>0?'+':'')+Math.round(n).toLocaleString('fr-FR');
const jjmm=d=>d.slice(8,10)+'/'+d.slice(5,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const auj=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
// YYYY-MM-DD en heure LOCALE (pas UTC) a partir d'un objet Date.
// toISOString convertit en UTC : a l'est de Greenwich l'ete, ca peut renvoyer la veille.
const isoLocal=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const dateLongue=()=>{const d=new Date();return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()];};
const formatVersion=v=>{const m=String(v||'').match(/^(\d{2}\/\d{2}\/\d{4})\s+(\d{2}h\d{2})$/);return m?m[1]+' à '+m[2]:String(v||'');};
/* jour de la semaine capitalisé à partir d'une date AAAA-MM-JJ, construite en heure locale */
const jourSemaine=s=>{
  if(!s)return '';
  const a=Number(s.slice(0,4)),m=Number(s.slice(5,7)),j=Number(s.slice(8,10));
  if(!a||!m||!j)return '';
  const n=JOURS[new Date(a,m-1,j).getDay()];
  return n.charAt(0).toUpperCase()+n.slice(1);
};
/* etiquette complete : 08/09 - Mardi */
const jjmmJour=s=>jjmm(s)+' - '+jourSemaine(s);

/* ---------- reseau ---------- */
function lireCfg(){try{return JSON.parse(localStorage.getItem(S.cle));}catch(e){return null;}}
function ecrireCfg(c){localStorage.setItem(S.cle,JSON.stringify(c));S.cfg=c;}
function lireCache(){try{return JSON.parse(localStorage.getItem(S.cache));}catch(e){return null;}}
/* Cache des repas analysés/estimés, conservés après fermeture de l'app.
   On garde le repas actif (celui avec les boutons d'enregistrement) et
   jusqu'à 2 repas précédents, pour les retrouver et pouvoir les ré-enregistrer.
   Structure stockée : {actif:{...}|null, histo:[{...}, ...]} */
const MAX_HISTO=2;
function paquetRepas(){
  const A=S.ajout;
  if(!A.resultat)return null;
  return {repas:A.repas,desc:A.desc,resultat:A.resultat,confirm:A.confirm,message:A.message,quand:Date.now()};
}
function ecrireRepasCache(){
  try{
    const actif=paquetRepas();
    localStorage.setItem(S.repas,JSON.stringify({actif:actif,histo:(S.ajout.histo||[]).slice(0,MAX_HISTO)}));
  }catch(e){}
}
function lireRepasCache(){
  try{
    const raw=JSON.parse(localStorage.getItem(S.repas));
    if(!raw)return null;
    // compat : ancien format = un seul objet repas
    if(raw.resultat)return {actif:raw,histo:[]};
    return {actif:raw.actif||null,histo:Array.isArray(raw.histo)?raw.histo:[]};
  }catch(e){return null;}
}

/* Historique d'aliments reutilisables, stocke en local.
   Deux types : 'scan' (produit OFF avec per100, recalculable) et
   'repas' (analyse IA figee, reinjectable telle quelle). Max 20, plus recent en tete. */
const MAX_FOODS=20;
function lireFoods(){try{const a=JSON.parse(localStorage.getItem(S.foods));return Array.isArray(a)?a:[];}catch(e){return [];}}
function ecrireFoods(){try{localStorage.setItem(S.foods,JSON.stringify((S.foods||[]).slice(0,MAX_FOODS)));}catch(e){}}
function cleFood(f){
  if(f.t==='scan')return 'scan:'+String(f.nom||'').toLowerCase().trim()+'|'+String(f.marque||'').toLowerCase().trim();
  return 'repas:'+String((f.resultat&&f.resultat.repas)||'').toLowerCase()+'|'+
    ((f.resultat&&f.resultat.aliments)||[]).map(a=>String(a.nom||'').toLowerCase()).join(',');
}
function pousserFoodScan(p,g){
  if(!p||!p.nom)return;
  const f={t:'scan',nom:p.nom,marque:p.marque||'',per100:p.per100,portion:p.portion||0,
    paquet:p.paquet||0,nutriscore:p.nutriscore||'',derniereQte:g||p.portion||100,quand:Date.now()};
  const cle=cleFood(f);
  S.foods=(S.foods||[]).filter(x=>cleFood(x)!==cle);
  S.foods.unshift(f);ecrireFoods();
}
function pousserFoodRepas(r){
  if(!r||!r.total||r.estimation)return; // on ne memorise pas les estimations
  const f={t:'repas',resultat:r,quand:Date.now()};
  const cle=cleFood(f);
  S.foods=(S.foods||[]).filter(x=>cleFood(x)!==cle);
  S.foods.unshift(f);ecrireFoods();
}

/* File d'attente hors ligne : si l'enregistrement d'un repas echoue faute de
   reseau, on empile le payload ici au lieu de le perdre, et on le rejoue au
   retour du reseau. Seul l'enregistrement de repas est mis en file (le plus
   couteux a reperdre). Chaque entree : {payload:{...}, quand:ts}. */
function lirePending(){try{const a=JSON.parse(localStorage.getItem(S.pending));return Array.isArray(a)?a:[];}catch(e){return [];}}
function ecrirePending(){try{localStorage.setItem(S.pending,JSON.stringify(S.file||[]));}catch(e){}}
function empilerPending(payload){
  S.file=S.file||[];
  S.file.push({payload:payload,quand:Date.now()});
  ecrirePending();
}
let rejeuEnCours=false;
async function rejouerPending(silencieux){
  if(rejeuEnCours)return;
  S.file=S.file||[];
  if(!S.file.length)return;
  if(typeof navigator!=='undefined'&&navigator.onLine===false)return;
  rejeuEnCours=true;
  let change=false;
  try{
    while(S.file.length){
      const item=S.file[0];
      try{
        await appel(item.payload);
        S.file.shift();change=true;ecrirePending();
      }catch(e){
        // erreur reseau : on s'arrete, on retentera plus tard.
        // erreur applicative : le repas ne passera jamais, on le retire pour ne pas bloquer la file.
        if(e&&e.reseau)break;
        S.file.shift();change=true;ecrirePending();
      }
    }
  }finally{
    rejeuEnCours=false;
  }
  if(change&&!silencieux){
    try{await rafraichir();}catch(e){}
    if(S.vue)rendre();
  }
}

async function appel(corps){
  const url=S.cfg.api.trim().replace(/\/+$/,'');
  const body=JSON.stringify(Object.assign({token:S.cfg.token.trim()},corps));
  // l'analyse IA d'un repas (surtout avec photo) est lente par nature : on lui
  // laisse 120 s. Les autres appels (data, enregistrer, suppr, params) : 25 s.
  // appels IA (analyse de repas, coach) : lents par nature, 120 s ; le serveur
  // est calibré pour répondre avant (pire cas ~110 s, si les deux modèles expirent). Autres appels : 25 s.
  const IA=!!(corps&&(corps.action==='repas'||corps.action==='conseil'||corps.action==='photo'));
  const DELAI=IA?120000:25000;
  // 3 tentatives (1 + 2 retries) avec backoff exponentiel, uniquement sur
  // erreurs transitoires : coupure reseau, timeout, ou 5xx. Le 429 n'est pas
  // rejoue dans la seconde (le serveur demande d'attendre) mais est marque
  // transitoire (.reseau) pour que la file d'attente le rejoue plus tard, sans
  // le supprimer. Un refus applicatif (j.ok===false) reste definitif.
  // pas de retry pour l'analyse : si l'IA est lente, relancer ne fait que doubler
  // le travail. Une seule tentative de 120 s. Les autres appels gardent 2 retries.
  // enregistrer n'est pas rejoué : si le serveur a écrit mais répond lentement,
  // un nouvel essai créerait un doublon dans le Journal.
  // enregistrer porte un identifiant de repas : le rejouer met à jour la même ligne, sans doublon.
  const RETRIS=IA?0:2;
  let derniere=null;
  for(let essai=0;essai<=RETRIS;essai++){
    if(essai>0)await new Promise(res=>setTimeout(res,600*Math.pow(2,essai-1)));
    let r;
    const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    const minuteur=ctrl?setTimeout(()=>ctrl.abort(),DELAI):null;
    try{
      r=await fetch(url,{method:'POST',cache:'no-store',
        headers:{'Content-Type':'text/plain;charset=UTF-8'},body:body,
        signal:ctrl?ctrl.signal:undefined});
    }catch(e){
      // fetch a echoue (reseau, timeout via abort) : on retente si possible
      derniere=new Error((e&&e.name==='AbortError')
        ?'Le serveur met trop de temps à répondre. Réessaie dans un instant.'
        :'Connexion au serveur impossible. Vérifie ton réseau.');
      continue;
    }finally{
      if(minuteur)clearTimeout(minuteur);
    }
    if(r.status===429){
      const e=new Error('Trop de requêtes vers Google Sheets. Attends une minute et réessaie.');
      e.reseau=true; // transitoire : a rejouer plus tard, jamais a jeter
      throw e;
    }
    if(r.status>=500&&r.status<600){
      // erreur serveur : on lit le message renvoyé par le workflow s'il y en a un
      // (ex. IA saturée chez Google), sinon message générique ; puis on retente.
      let je=null;try{je=await r.json();}catch(e){}
      const msg=(je&&je.erreur)?je.erreur:('Le serveur a répondu '+r.status+'. Réessaie dans un instant.');
      if(IA&&je&&je.erreur)throw new Error(msg);
      derniere=new Error(msg);
      continue;
    }
    let j=null;
    try{j=await r.json();}catch(e){}
    if(!j){
      // réponse vide : n8n s'est arrêté avant de répondre (souvent Google Sheets injoignable
      // un instant). Lecture ou écriture rejouable : on retente. Enregistrement d'un repas :
      // on ne sait pas si la ligne est écrite, on ne rejoue pas.
      derniere=new Error('Le serveur n\'a pas répondu correctement. Réessaie dans un instant.');
      continue;
    }
    if(j.ok!==true)throw new Error(j.erreur||('Le serveur a répondu '+r.status+'.'));
    return j;
  }
  const err=derniere||new Error('Connexion au serveur impossible.');
  err.reseau=true;
  throw err;
}
async function rafraichir(){
  const d=await appel({action:'data'});
  dernierAppel=Date.now();
  localStorage.setItem(S.cache,JSON.stringify(d));
  S.data=d;return d;
}

/* ---------- photo ---------- */
function redim(fichier){
  return new Promise((res,rej)=>{
    const img=new Image();
    const u=URL.createObjectURL(fichier);
    img.onload=()=>{
      URL.revokeObjectURL(u);
      const MAX=1024;
      let w=img.naturalWidth,h=img.naturalHeight;
      if(!w||!h){rej(new Error('Image illisible.'));return;}
      if(w>h&&w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      else if(h>=w&&h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');
      x.fillStyle='#ffffff';x.fillRect(0,0,w,h);
      x.drawImage(img,0,0,w,h);
      // taille reelle d'un dataURL jpeg : (longueur du base64) * 3/4, moins le padding
      const tailleOctets=b64=>{const n=b64.length;const pad=b64.endsWith('==')?2:(b64.endsWith('=')?1:0);return Math.round(n*3/4-pad);};
      const PLAFOND=400000; // ~400 Ko : au-dela on recompresse pour eviter timeout d'analyse
      let url=c.toDataURL('image/jpeg',0.8);
      let b64=url.split(',')[1];
      if(tailleOctets(b64)>PLAFOND){
        // 1er palier : qualite plus basse
        url=c.toDataURL('image/jpeg',0.6);b64=url.split(',')[1];
      }
      if(tailleOctets(b64)>PLAFOND&&Math.max(w,h)>800){
        // 2e palier : on reduit aussi la dimension a 800px
        const r=800/Math.max(w,h),w2=Math.round(w*r),h2=Math.round(h*r);
        const c2=document.createElement('canvas');c2.width=w2;c2.height=h2;
        const x2=c2.getContext('2d');x2.fillStyle='#ffffff';x2.fillRect(0,0,w2,h2);
        x2.drawImage(img,0,0,w2,h2);
        url=c2.toDataURL('image/jpeg',0.6);b64=url.split(',')[1];
      }
      res({dataUrl:url,b64:b64,octets:tailleOctets(b64)});
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Format d image non pris en charge.'));};
    img.src=u;
  });
}

/* ---------- scanner code-barres ---------- */
const ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js';
let zxingPromise=null;
function chargerZXing(){
  if(window.ZXingBrowser)return Promise.resolve(window.ZXingBrowser);
  if(zxingPromise)return zxingPromise;
  zxingPromise=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=ZXING_URL;s.async=true;
    s.onload=()=>window.ZXingBrowser?res(window.ZXingBrowser):rej(new Error('Bibliothèque de scan illisible.'));
    s.onerror=()=>{zxingPromise=null;rej(new Error('Impossible de charger le scanner. Vérifie ta connexion.'));};
    document.head.appendChild(s);
  });
  return zxingPromise;
}
let scanControls=null;
let scanEnCours=false;
function vibrer(ms){try{if(navigator.vibrate)navigator.vibrate(ms||60);}catch(e){}}
async function demarrerScan(){
  if(scanEnCours)return;
  scanEnCours=true;
  const SC=S.ajout.scan;
  SC.message='';
  // La camera exige un contexte securise (HTTPS) et l'API getUserMedia.
  // On teste avant de charger ZXing (250 Ko) pour un message clair si c'est indisponible.
  if(!navigator.mediaDevices||typeof navigator.mediaDevices.getUserMedia!=='function'){
    SC.etat='ko';
    SC.message=(location.protocol!=='https:'&&location.hostname!=='localhost')
      ?'Le scan nécessite une connexion sécurisée (https). Ouvre l\'app depuis son adresse habituelle.'
      :'Ton navigateur ne donne pas accès à la caméra. Saisis le produit à la main.';
    scanEnCours=false;rendre();return;
  }
  let ZX;
  try{ZX=await chargerZXing();}
  catch(e){SC.etat='ko';SC.message=e.message;scanEnCours=false;rendre();return;}
  const video=document.getElementById('scan-video');
  if(!video){SC.etat=null;scanEnCours=false;return;}
  try{
    const hints=new Map();
    const F=ZX.BarcodeFormat, H=ZX.DecodeHintType;
    if(F&&H){
      hints.set(H.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128]);
    }
    const reader=new ZX.BrowserMultiFormatReader(hints);
    const onResult=(result,err,controls)=>{
      if(result){
        const code=result.getText?result.getText():String(result.text||result);
        if(code){controls&&controls.stop&&controls.stop();scanControls=null;onCodeScanne(code);}
      }
    };
    // decodeFromConstraints permet de forcer la caméra arrière ; repli sur decodeFromVideoDevice
    if(typeof reader.decodeFromConstraints==='function'){
      scanControls=await reader.decodeFromConstraints(
        {video:{facingMode:{ideal:'environment'}}},video,onResult);
    }else{
      scanControls=await reader.decodeFromVideoDevice(undefined,video,onResult);
    }
    // le flux est attaché à la vidéo : on ne re-rend PAS (cela détruirait l'élément).
    // on met juste à jour le texte du bandeau haut à la main.
    SC.etat='scan';
    scanEnCours=false;
    const haut=document.querySelector('.scan-haut');
    if(haut)haut.textContent='Vise le code-barres du produit';
  }catch(e){
    scanEnCours=false;
    // si la camera s'est allumee avant l'echec, on coupe le flux tout de suite
    try{
      const v=document.getElementById('scan-video');
      if(v&&v.srcObject&&v.srcObject.getTracks){
        v.srcObject.getTracks().forEach(t=>{try{t.stop();}catch(_){}});
        v.srcObject=null;
      }
    }catch(_){}
    scanControls=null;
    SC.etat='ko';
    SC.message=/permission|denied|NotAllowed/i.test(e.name+e.message)
      ?'Accès caméra refusé. Autorise la caméra dans les réglages Safari.'
      :'Caméra indisponible. '+(e.message||'');
    rendre();
  }
}
function arreterScan(){
  try{if(scanControls&&scanControls.stop)scanControls.stop();}catch(e){}
  scanControls=null;
  // Filet de securite : meme si scanControls n'a jamais ete assigne (erreur en
  // cours de demarrage), le flux peut etre attache a la video. On coupe toutes
  // ses pistes pour eteindre la camera (voyant) et liberer la ressource.
  try{
    const v=document.getElementById('scan-video');
    if(v&&v.srcObject&&v.srcObject.getTracks){
      v.srcObject.getTracks().forEach(t=>{try{t.stop();}catch(e){}});
      v.srcObject=null;
    }
  }catch(e){}
  scanEnCours=false;
}
function fermerScan(){
  arreterScan();
  S.ajout.scan.ouvert=false;S.ajout.scan.etat=null;
  rendre();
}
async function onCodeScanne(code){
  vibrer(70);
  const SC=S.ajout.scan;
  SC.ouvert=false;SC.etat='recherche';SC.message='';SC.produit=null;
  rendre();hautPage();
  try{
    const r=await appel({action:'barcode',code:code});
    if(r.trouve===false){
      SC.etat='absent';SC.message=r.message||'Produit introuvable.';
      rendre();return;
    }
    const p=r.produit;
    SC.produit=p;SC.etat='ok';SC.mult=1;
    // quantité initiale : portion si dispo, sinon 100
    if(p.portion){SC.mode='portion';SC.qte=p.portion;}
    else{SC.mode='libre';SC.qte=100;}
    rendre();hautPage();
  }catch(e){
    SC.etat='ko';SC.message=e.message;rendre();
  }
}
// calcule kcal + macros pour la quantité choisie
function calculProduit(p,grammes){
  const f=(grammes||0)/100;
  return {
    kcal:Math.round(p.per100.kcal*f),prot:Math.round(p.per100.prot*f),
    lip:Math.round(p.per100.lip*f),gluc:Math.round(p.per100.gluc*f),
    fibres:Math.round((p.per100.fibres||0)*f),sucres:Math.round((p.per100.sucres||0)*f),
    sodium:Math.round((p.per100.sodium||0)*f),satures:Math.round((p.per100.satures||0)*f*10)/10,sucres_ajoutes:Math.round((p.per100.sucres_ajoutes||0)*f),
    // purines/alcool : absents des produits mémorisés avant ce suivi -> on ne les invente pas
    ...(p.per100.purines!==undefined?{purines:Math.round((p.per100.purines||0)*f),
      purines_risque:Math.round((p.per100.purines_risque||0)*f),
      alcool:Math.round((p.per100.alcool||0)*f*10)/10,sucree:p.sucree?1:0}:{})
  };
}

/* ---------- graphiques ---------- */
// jours écoulés depuis epoch pour une date ISO (échelle temporelle réelle)
function jourNum(iso){return Math.round(new Date(iso+'T00:00:00Z')/86400000);}
function serieCourbe(vals,opt){
  const n=vals.length;
  if(n<2)return '<p class="vide">Deux points sont nécessaires pour tracer une courbe.</p>';
  const w=320,h=(opt.h||150)+20;
  const legH=16,pt=14+legH,pb=24,pl=30,pr=8;
  const dec=opt.dec||0,u=opt.unite||'';
  const col=opt.couleur||'var(--ink)';
  const colTend='var(--under)';
  const SEUIL=opt.seuilStagne||0.2;         // kg/semaine sous lequel on considère "stagne"
  // axe X = temps réel
  const t0=jourNum(vals[0].date),t1=jourNum(vals[n-1].date),span=(t1-t0)||1;
  const vmin=Math.min.apply(null,vals.map(p=>p.v)),vmax=Math.max.apply(null,vals.map(p=>p.v));
  const brut=(vmax-vmin)||1,pasBrut=brut/4;
  const mag=Math.pow(10,Math.floor(Math.log10(pasBrut))),norm=pasBrut/mag;
  const pas=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  const bas=Math.floor(vmin/pas)*pas,haut=Math.ceil(vmax/pas)*pas;
  const mn=bas,mx=(haut===bas?bas+pas:haut);
  const XT=t=>pl+((t-t0)/span)*(w-pl-pr);   // position selon la date
  const X=i=>XT(jourNum(vals[i].date));
  const Y=v=>pt+(1-(v-mn)/(mx-mn))*(h-pt-pb);
  let o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(opt.titre||'courbe')+'">';
  // --- legende ---
  const libPrinc=opt.legende||'pesées';
  o+='<line x1="'+pl+'" y1="9" x2="'+(pl+16)+'" y2="9" stroke="'+col+'" stroke-width="1.9"/>';
  o+='<text x="'+(pl+20)+'" y="12.5" font-size="10" fill="var(--soft)">'+esc(libPrinc)+'</text>';
  if(opt.moyenne&&n>=5){
    o+='<line x1="'+(pl+70)+'" y1="9" x2="'+(pl+86)+'" y2="9" stroke="'+colTend+'" stroke-width="1.6" stroke-dasharray="3 3"/>';
    o+='<text x="'+(pl+90)+'" y="12.5" font-size="10" fill="var(--soft)">tendance</text>';
  }
  // --- grille Y + labels ---
  for(let v=mn;v<=mx+0.001;v+=pas){
    const y=Y(v);
    o+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--rule)" stroke-width="0.7"/>';
    o+='<text x="'+(pl-4)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--soft)">'+v.toFixed(dec)+'</text>';
  }
  // --- grille verticale hebdo + labels de dates (alignés sur le lundi) ---
  const d0=new Date(vals[0].date+'T00:00:00Z');
  const lundi0=new Date(d0);lundi0.setUTCDate(d0.getUTCDate()-((d0.getUTCDay()+6)%7)); // recule au lundi
  let semaines=[];
  for(let t=Math.ceil(lundi0/86400000);t<=t1;t+=7){if(t>=t0)semaines.push(t);}
  // si trop de semaines pour la largeur, on espace (1 sur 2)
  const step=semaines.length>6?2:1;
  semaines.forEach((t,k)=>{
    const x=XT(t);
    o+='<line x1="'+x.toFixed(1)+'" y1="'+pt+'" x2="'+x.toFixed(1)+'" y2="'+(h-pb)+'" stroke="var(--rule)" stroke-width="0.5" opacity="0.6"/>';
    if(k%step===0){
      const iso=new Date(t*86400000).toISOString().slice(0,10);
      o+='<text x="'+x.toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-size="9" fill="var(--soft)">'+jjmm(iso)+'</text>';
    }
  });
  // --- tendance colorée par segment (vert descend, ambre stagne, orange monte) ---
  if(opt.moyenne&&n>=5){
    const ms=vals.map((p,i)=>{const d=vals.slice(Math.max(0,i-6),i+1);return d.reduce((s,x)=>s+x.v,0)/d.length;});
    for(let i=1;i<n;i++){
      const dt=(jourNum(vals[i].date)-jourNum(vals[i-1].date))||1;
      const pente=((ms[i]-ms[i-1])/dt)*7; // variation par semaine sur la tendance
      const c=coulPente(pente,SEUIL);          // selon l'objectif : vert dans le bon sens
      o+='<line x1="'+X(i-1).toFixed(1)+'" y1="'+Y(ms[i-1]).toFixed(1)+'" x2="'+X(i).toFixed(1)+'" y2="'+Y(ms[i]).toFixed(1)+
         '" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>';
    }
  }
  // --- courbe reelle ---
  let d='';vals.forEach((p,i)=>{d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)+' ';});
  o+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>';
  if(n<=60)vals.forEach((p,i)=>{o+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="2.3" fill="'+col+'"/>';});
  // --- badge de la valeur actuelle, fixe en haut à droite (plus de chevauchement) ---
  const bw=opt.badgeW||58,bh=17,bx=w-pr-bw,by=pt+2;
  o+='<rect x="'+bx.toFixed(1)+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+col+'"/>';
  o+='<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(by+12)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--paper)">'+vals[n-1].v.toFixed(dec)+u+'</text>';
  return o+'</svg>';
}

// Barres de variation hebdomadaire (Δ kg par semaine), colorées selon perte/stagne/prise.
function barresHebdo(pes,opt){
  opt=opt||{};
  const SEUIL=opt.seuilStagne||0.2;
  if(pes.length<2)return '<p class="vide">Pas encore assez de pesées pour comparer les semaines.</p>';
  // regrouper par semaine ISO (lundi). Pour chaque semaine on garde la dernière pesée.
  function lundiDe(iso){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10);}
  const parSem={};
  pes.forEach(p=>{const k=lundiDe(p.date);if(!parSem[k]||p.date>=parSem[k].date)parSem[k]={date:p.date,poids:p.poids,lundi:k};});
  const sems=Object.values(parSem).sort((a,b)=>a.lundi.localeCompare(b.lundi));
  if(sems.length<2)return '<p class="vide">Il faut au moins deux semaines de pesées pour voir les variations.</p>';
  // Δ de chaque semaine vs la précédente, normalisé par le temps réel écoulé
  // (évite qu'une pesée très espacée écrase l'échelle).
  const deltas=[];
  for(let i=1;i<sems.length;i++){
    // différence réelle entre la dernière pesée de la semaine et celle de la semaine précédente
    // Pas d'extrapolation quand l'écart est court (3 jours à +0,5 kg ne s'affichent plus +1,2) ;
    // ramené à 7 jours seulement quand plus d'une semaine sépare les deux pesées.
    const dj=(jourNum(sems[i].date)-jourNum(sems[i-1].date))||7;
    const brut=sems[i].poids-sems[i-1].poids;
    deltas.push({lundi:sems[i].lundi,delta:Math.round((dj>7?brut/dj*7:brut)*10)/10,dj:dj,de:sems[i-1].date,a:sems[i].date,
      cours:sems[i].lundi===lundiDe(auj())});
  }
  const n=deltas.length;
  const w=320,h=(opt.h||150)+20,legH=16,pt=14+legH,pb=24,pl=30,pr=8;
  const amp=Math.max(0.5,Math.max.apply(null,deltas.map(d=>Math.abs(d.delta))));
  const zero=pt+(h-pt-pb)*(amp/(2*amp));   // ligne 0 au milieu
  const ech=((h-pt-pb)/2)/amp;
  const pasX=(w-pl-pr)/n,lg=Math.max(6,Math.min(26,pasX*0.6));
  const coul=d=>coulPente(d,SEUIL);
  let o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Variation hebdomadaire du poids">';
  // légende
  o+='<rect x="'+pl+'" y="4" width="10" height="10" rx="2" fill="'+coul(-1)+'"/><text x="'+(pl+14)+'" y="12.5" font-size="9.5" fill="var(--soft)">perte</text>';
  o+='<rect x="'+(pl+52)+'" y="4" width="10" height="10" rx="2" fill="'+coul(0)+'"/><text x="'+(pl+66)+'" y="12.5" font-size="9.5" fill="var(--soft)">stagne</text>';
  o+='<rect x="'+(pl+108)+'" y="4" width="10" height="10" rx="2" fill="'+coul(1)+'"/><text x="'+(pl+122)+'" y="12.5" font-size="9.5" fill="var(--soft)">prise</text>';
  // axe Y (graduations en kg)
  const pasY=amp>1?0.5:0.2;
  for(let v=-Math.floor(amp/pasY)*pasY;v<=amp+0.001;v+=pasY){
    const y=zero-v*ech;
    if(y<pt-1||y>h-pb+1)continue;
    o+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--rule)" stroke-width="'+(Math.abs(v)<0.001?'1':'0.6')+'"/>';
    o+='<text x="'+(pl-4)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--soft)">'+(v>0?'+':'')+v.toFixed(1)+'</text>';
  }
  // barres
  deltas.forEach((d,i)=>{
    const cx=pl+pasX*(i+0.5),ht=Math.abs(d.delta)*ech,y=d.delta<0?zero:zero-ht;
    o+='<rect x="'+(cx-lg/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+lg.toFixed(1)+'" height="'+Math.max(1,ht).toFixed(1)+'" rx="2" fill="'+coul(d.delta)+'"'+
      (d.cours?' fill-opacity="0.45" stroke="'+coul(d.delta)+'" stroke-dasharray="3 2"':'')+'><title>'+jjmm(d.de)+' → '+jjmm(d.a)+' ('+d.dj+' j)</title></rect>';
    // valeur placée dans l'espace vide, du côté OPPOSÉ à la barre par rapport à
    // zéro (perte -> au-dessus de zéro ; prise -> en dessous). Jamais sur la barre
    // ni collée à l'axe des dates.
    const yTxt=d.delta<0?(zero-4):(zero+11);
    o+='<text x="'+cx.toFixed(1)+'" y="'+yTxt.toFixed(1)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="'+coul(d.delta)+'">'+(d.delta>0?'+':d.delta<0?'\u2212':'')+Math.abs(d.delta).toFixed(1)+'</text>';
    // label semaine (axe X)
    o+='<text x="'+cx.toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-size="9" fill="var(--soft)">'+(d.cours?'en cours':jjmm(d.lundi))+'</text>';
  });
  return o+'</svg>';
}

function barresLigne(items,h){
  const w=320,pt=16,pb=20;
  if(!items.length)return '<p class="vide">Aucun jour complet pour l\'instant.</p>';
  const amp=Math.max(200,Math.max.apply(null,items.map(i=>Math.abs(i.v))));
  const zero=pt+(h-pt-pb)/2,ech=((h-pt-pb)/2)/amp,pas=w/items.length;
  const lg=Math.max(2,Math.min(15,pas*0.6));
  let o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Écart quotidien">';
  o+='<line x1="0" y1="'+zero+'" x2="'+w+'" y2="'+zero+'" stroke="var(--rule)"/>';
  let selIt=null,selCx=0;
  items.forEach((it,i)=>{
    const cx=pas*(i+0.5),ht=Math.abs(it.v)*ech,y=it.v<0?zero:zero-ht;
    const sel=(S.insp&&S.insp.date===it.date);
    o+='<rect data-jour="'+it.date+'" x="'+(cx-lg/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+lg.toFixed(1)+
       '" height="'+Math.max(1,ht).toFixed(1)+'" fill="'+coulEcart(it.v)+'" rx="1"'+
       (sel?' stroke="var(--ink)" stroke-width="1.6"':'')+'/>';
    if(sel){selIt=it;selCx=cx;}
  });
  if(items.length>=5){
    let m='';
    items.forEach((it,i)=>{
      const d=items.slice(Math.max(0,i-6),i+1);
      const v=d.reduce((s,x)=>s+x.v,0)/d.length;
      m+=(i?'L':'M')+(pas*(i+0.5)).toFixed(1)+' '+(zero-v*ech).toFixed(1)+' ';
    });
    o+='<path d="'+m+'" fill="none" stroke="var(--ink)" stroke-width="1.5" opacity="0.75"/>';
  }
  // dates aux extrémités
  o+='<text x="0" y="'+(h-4)+'" font-size="10.5" fill="var(--soft)" font-weight="300">'+jjmm(items[0].date)+'</text>';
  o+='<text x="'+w+'" y="'+(h-4)+'" text-anchor="end" font-size="10.5" fill="var(--soft)" font-weight="300">'+jjmm(items[items.length-1].date)+'</text>';
  // badge de la barre sélectionnée, bien lisible (date + écart), en haut
  if(selIt){
    const txt=jjmm(selIt.date)+' : '+sgn(selIt.v)+' kcal';
    const bw=Math.max(104,txt.length*6.8),bx=Math.min(Math.max(2,selCx-bw/2),w-bw-2);
    o+='<rect x="'+bx.toFixed(1)+'" y="1" width="'+bw.toFixed(1)+'" height="18" rx="4" fill="'+coulEcart(selIt.v)+'"/>';
    o+='<text x="'+(bx+bw/2).toFixed(1)+'" y="13.5" text-anchor="middle" font-size="11" font-weight="700" fill="var(--paper)">'+txt+'</text>';
  }
  return o+'</svg>';
}

function calendrier(jours){
  const par={};jours.forEach(j=>{par[j.date]=j;});
  const sem=4,w=320,cell=Math.floor((w-28)/7),g=3;
  const fin=new Date();fin.setHours(12,0,0,0);
  const dec=(fin.getDay()+6)%7;
  const debut=new Date(fin);debut.setDate(debut.getDate()-dec-(sem-1)*7);
  const h=sem*(cell+g)+18;
  let o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Régularité des dernières semaines">';
  ['L','M','M','J','V','S','D'].forEach((d,i)=>{
    o+='<text x="'+(28+i*(cell+g)+cell/2)+'" y="10" text-anchor="middle" font-size="9.5" fill="var(--soft)" font-weight="300">'+d+'</text>';
  });
  for(let sm=0;sm<sem;sm++){
    for(let d=0;d<7;d++){
      const dt=new Date(debut);dt.setDate(dt.getDate()+sm*7+d);
      if(dt>fin)continue;
      const k=isoLocal(dt),j=par[k];
      const x=28+d*(cell+g),y=16+sm*(cell+g);
      const saisi=!!(j&&j.repas>=1&&j.kcal>0);
      let f='var(--creux)',op=1,cadre='';
      if(saisi&&j.ecart!==null){
        const inten=Math.min(1,Math.abs(j.ecart)/900);
        f=coulEcart(j.ecart);
        op=0.3+inten*0.7;
      }else if(saisi){f='var(--soft)';op=0.4;}
      if(S.inspCal&&S.inspCal.date===k)cadre=' stroke="var(--ink)" stroke-width="1.6"';
      o+='<rect data-jour-cal="'+k+'" x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+

      if(d===0)o+='<text x="0" y="'+(y+cell/2+3)+'" font-size="10px" fill="var(--soft)" font-weight="300">'+jjmm(k)+'</text>';
    }
  }
  return o+'</svg>';
}

// Grand anneau central de calories : mangees en heros au centre, restant en
// legende. L'arc se remplit selon mangees/cible, vire a --over si depassement.
// Couleur d'un anneau selon le depassement de la cible :
//  <= cible          -> vert (--under)
//  jusqu'a +10%       -> jaune
//  +10% a +25%        -> orange
//  au-dela de +25%    -> rouge
function couleurDepassement(v,cible){
  if(!cible||v<=cible)return 'var(--under)';
  const r=v/cible;
  if(r<=1.10)return 'var(--jaune)';
  if(r<=1.25)return 'var(--over)';
  return 'var(--rouge)';
}

// Pastille sous chaque anneau de macro. Protéines = plancher : orange tant qu'on est
// sous 90 % de la cible. Lipides / glucides = plafond : vert en dessous, couleurs de
// dépassement de l'anneau au-dessus.
function pastilleMacro(k,v,t){
  if(!t)return '<div><span class="mac-sur">\u2014</span></div>';
  const ecart=Math.round(t-v);let coul,txt;
  if(k==='prot'){
    if(v>=t)coul='var(--under)',txt='Objectif atteint';
    else coul=(v>=t*0.9)?'var(--under)':'var(--over)',txt=nb(ecart)+' g à prendre';
  }else if(ecart>=0){coul='var(--under)';txt=nb(ecart)+' g restant'+(ecart>1?'s':'');}
  else{coul=couleurDepassement(v,t);txt=nb(-ecart)+' g en trop';}
  return '<div><span class="mac-pastille" style="background:'+coul+'">'+txt+'</span><span class="mac-sur">sur '+nb(t)+' g</span></div>';
}
function anneauCalories(mange,cible,sansPastille){
  if(!cible)return '';
  const t=200,R=t/2-10,C=2*Math.PI*R;
  const pct=Math.min(mange/cible,1);
  const off=C*(1-pct);
  const trop=mange>cible;
  const reste=cible-mange;
  const trait=couleurKcal(mange,cible);
  let o='<div class="cal-anneau"><svg viewBox="0 0 '+t+' '+t+'" role="img" aria-label="'+nb(mange)+' kcal mangées sur une cible de '+nb(cible)+'">';
  o+='<circle cx="'+t/2+'" cy="'+t/2+'" r="'+R+'" fill="none" stroke="var(--creux)" stroke-width="11"/>';
  o+='<circle cx="'+t/2+'" cy="'+t/2+'" r="'+R+'" fill="none" stroke="'+trait+
     '" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+
     '" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+t/2+' '+t/2+')"/>';
  o+='<text x="50%" y="50%" text-anchor="middle" font-size="46" font-weight="700" letter-spacing="-1.5" fill="'+(trop?trait:'var(--ink)')+'">'+nb(mange)+'</text>';
  o+='<text x="50%" y="62%" text-anchor="middle" font-size="12.5" fill="var(--soft)">kcal mangées sur '+nb(cible)+'</text>';
  o+='</svg>';
  // pastille des restantes (ou du dépassement), sous l'anneau, bien lisible de loin
  if(!sansPastille){const pk=pastilleKcal(mange,cible);o+='<div class="cal-pastille" style="background:'+pk.coul+'">'+pk.txt+'</div>';}
  o+='</div>';
  return o;
}
function jauge(conso,cible){
  if(!cible)return '';
  const w=320,h=30,maxi=Math.max(conso,cible)*1.06;
  const lx=(cible/maxi)*w,cx=Math.min((conso/maxi)*w,w),trop=conso>cible;
  let o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Consommé par rapport à la cible">';
  o+='<rect x="0" y="6" width="'+w+'" height="13" fill="var(--creux)" rx="1.5"/>';
  o+='<rect x="0" y="6" width="'+cx.toFixed(1)+'" height="13" fill="'+(trop?'var(--over)':'var(--under)')+'" rx="1.5"/>';
  o+='<line x1="'+lx.toFixed(1)+'" y1="1" x2="'+lx.toFixed(1)+'" y2="24" stroke="var(--ink)" stroke-width="1.5"/>';
  o+='<text x="'+(lx>w-70?lx-5:lx+5).toFixed(1)+'" y="'+(h-1)+'" text-anchor="'+(lx>w-70?'end':'start')+
     '" font-size="10.5" fill="var(--soft)" font-weight="300">cible '+nb(cible)+'</text>';
  return o+'</svg>';
}

function barreMacros(a){
  const tot=(a.prot*4)+(a.lip*9)+(a.gluc*4);
  if(!tot)return '';
  const w=320,h=32;
  const seg=[['Protéines',a.prot*4,'var(--under)'],['Lipides',a.lip*9,'var(--over)'],['Glucides',a.gluc*4,'var(--ink)']];
  let x=0,o='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Répartition des calories par macronutriment">';
  seg.forEach(s=>{
    const lg=(s[1]/tot)*w;
    o+='<rect x="'+x.toFixed(1)+'" y="0" width="'+Math.max(0,lg-1.5).toFixed(1)+'" height="12" fill="'+s[2]+'" rx="1.5"/>';
    if(lg>46)o+='<text x="'+(x+2).toFixed(1)+'" y="26" font-size="10.5" fill="var(--soft)" font-weight="300">'+s[0].slice(0,4)+' '+Math.round(s[1]/tot*100)+'%</text>';
    x+=lg;
  });
  return o+'</svg>';
}

// Anneau de progression pour une macro. coul = couleur de base (sous cible).
// coulDep = couleur a utiliser au-dessus de la cible (jaune/orange/rouge selon
// le depassement). Si absent, on reste sur coul.
function anneau(v,cible,coul,label,taille,coulDep){
  const t=taille||96,R=t/2-6,C=2*Math.PI*R;
  const pct=cible?Math.min(v/cible,1):0;
  const off=C*(1-pct);
  const trait=(coulDep&&cible&&v>cible)?coulDep:coul;
  return '<svg viewBox="0 0 '+t+' '+t+'" role="img" aria-label="'+esc(label)+' '+nb(v)+' grammes'+(cible?' sur '+nb(cible):'')+'" style="width:'+t+'px;height:'+t+'px">'+
    '<circle cx="'+t/2+'" cy="'+t/2+'" r="'+R+'" fill="none" stroke="var(--creux)" stroke-width="7"/>'+
    '<circle cx="'+t/2+'" cy="'+t/2+'" r="'+R+'" fill="none" stroke="'+trait+
      '" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+
      '" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+t/2+' '+t/2+')"/>'+
    '<text x="50%" y="46%" text-anchor="middle" font-size="17" font-weight="600" fill="var(--ink)">'+nb(v)+'</text>'+
    '<text x="50%" y="63%" text-anchor="middle" font-size="10" fill="var(--soft)">'+esc(label)+'</text></svg>';
}

/* ---------- vues ---------- */
const REPAS=[['matin','Matin'],['midi','Midi'],['encas','En-cas'],['soir','Soir'],['autre','Autre']];
function libelleRepas(r){return {matin:'Matin',midi:'Midi',soir:'Soir',encas:'En-cas',estim:'Estimation'}[r]||r;}

/* Répartition des cibles par repas. Stockée dans Params (colonne repartition)
   au format "matin/midi/encas/soir" en pourcentages entiers, ex "25/40/5/30".
   Renvoie des fractions {matin,midi,encas,soir}. Défaut 25/40/5/30. */
const REPART_DEFAUT={matin:25,midi:40,encas:5,soir:30};
function repartPct(d){
  const src=(d&&d.reference&&d.reference.repartition)?String(d.reference.repartition):'';
  const p=src.split('/').map(x=>parseInt(String(x).replace(/[^0-9]/g,''),10));
  if(p.length===4&&p.every(n=>!isNaN(n))&&p.reduce((a,b)=>a+b,0)>0)
    return {matin:p[0],midi:p[1],encas:p[2],soir:p[3]};
  return {...REPART_DEFAUT};
}
function repartFrac(d){
  const pct=repartPct(d),tot=pct.matin+pct.midi+pct.encas+pct.soir||100;
  return {matin:pct.matin/tot,midi:pct.midi/tot,encas:pct.encas/tot,soir:pct.soir/tot};
}
// Répartition des macros (protéines/lipides/glucides) en %, stockée dans Params
// (colonne macros, format "30/30/40"). Défaut 30/30/40.
const MACROS_DEFAUT={prot:30,lip:30,gluc:40};
function macrosPct(d){
  const src=(d&&d.reference&&d.reference.macros)?String(d.reference.macros):'';
  const p=src.split('/').map(x=>parseInt(String(x).replace(/[^0-9]/g,''),10));
  if(p.length===3&&p.every(n=>!isNaN(n))&&p.reduce((a,b)=>a+b,0)>0)
    return {prot:p[0],lip:p[1],gluc:p[2]};
  return {...MACROS_DEFAUT};
}
const ACTIV=[[1.2,'Sédentaire'],[1.3,'Très peu actif'],[1.375,'Peu actif'],[1.55,'Modérément actif'],[1.725,'Très actif'],[1.9,'Extrêmement actif']];

function couleurMacro(nom,v,t){
  if(!t)return '';
  const r=v/t;
  if(nom==='prot'){            // les protéines sont un plancher, pas un plafond
    return r>=0.9?'sous':'sur';
  }
  if(r<=1)return 'sous';
  if(r<=1.1)return '';
  return 'sur';
}

// État propre à l'écran Jour : onglet du bas (mémorisé sur le téléphone), alerte dépliée.

// Couleur et libellé d'une macro par rapport à sa cible.
// Protéines = plancher (orange tant qu'on est sous 90 %) ; lipides / glucides = plafond.
function macroEtat(k,v,t){
  const ecart=Math.round(t-v);
  if(k==='prot'){
    if(v>=t)return {coul:'var(--under)',txt:'objectif atteint'};
    return {coul:(v>=t*0.9)?'var(--under)':'var(--over)',txt:nb(ecart)+' g à prendre'};
  }
  if(ecart>=0)return {coul:'var(--under)',txt:nb(ecart)+' g restant'+(ecart>1?'s':'')};
  return {coul:couleurDepassement(v,t),txt:nb(-ecart)+' g en trop'};
}
function barreMacro(k,lib,v,t){
  if(!t)return '<div class="hm"><div class="hm-l"><span>'+lib+' <b>'+nb(v)+'</b> g</span></div></div>';
  const e=macroEtat(k,v,t);
  return '<div class="hm"><div class="hm-l"><span>'+lib+' <b>'+nb(v)+'</b> / '+nb(t)+' g</span><span class="hm-e" style="color:'+e.coul+'">'+e.txt+'</span></div>'+
    '<div class="hm-b"><i style="width:'+Math.min(100,v/t*100).toFixed(0)+'%;background:'+e.coul+'"></i></div></div>';
}

function repasParHeure(){
  const h=new Date().getHours();
  if(h<11)return 'matin';

  return 'soir';
}

// ligne discrète fibres / sucres / sodium (sodium en mg, reste en g)
function ligneMicro(o){
  if(!o)return '';
  const f=Math.round(o.fibres||0),s=Math.round(o.sucres||0),so=Math.round(o.sodium||0);
  const sat=Math.round(o.satures||0),sa=Math.round(o.sucres_ajoutes||0);
  if(!f&&!s&&!so&&!sat)return '';
  const p=[];
  p.push('fibres '+nb(f)+' g');
  p.push('sucres '+nb(s)+' g'+(sa?' (dont ajoutés '+nb(sa)+')':''));
  if(sat||o.satures===0)p.push('saturées '+nb(sat)+' g');
  p.push('sodium '+nb(so)+' mg');
  return '<div class="micro">'+p.join(' · ')+'</div>';
}

/* ---------- Raccourcis de l'écran Ajouter : refaire un repas, composer avec ses aliments ----------
