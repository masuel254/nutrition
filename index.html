/* ---------- photos : stockage local (IndexedDB) + récupération serveur ---------- */
const PHOTO_DB='suivi-photos';
let photoDbP=null;
const photoMem=new Map();
function photoDb(){
  if(photoDbP)return photoDbP;
  photoDbP=new Promise(res=>{
    try{
      const rq=indexedDB.open(PHOTO_DB,1);
      rq.onupgradeneeded=()=>{try{rq.result.createObjectStore('photos');}catch(e){}};
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>res(null);
      rq.onblocked=()=>res(null);
    }catch(e){res(null);}
  });
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  return photoDbP;
}
async function idbGet(k){
  const db=await photoDb();if(!db)return null;
  return new Promise(res=>{try{const q=db.transaction('photos','readonly').objectStore('photos').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});
}
async function idbPut(k,v){
  const db=await photoDb();if(!db)return;
  return new Promise(res=>{try{const t=db.transaction('photos','readwrite');t.objectStore('photos').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res();}});
}
async function photoUrl(fichier){
  if(!fichier)return null;
  if(photoMem.has(fichier))return photoMem.get(fichier);
  let u=await idbGet(fichier);
  if(!u){
    const r=await appel({action:'photo_get',fichier:fichier});
    if(!r||!r.photo)return null;
    u='data:'+(r.mime||'image/jpeg')+';base64,'+r.photo;
    idbPut(fichier,u);
  }
  photoMem.set(fichier,u);
  return u;
}
let hydratationEnCours=false;
// Remplit les <img data-fichier> encore vides, une photo à la fois (pas de rafale vers le serveur).
async function hydraterPhotos(){
  if(hydratationEnCours)return;
  hydratationEnCours=true;
  try{
    for(let tour=0;tour<12;tour++){
      const img=[...document.querySelectorAll('img[data-fichier]')].filter(i=>!i.getAttribute('src')&&!i.dataset.ko)[0];
      if(!img)break;
      const f=img.dataset.fichier;
      let u=null;
      try{u=await photoUrl(f);}catch(e){u=null;}
      document.querySelectorAll('img[data-fichier="'+(window.CSS&&CSS.escape?CSS.escape(f):f)+'"]').forEach(i=>{
        if(u)i.src=u;else{i.dataset.ko='1';i.alt='Photo indisponible';}
      });
    }
  }finally{hydratationEnCours=false;}
}

/* ---------- appareil photo avec silhouette fantôme ---------- */
let camFlux=null;
function camArreterFlux(){
  try{if(camFlux)camFlux.getTracks().forEach(t=>{try{t.stop();}catch(e){}});}catch(e){}
  camFlux=null;
}
function fermerCamera(){
  camArreterFlux();
  if(S.cam.minuteurId){clearInterval(S.cam.minuteurId);S.cam.minuteurId=null;}
  S.cam.ouvert=false;S.cam.capture=null;S.cam.etat=null;
  const h=document.getElementById('cam-hote');if(h)h.remove();
}
async function camDemarrerFlux(){
  const Cm=S.cam;
  if(!navigator.mediaDevices||typeof navigator.mediaDevices.getUserMedia!=='function'){
    Cm.etat='ko';Cm.message='Caméra indisponible dans ce navigateur.';dessinerCamera();return;
  }
  camArreterFlux();
  try{
    camFlux=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:Cm.facing},width:{ideal:1920},height:{ideal:1920}}});
    if(!S.cam.ouvert){camArreterFlux();return;}
    Cm.etat='pret';dessinerCamera();
  }catch(e){
    Cm.etat='ko';
    Cm.message=/permission|denied|NotAllowed/i.test((e&&e.name||'')+(e&&e.message||''))
      ?'Accès caméra refusé. Autorise la caméra pour cette appli dans les réglages de l\'iPhone.'
      :'Caméra indisponible. '+((e&&e.message)||'');
    dessinerCamera();
  }
}
function dessinerCamera(){
  const Cm=S.cam;
  let hote=document.getElementById('cam-hote');
  if(!Cm.ouvert){if(hote)hote.remove();return;}
  if(!hote){hote=document.createElement('div');hote.id='cam-hote';document.body.appendChild(hote);}
  const miroir=Cm.facing==='user';
  let h='<div class="scan-overlay cam">';
  if(Cm.capture){
    h+='<img class="cam-apercu" src="'+Cm.capture.url+'" alt="Photo prise">'+
       '<div class="scan-haut">'+(Cm.etat==='envoi'?'<span class="attente"></span>Enregistrement…':'Photo de '+libType(Cm.type)+' : on la garde ?')+'</div>';
    if(Cm.etat==='ko')h+='<div class="scan-err">'+esc(Cm.message)+'</div>';
    h+='<div class="scan-bas"><button id="cam-reprendre"'+(Cm.etat==='envoi'?' disabled':'')+'>Reprendre</button>'+
       '<button class="stop" id="cam-garder"'+(Cm.etat==='envoi'?' disabled':'')+'>'+(Cm.etat==='ko'?'Réessayer':'Garder')+'</button></div>';
  }else{
    h+='<video id="cam-video" class="scan-video'+(miroir?' miroir':'')+'" playsinline muted autoplay></video>';
    // la photo précédente est déjà enregistrée telle qu'affichée (miroir compris) : pas de retournement
    if(Cm.fantome)h+='<img class="cam-fantome" src="'+Cm.fantome+'" alt="">';
    h+='<div class="scan-haut">'+(Cm.etat==='demarrage'?'Démarrage de la caméra…':'Photo de '+libType(Cm.type)+(Cm.fantome?' · place-toi sur la photo précédente':''))+'</div>'+
       '<div class="cam-compte" id="cam-compte"></div>';
    if(Cm.etat==='ko'||Cm.alerte)h+='<div class="scan-err">'+esc(Cm.message)+'</div>';
    h+='<div class="scan-bas"><button id="cam-fermer">Fermer</button>'+
       '<button id="cam-tourner" aria-label="Changer de caméra">'+(Cm.facing==='user'?'Arrière':'Avant')+'</button>'+
       '<button id="cam-minuteur" aria-label="Retardateur">'+(Cm.minuteur?Cm.minuteur+' s':'0 s')+'</button>'+
       '<button class="stop" id="cam-declencher"'+(Cm.etat!=='pret'?' disabled':'')+'>Prendre</button></div>';
  }
  h+='</div>';
  hote.innerHTML=h;
  const v=document.getElementById('cam-video');
  if(v&&camFlux){v.srcObject=camFlux;const pl=v.play();if(pl&&pl.catch)pl.catch(()=>{});}
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.addEventListener('click',fn);};
  on('cam-fermer',fermerCamera);
  on('cam-tourner',()=>{Cm.facing=Cm.facing==='user'?'environment':'user';Cm.etat='demarrage';dessinerCamera();camDemarrerFlux();});
  on('cam-minuteur',e=>{Cm.minuteur=Cm.minuteur===0?5:(Cm.minuteur===5?10:0);try{localStorage.setItem('suivi.cam',JSON.stringify({facing:Cm.facing,minuteur:Cm.minuteur}));}catch(er){}
    // mise à jour du seul libellé : redessiner recréerait la vidéo et la rendrait indisponible un instant
    e.currentTarget.textContent=Cm.minuteur+' s';});
  on('cam-declencher',()=>{
    if(Cm.minuteurId)return;
    let n=Cm.minuteur;
    if(!n){camCapturer();return;}
    const el=document.getElementById('cam-compte');if(el)el.textContent=n;
    Cm.minuteurId=setInterval(()=>{
      n--;const e2=document.getElementById('cam-compte');if(e2)e2.textContent=n>0?n:'';
      if(n<=0){clearInterval(Cm.minuteurId);Cm.minuteurId=null;camCapturer();}
    },1000);
  });
  on('cam-reprendre',()=>{Cm.capture=null;Cm.etat=camFlux?'pret':'demarrage';dessinerCamera();if(!camFlux)camDemarrerFlux();});
  on('cam-garder',envoyerPhotoCorps);
}
function camCapturer(essai){
  const v=document.getElementById('cam-video');
  // flux pas encore prêt (juste après ouverture ou changement de caméra) : on attend jusqu'à 2 s
  if(v&&!v.videoWidth&&(essai||0)<20){setTimeout(()=>camCapturer((essai||0)+1),100);return;}
  if(!v||!v.videoWidth){S.cam.alerte=true;S.cam.message='Image pas encore prête, réessaie.';dessinerCamera();return;}
  S.cam.alerte=false;
  const MAX=1080,w0=v.videoWidth,h0=v.videoHeight,r=Math.min(1,MAX/Math.max(w0,h0));
  const c=document.createElement('canvas');c.width=Math.round(w0*r);c.height=Math.round(h0*r);
  const x=c.getContext('2d');
  // même orientation que l'aperçu : miroir avec la caméra avant, pour que la silhouette
  // fantôme de la prochaine fois tombe exactement au même endroit
  if(S.cam.facing==='user'){x.translate(c.width,0);x.scale(-1,1);}
  x.drawImage(v,0,0,c.width,c.height);
  let url=c.toDataURL('image/jpeg',0.82);
  if(url.length>900000)url=c.toDataURL('image/jpeg',0.7);
  vibrer(40);
  S.cam.capture={url:url,b64:url.split(',')[1]};
  S.cam.etat=null;
  dessinerCamera();
}
async function envoyerPhotoCorps(){
  const Cm=S.cam;if(!Cm.capture)return;
  Cm.etat='envoi';dessinerCamera();
  try{
    const r=await appel({action:'photo',type:Cm.type,photo:Cm.capture.b64,date:auj()});
    if(r.fichier){photoMem.set(r.fichier,Cm.capture.url);await idbPut(r.fichier,Cm.capture.url);}
    S.corps.photoMsg='Photo de '+libType(Cm.type)+' enregistrée.';
    S.corps.cmpType=Cm.type;S.corps.cmpB=null;
    fermerCamera();
    try{await rafraichir();}catch(e){}
    rendre();
  }catch(e){
    Cm.etat='ko';Cm.message=e.message||'Envoi impossible.';dessinerCamera();
  }
}
async function ouvrirCamera(type){
  let pref={};try{pref=JSON.parse(localStorage.getItem('suivi.cam'))||{};}catch(e){pref={};}
  S.cam={ouvert:true,type:type,facing:pref.facing==='environment'?'environment':'user',
    minuteur:[0,5,10].indexOf(pref.minuteur)>=0?pref.minuteur:5,capture:null,etat:'demarrage',message:'',fantome:null,minuteurId:null};
  S.corps.photoMsg='';
  dessinerCamera();
  camDemarrerFlux();
  // silhouette fantôme : dernière photo du même type
  const P=((S.data&&S.data.photos)||[]).filter(p=>p.type===type);
  if(P.length){
    try{
      const u=await photoUrl(P[P.length-1].fichier);
      if(u&&S.cam.ouvert&&S.cam.type===type){S.cam.fantome=u;if(!S.cam.capture)dessinerCamera();}
    }catch(e){}
  }
}

/* Modales maison, en remplacement de window.confirm / window.alert (bloquants
   et hors charte). Injectees directement dans le body, hors du cycle rendre()
   qui reconstruit #racine. Renvoie une Promise. */
function fermerModale(){const m=document.getElementById('modale-hote');if(m)m.remove();}
function modaleConfirm(message,opt){
  opt=opt||{};
  return new Promise(res=>{
    fermerModale();
    const hote=document.createElement('div');
    hote.id='modale-hote';hote.className='modale-fond';
    hote.innerHTML='<div class="modale" role="dialog" aria-modal="true">'+
      '<p class="modale-txt">'+esc(message)+'</p>'+
      '<div class="modale-btns">'+
        '<button class="lien" data-mod="non">'+esc(opt.annule||'Annuler')+'</button>'+
        '<button class="primaire'+(opt.danger?' danger':'')+'" data-mod="oui">'+esc(opt.ok||'Confirmer')+'</button>'+
      '</div></div>';
    document.body.appendChild(hote);
    const fin=v=>{fermerModale();res(v);};
    hote.querySelector('[data-mod="oui"]').addEventListener('click',()=>fin(true));
    hote.querySelector('[data-mod="non"]').addEventListener('click',()=>fin(false));

}
function modaleAlert(message){
  return new Promise(res=>{
    fermerModale();

/* Défilement : uniquement dans #defile. recaler() remet le document à 0 si iOS l'a
   décalé (clavier, focus) — sans toucher pendant la saisie, pour ne pas masquer le champ. */
function hautPage(){const d=$('#defile');if(d)d.scrollTop=0;recaler();}
function basPage(){const d=$('#defile');if(d)d.scrollTop=d.scrollHeight;recaler();}
function saisieActive(){const a=document.activeElement;return !!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable));}
function recaler(){
  if(saisieActive())return;
  const de=document.documentElement;
  if(window.scrollY||window.scrollX||de.scrollTop||document.body.scrollTop){
    window.scrollTo(0,0);de.scrollTop=0;document.body.scrollTop=0;
  }
  ['racine','defile'].forEach(id=>{const e=document.getElementById(id);if(e&&e.scrollLeft)e.scrollLeft=0;});
  dezoomer();
}
// Si iOS a malgré tout zoomé (champ tiers, double tap), on réapplique la balise viewport :
// WebKit revient alors à l'échelle 1 sans recharger la page.
function dezoomer(){
  const vv=window.visualViewport;
  if(!vv||vv.scale<=1.01)return;
  const m=document.querySelector('meta[name=viewport]');if(!m)return;
  const c=m.getAttribute('content');
  m.setAttribute('content',c.replace(/,?\s*maximum-scale=[^,]*/,'')+', maximum-scale=1.0001');
  setTimeout(()=>m.setAttribute('content',c),60);
}

  } else {

  async function enregistrer(date){
    const A=S.ajout,l=A.resultat&&A.resultat.ligne;
    if(!l)return;
    A.confirm='envoi';rendre();
    // si ce repas provient d'une Modification (ancienne ligne connue), on retire
    // d'abord l'ancienne pour la remplacer, sans créer de doublon.
    const ancien=A.enregistre;
    // identifiant du repas : celui de la ligne modifiée, sinon un nouveau gardé sur le résultat
    // (un second appui ou un rejeu réutilise le même : la ligne est mise à jour, pas dupliquée).
    const id=(ancien&&ancien.id)||A.resultat.id||(A.resultat.id=nouvelId());
    if(ancien&&ancien.detail&&!ancien.id){
      try{await appel({action:'suppr',date:ancien.date,repas:ancien.repas,detail:ancien.detail,kcal:ancien.kcal});}
      catch(e){/* si la suppression échoue on continue : on préviendra du doublon éventuel */}
    }
    const payload=Object.assign({action:'enregistrer',date:date},l,{id:id,aliments:alimentsAEnvoyer(A.resultat)});
    try{
      const r=await appel(payload);
      // le repas est écrit : un échec de l'actualisation ne doit pas le faire passer pour non enregistré
      let rafraichi=true;
      try{await rafraichir();}catch(e){rafraichi=false;}
      A.confirm='fait';
      A.message=nb(r.kcal)+' kcal enregistrées en '+r.repas+' le '+jjmm(r.date)+'.'+
        (rafraichi?'':' Les chiffres du jour ne se sont pas mis à jour : touche Actualiser.');
      // on garde de quoi supprimer cette ligne si l'utilisateur la Modifie ensuite
      A.enregistre={id:r.id||id,date:(r.date||date),repas:l.repas,detail:l.detail,kcal:l.kcal};
      ecrireRepasCache();
    }catch(e){
      if(e&&e.reseau){
        // reseau coupe OU rate limit (429) : on ne perd pas le repas, file pour rejeu.
        empilerPending(payload);
        A.confirm='fait';
        A.message='Repas gardé, il sera enregistré dès que possible.';
        A.enregistre=null; // pas encore réellement dans le journal
        ecrireRepasCache();
      }else{
        A.confirm='ko';A.message=e.message;
      }
    }
    rendre();
  }

    const it=invitation(b.dataset.admPart),txt=messageInvite(it);
    // la feuille de partage doit s'ouvrir dans le geste, sans attente réseau avant
    if(navigator.share)navigator.share({text:txt}).catch(()=>{});
    else copier(txt,'Message copié : colle-le dans SMS ou WhatsApp.');
  }));
  document.querySelectorAll('[data-adm-copie]').forEach(b=>b.addEventListener('click',()=>copier(lienInvite(b.dataset.admCopie),'Lien copié.')));
  // ---- compte : nouveau code, fermeture, Raccourci ----
  on('#cpt-code','click',async()=>{
    if(!await modaleConfirm('Créer un nouveau code d\'accès ? L\'ancien ne marchera plus, pense à le changer aussi dans ton Raccourci.',{ok:'Changer'}))return;
    S.cpt.etat='envoi';rendre();
    try{const r=await appel({action:'compte',op:'code'});ecrireCfg({api:S.cfg.api,token:r.token});S.cpt.etat='ok';S.cpt.message='Nouveau code enregistré sur ce téléphone.';}
    catch(err){S.cpt.etat='ko';S.cpt.message=err.message;}
    rendre();
  });
  on('#cpt-fermer','click',async()=>{
    const v=String((($('#cpt-eff')||{}).value)||'').trim().toUpperCase();
    if(v!=='EFFACER'){S.cpt.etat='ko';S.cpt.message='Tape EFFACER pour confirmer.';rendre();return;}
    if(!await modaleConfirm('Fermer définitivement ton compte ?',{ok:'Fermer',danger:true}))return;
    try{
      await appel({action:'compte',op:'fermer',confirmation:'EFFACER'});
      [S.cle,S.cache,S.chat,S.repas,S.foods,S.pending,'suivi.cam'].forEach(k=>localStorage.removeItem(k));
      try{photoMem.clear();indexedDB.deleteDatabase(PHOTO_DB);photoDbP=null;}catch(e){}
      S.cfg=null;S.data=null;S.reglages=false;connexion('Compte fermé.');
    }catch(err){S.cpt.etat='ko';S.cpt.message=err.message;rendre();}
  });
  async function copierCpt(txt,msg){
    try{await navigator.clipboard.writeText(txt);S.cpt.etat='ok';S.cpt.message=msg;}catch(e){S.cpt.etat='ko';S.cpt.message='Copie impossible sur ce navigateur.';}
    rendre();
  }
  on('#cpt-copie-code','click',()=>copierCpt(S.cfg.token,'Code d\'accès copié : colle-le dans le champ token du Raccourci.'));
  on('#cpt-copie-api','click',()=>copierCpt(S.cfg.api,'Adresse du serveur copiée.'));

  document.querySelectorAll('[data-sup]').forEach(b=>{
    b.addEventListener('click',async()=>{
      const l=S.data.journal[Number(b.dataset.sup)];
      if(!l)return;
      if(!await modaleConfirm('Supprimer '+(l.detail||l.repas)+' ?',{ok:'Supprimer',danger:true}))return;
      b.textContent='\u2026';
      try{
        await appel({action:'suppr',id:l.id||'',date:l.date,repas:l.repas,detail:l.detail,kcal:l.kcal});
        await rafraichir();
      }catch(e){await modaleAlert(e.message);}
      rendre();
    });
  });
  // Modifier un repas depuis le journal : repris tel quel si ses aliments sont gardés,
  // sinon ré-analysé à partir de son texte (anciennes lignes), puis l'utilisateur ajuste et
  // réenregistre ; l'ancienne ligne est supprimée pour éviter le doublon.
  document.querySelectorAll('[data-jmod]').forEach(b=>{
    b.addEventListener('click',async()=>{
      const l=S.data.journal[Number(b.dataset.jmod)];
      if(!l)return;
      const A=S.ajout;
      // créneau et jour du repas d'origine
      const cle={matin:'matin',midi:'midi','en-cas':'encas',encas:'encas',soir:'soir'};
      A.repas=cle[String(l.repas||'').toLowerCase()]||repasParHeure();
      A.desc=l.detail||'';
      A.dateAutre=l.date||auj();
      // on retient la ligne d'origine pour la retirer une fois la version corrigée enregistrée
      A.enregistre={id:l.id||'',date:l.date,repas:l.repas,detail:l.detail,kcal:l.kcal};
      A.resultat=null;A.confirm=null;A.message='';A.photo=null;A.apercu=null;A.taille=0;
      if(Array.isArray(l.aliments)&&l.aliments.length){
        // aliments gardés dans le journal : on rouvre le repas tel quel, sans IA
        A.resultat=resultatDepuis(alimentsLigne(l),A.repas,'Repris de ton journal, sans nouvelle analyse.');
        A.desc='';A.etat=null;S.vue='ajout';ecrireRepasCache();rendre();hautPage();
        return;
      }
      S.vue='ajout';A.etat='envoi';rendre();hautPage();
      try{
        const r=await appel({action:'repas',repas:A.repas,description:A.desc,photo:'',mime:'image/jpeg'});
        A.etat=null;A.resultat=r;A.confirm=null;A.desc='';
        ecrireRepasCache();
      }catch(e){A.etat='ko';A.message=e.message;A.enregistre=null;}
      rendre();
    });
  });

  on('#c-envoi','click',async()=>{
    const q=((($('#c-q')||{}).value)||'').trim();
    if(!q)return;
    S.coach.fil.push({role:'moi',texte:q});
    S.coach.etat='envoi';rendre();
    try{
      const r=await appel({action:'conseil',question:q,
        historique:S.coach.fil.slice(-6).map(m=>({role:m.role,texte:m.texte}))});
      S.coach.fil.push({role:'coach',texte:r.texte});
    }catch(e){S.coach.fil.push({role:'coach',texte:e.message});}
    S.coach.etat=null;
    localStorage.setItem(S.chat,JSON.stringify(S.coach.fil.slice(-20)));
    rendre();
    basPage();
  });
  on('#c-vider','click',()=>{S.coach.fil=[];localStorage.removeItem(S.chat);rendre();});

  // --- Corps : pas, mensurations, photos ---
  on('#k-pas-ok','click',async()=>{
    const C=S.corps;
    const v=Math.round(Number(String((($('#k-pas')||{}).value)||'').replace(/\s/g,'').replace(',','.')));
    if(!(v>0&&v<=150000)){C.pasEtat='ko';C.pasMsg='Saisis un nombre de pas entre 1 et 150 000.';rendre();return;}
    C.pasEtat='envoi';rendre();
    try{
      await appel({action:'activite',date:auj(),pas:v,force:true});
      await rafraichir();
      C.pasEtat='ok';C.pasMsg=nb(v)+' pas enregistrés pour aujourd\'hui.';
    }catch(e){C.pasEtat='ko';C.pasMsg=e.message;}
    rendre();
  });
  on('#k-mes-ok','click',async()=>{
    const C=S.corps;
    const lit=sel=>String((($(sel)||{}).value)||'').trim().replace(',','.');
    const t=lit('#k-taille'),co=lit('#k-cou'),ha=lit('#k-hanches');
    if(!t){C.mesEtat='ko';C.mesMsg='Le tour de taille est obligatoire.';rendre();return;}
    const stat=Number(S.data&&S.data.profil&&S.data.profil.taille)||0;
    if(stat&&Math.abs(Number(t)-stat)<=3&&!await modaleConfirm('Tour de taille de '+String(t).replace('.',',')+' cm : c\'est ta taille en hauteur. Le champ attend ton tour de ventre, mesuré au niveau du nombril. Enregistrer quand même ?',{ok:'Enregistrer',annule:'Corriger'}))return;
    C.mesEtat='envoi';rendre();
    try{
      await appel({action:'mesure',date:auj(),taille_cm:t,cou_cm:co,hanches_cm:ha});
      await rafraichir();
      C.mesEtat='ok';C.mesMsg='Mensurations du '+jjmm(auj())+' enregistrées.';
    }catch(e){C.mesEtat='ko';C.mesMsg=e.message;}
    rendre();
  });
  document.querySelectorAll('#k-periode-pas button').forEach(b=>b.addEventListener('click',()=>{S.corps.periodePas=Number(b.dataset.kp);rendre();}));
  document.querySelectorAll('[data-bar]').forEach(r=>r.addEventListener('click',()=>{
    const [cle,date]=r.getAttribute('data-bar').split('|');
    S.corps.selBar=S.corps.selBar||{};
    S.corps.selBar[cle]=(S.corps.selBar[cle]===date)?null:date;
    rendre();
  }));
  document.querySelectorAll('#k-courbe button').forEach(b=>b.addEventListener('click',()=>{S.corps.courbe=b.dataset.kc;rendre();}));
  on('#k-ph-face','click',()=>ouvrirCamera('face'));
  on('#k-ph-profil','click',()=>ouvrirCamera('profil'));
  document.querySelectorAll('#k-cmp-type button').forEach(b=>b.addEventListener('click',()=>{
    S.corps.cmpType=b.dataset.kt;S.corps.cmpA=null;S.corps.cmpB=null;rendre();}));
  on('#k-cmp-a','change',e=>{S.corps.cmpA=e.target.value;rendre();});
  on('#k-cmp-b','change',e=>{S.corps.cmpB=e.target.value;rendre();});
  on('#k-cmp-r','input',e=>{
    const v=Number(e.target.value)||0;
    const a=$('#k-cmp-avant');if(a)a.style.clipPath='inset(0 '+(100-v)+'% 0 0)';
    const t=$('#k-cmp-trait');if(t)t.style.left=v+'%';
  });

  const ok=$('#r-ok');
  if(ok){
    ok.addEventListener('click',()=>{
      ecrireCfg({api:$('#r-api').value.trim(),token:$('#r-token').value.trim()});
      S.reglages=false;demarrer();
    });
    $('#r-out').addEventListener('click',()=>{
      [S.cle,S.cache,S.chat,S.repas,S.foods,S.pending,'suivi.cam'].forEach(k=>localStorage.removeItem(k));
      // photos d'évolution gardées sur ce téléphone : effacées aussi
      try{photoMem.clear();indexedDB.deleteDatabase(PHOTO_DB);photoDbP=null;}catch(e){}
      S.cfg=null;S.data=null;S.foods=[];S.file=[];connexion();
    });
  }
}

async function demarrer(){
  // lien d'invitation ouvert : page d'accueil dans Safari, inscription dans l'appli installée
  if(!S.ins&&/invite=/.test(location.hash||'')){
    const inv=lireInvite(location.hash),cfg=lireCfg();
    if(inv&&!(cfg&&cfg.token)){
      if(estInstallee()){S.ins=nouvelleIns(inv);oublierHash();renduIns();}
      else accueilInvite(inv);
      return;
    }
    oublierHash();
  }
  S.ajout.repas=repasParHeure();
  S.cfg=S.cfg||lireCfg();
  if(!S.cfg||!S.cfg.api||!S.cfg.token){connexion();return;}
  try{S.coach.fil=JSON.parse(localStorage.getItem(S.chat))||[];}catch(e){S.coach.fil=[];}
  S.foods=lireFoods();
  S.jour.onglet=ongletJourInit();
  S.crb=courbesInit();
  S.corps.onglet=corpsOngletInit();
  S.file=lirePending();
  S.att=lireAttente();
  const cache=lireRepasCache();
  if(cache){
    S.ajout.histo=Array.isArray(cache.histo)?cache.histo.slice(0,MAX_HISTO):[];
    const a=cache.actif;
    if(a&&a.resultat){
      S.ajout.repas=a.repas||S.ajout.repas;
      S.ajout.desc=a.desc||'';
      S.ajout.resultat=a.resultat;
      S.ajout.confirm=a.confirm||null;
      S.ajout.message=a.message||'';
      S.ajout.dateAutre=auj();
    }
  }
  const vieux=lireCache();
  if(vieux){S.data=vieux;rendre();}
  try{await rafraichir();rendre();}
  catch(e){
    if(S.data)return;
    connexion(e.message+' Vérifie l\'adresse et le code.');
  }
  rejouerPending();
  traiterAttente(true);
}

function jourChange(){
  return !!(S.data&&S.data.reference&&S.data.reference.date&&S.data.reference.date!==auj());
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(S.cam.ouvert){if(S.cam.capture)camArreterFlux();else fermerCamera();}
    if(S.ajout.scan.ouvert){arreterScan();S.ajout.scan.ouvert=false;S.ajout.scan.etat=null;rendre();}
    return;
  }
  if(!S.cfg||!S.data||S.reglages)return;
  rejouerPending();
  traiterAttente();
  // on force le rafraichissement si on a changé de jour, sinon un par minute au plus
  if(!jourChange()&&Date.now()-dernierAppel<60000)return;
  rafraichir().then(rendre).catch(()=>{});
});
// controle du passage de minuit tant que l'app reste ouverte
setInterval(()=>{
  if(document.hidden||!S.cfg||!S.data)return;
  if(jourChange())rafraichir().then(rendre).catch(()=>{});
  // relance la file d'attente si elle contient encore des repas (ex. apres un 429)
  if((S.file||[]).length)rejouerPending();
  traiterAttente();
},60000);
// rejeu de la file d'attente hors ligne au retour du reseau
window.addEventListener('online',()=>{if(S.cfg&&S.data){rejouerPending();traiterAttente(true);}});
async function actualiserApplication(){
  if(!('serviceWorker' in navigator))return;
  const registration=await navigator.serviceWorker.ready;
  await registration.update();
  const worker=registration.waiting||registration.installing;
  if(!worker)return;
  if(worker.state==='installing'){
    await new Promise(resolve=>worker.addEventListener('statechange',()=>{
      if(worker.state==='installed')resolve();
    }));
  }
  worker.postMessage({type:'SKIP_WAITING'});
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data&&e.data.type==='VERSION_ACTIVATED'){
      localStorage.setItem(VERSION_KEY,e.data.version);
      if(S.data)rendre();
    }
  });
  // Bascule automatique quand un nouveau SW prend la main.
  // Garde-fou : on ne recharge qu'une fois, jamais au tout premier lancement.
  let rechargEnCours=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(rechargEnCours)return;
    rechargEnCours=true;
    window.location.reload();
  });
  window.addEventListener('load',async()=>{try{
    const registration=await navigator.serviceWorker.register('./sw.js');
    await registration.update();
  }catch(e){}});
}
if(!localStorage.getItem(VERSION_KEY))localStorage.setItem(VERSION_KEY,APP_VERSION);
demarrer();
</script>
