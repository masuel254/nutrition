   workflow : une unité par aliment ("1 tranche", ou la portion mangée "150 g").
   Rien ne repasse par l'IA. */
const CRENEAUX=[['matin','Matin'],['midi','Midi'],['encas','En-cas'],['soir','Soir']];
function creneauDe(lib){const s=String(lib||'').toLowerCase();
  if(s.indexOf('matin')>=0)return 'matin';if(s.indexOf('midi')>=0)return 'midi';
  if(s.indexOf('cas')>=0)return 'encas';if(s.indexOf('soir')>=0)return 'soir';return '';}
function normNom(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[^a-z0-9%\s]/g,' ').replace(/\s+/g,' ').trim();}
const MASSE_Q=/^(g|gr|grammes?|kg|mg|ml|cl|dl|l|litres?)(?![a-zA-ZÀ-ſ])/i;
function plurielQ(s){return String(s).replace(/^[^\s]+/,w=>/[sxz]$/i.test(w)?w:w+'s');}
// Quantité affichée pour c unités d'un aliment du catalogue.
function qteUnite(it,c){
  if(it.mode==='n')return it.u?c+' '+(c>1?(it.up||it.u):it.u):String(c);
  const u=String(it.u||'1 portion');
  if(c===1)return u;
  const m=u.replace(',','.').match(/^(\d+(?:\.\d+)?)\s*([^\/].*)?$/);
  if(!m)return c+' × '+u;
  const v=Math.round(parseFloat(m[1])*c*10)/10;const reste=(m[2]||'').trim();
  return String(v).replace('.',',')+(reste?' '+(MASSE_Q.test(reste)?reste:plurielQ(reste)):'');
}
function alimentDepuis(it,c){
  const R=x=>Math.round((Number(x)||0)*c);
  const o={nom:it.nom,quantite:qteUnite(it,c),kcal:R(it.kcal),prot:R(it.prot),lip:R(it.lip),gluc:R(it.gluc),
    fibres:R(it.fibres),sucres:R(it.sucres),sodium:R(it.sodium),satures:R(it.satures),sucres_ajoutes:R(it.sucres_ajoutes)};
  if(it.purines!==undefined){o.famille=it.famille||'';o.grammes=R(it.grammes);o.purines=R(it.purines);
    o.purines_risque=R(it.purines_risque);o.alcool=Math.round((Number(it.alcool)||0)*c*10)/10;o.sucree=it.sucree?c:0;}

function alimentsLigne(l){

  return [{nom:l.detail||l.repas||'Repas',quantite:'\u00d71',kcal:l.kcal||0,prot:l.prot||0,lip:l.lip||0,gluc:l.gluc||0,

function alimentsAEnvoyer(r){

function libDate(d){

// Clé de composition d'un repas : noms des aliments, triés, sans quantités. Calculée
// pareil depuis les aliments gardés ou depuis le texte du détail (anciennes lignes),
// pour qu'un ancien repas et le même repas récent tombent dans le même groupe.
function nomSeul(s){return normNom(String(s||'').replace(/\([^)]*\)/g,' ').replace(/\s\u00b7\s.*$/,''));}
function nomsDetail(d){
  const out=[];let buf='',p=0;const t=String(d||'');
  for(const ch of t){if(ch==='(')p++;else if(ch===')')p=Math.max(0,p-1);
    if(ch===','&&p===0){out.push(buf);buf='';}else buf+=ch;}
  out.push(buf);return out.map(nomSeul).filter(Boolean);
}
function cleCompo(l){
  const n=(Array.isArray(l.aliments)&&l.aliments.length)?l.aliments.map(a=>nomSeul(a.nom)):nomsDetail(l.detail);
  return n.filter(Boolean).sort().join('|');
}
// Derniers repas d'un créneau, regroupés quand la composition est identique.
function repasARefaire(d,cr){
  const grp={},ordre=[];
  ((d&&d.journal)||[]).forEach(l=>{
    if(!l||!l.kcal)return;
    if(cr!=='tous'&&creneauDe(l.repas)!==cr)return;
    const k=cleCompo(l);if(!k)return;
    if(!grp[k]){grp[k]={l:l,n:0};ordre.push(k);}
    // le représentant est le repas le plus récent qui a le détail par aliment
    else if(!(Array.isArray(grp[k].l.aliments)&&grp[k].l.aliments.length)&&Array.isArray(l.aliments)&&l.aliments.length)grp[k].l=l;
    grp[k].n++;
  });
  const liste=ordre.map(k=>grp[k]);
  let hab=null;
  liste.forEach(g=>{if(g.n>=3&&(!hab||g.n>hab.n))hab=g;});
  const autres=liste.filter(g=>g!==hab).slice(0,hab?5:6);
  return (hab?[Object.assign({hab:true},hab)]:[]).concat(autres);

function catalogueDe(d,cr){
  const cat=((d&&d.catalogue)||[]).filter(it=>it&&it.k&&it.nom);
  if(cr==='tous')return cat.slice();
  return cat.filter(it=>it.cr&&it.cr[cr]>0).sort((a,b)=>(b.cr[cr]-a.cr[cr])||(b.n-a.n));

function ongletsCr(id,actif,avecTous){

function totalCompo(d){

        :'<div class="rac-pas zero"><button class="pl" data-cp="'+esc(it.k)+'" aria-label="Ajouter">+</button></div>';

function filtrerTuiles(){

// Extrait le nombre d'une quantité texte ("200 g" -> 200, "2 oeufs" -> 2).
// Renvoie null si aucun nombre exploitable (ex. "une poignée").
function qteNombre(q){
  const m=String(q||'').replace(',','.').match(/(\d+(?:\.\d+)?)/);
  return m?parseFloat(m[1]):null;
}
// Reconstruit le texte de quantité en remplaçant le nombre (garde l'unité).
function qteRemplace(q,val){
  const s=String(q||'');
  if(/(\d+(?:[.,]\d+)?)/.test(s))return s.replace(/(\d+(?:[.,]\d+)?)/,nb(val));
  return nb(val);
}
// Pas d'incrément adapté à la quantité (grammes -> 10, unités -> 1).
function qtePas(q){
  const n=qteNombre(q);
  if(n===null)return 1;
  return n>=20?10:(n>=5?1:1);
}
// Ajuste un aliment à une nouvelle quantité, au prorata de l'ancienne.
function ajusteAliment(al,nouvelleQte){
  const base=al.__base||al;
  const q0=qteNombre(base.quantite);
  if(q0===null||q0<=0)return al;
  const f=nouvelleQte/q0;
  const R=x=>Math.round((Number(x)||0)*f);
  const o={nom:base.nom,quantite:qteRemplace(base.quantite,nouvelleQte),
    kcal:R(base.kcal),prot:R(base.prot),lip:R(base.lip),gluc:R(base.gluc),
    fibres:R(base.fibres),sucres:R(base.sucres),sodium:R(base.sodium),satures:R(base.satures),sucres_ajoutes:R(base.sucres_ajoutes),__base:base};
  if(base.purines!==undefined){
    o.purines=R(base.purines);o.purines_risque=R(base.purines_risque);
    o.alcool=Math.round((Number(base.alcool)||0)*f*10)/10;o.sucree=base.sucree||0;
    o.famille=base.famille||'';o.grammes=R(base.grammes);
  }
  return o;
}
// Recalcule le total d'un résultat à partir de ses aliments.
function recalculeTotal(r){
  const s={kcal:0,prot:0,lip:0,gluc:0,fibres:0,sucres:0,sodium:0,satures:0,sucres_ajoutes:0};
  (r.aliments||[]).forEach(a=>{['kcal','prot','lip','gluc','fibres','sucres','sodium','satures','sucres_ajoutes'].forEach(k=>{s[k]+=Number(a[k])||0;});});
  Object.keys(s).forEach(k=>s[k]=Math.round(s[k]));
  // purines / alcool / boissons sucrées, dès qu'un aliment les porte
  if((r.aliments||[]).some(a=>a.purines!==undefined)){
    const som=k=>(r.aliments||[]).reduce((t,a)=>t+(Number(a[k])||0),0);
    s.purines=Math.round(som('purines'));s.purines_risque=Math.round(som('purines_risque'));
    s.alcool=Math.round(som('alcool')*10)/10;s.boissons_sucrees=Math.round(som('sucree'));
  }
  r.total=s;
  if(r.ligne){r.ligne.kcal=s.kcal;r.ligne.prot=s.prot;r.ligne.lip=s.lip;r.ligne.gluc=s.gluc;
    r.ligne.fibres=s.fibres;r.ligne.sucres=s.sucres;r.ligne.sodium=s.sodium;r.ligne.satures=s.satures;r.ligne.sucres_ajoutes=s.sucres_ajoutes;
    if(s.purines!==undefined){r.ligne.purines=s.purines;r.ligne.purines_risque=s.purines_risque;
      r.ligne.alcool=s.alcool;r.ligne.boissons_sucrees=s.boissons_sucrees;}
    r.ligne.detail=(r.aliments||[]).map(a=>a.nom+(a.quantite?' ('+a.quantite+')':'')).join(', ');}
}

function blocNutriscore(d){
  // Distribution des Nutri-Scores sur les seuls produits CONSOMMÉS.
  // d.journal ne contient que les repas enregistrés : les estimations
  // (repas 'estim') ne sont jamais écrites, donc elles sont exclues de fait.
  const N={a:0,b:0,c:0,d:0,e:0};
  let tot=0;
  (d.journal||[]).forEach(r=>{
    const s=String(r.nutriscore||'').trim().toLowerCase();
    if(/^[abcde]$/.test(s)){N[s]++;tot++;}
  });
  if(!tot)return '';
  const ORD=['a','b','c','d','e'];
  const COUL={a:'#188040',b:'#7ac13c',c:'#f2c200',d:'#ea7c1b',e:'#d63636'};
  const pct=g=>N[g]/tot*100;

  // Barre empilée : un segment par grade présent, largeur = part.
  let barre='<div class="ns-barre">';
  ORD.forEach(g=>{ if(N[g]) barre+='<span class="ns-seg" style="width:'+pct(g).toFixed(2)+'%;background:'+COUL[g]+'"'+
    ' title="'+g.toUpperCase()+' : '+Math.round(pct(g))+'%">'+
    (pct(g)>=11?'<b>'+g.toUpperCase()+'</b><small>'+Math.round(pct(g))+'%</small>':'')+'</span>'; });
  barre+='</div>';

  // Légende : une pastille + part + effectif par grade présent.
  let leg='<div class="ns-leg">';
  ORD.forEach(g=>{ if(N[g]) leg+='<div class="ns-leg-i"><span class="nutri '+g+'" style="width:22px;height:22px;font-size:13px">'+g.toUpperCase()+'</span>'+
    '<div><b>'+Math.round(pct(g))+'%</b><small>'+N[g]+(N[g]>1?' produits':' produit')+'</small></div></div>'; });
  leg+='</div>';

  // Score de qualité : moyenne pondérée A=5..E=1, sur 5, et lecture.
  const PTS={a:5,b:4,c:3,d:2,e:1};
  const moy=ORD.reduce((s,g)=>s+PTS[g]*N[g],0)/tot;
  let lecture,cls;
  if(moy>=4){lecture='Très bon panier : la majorité de tes produits emballés sont bien notés.';cls='bien';}
  else if(moy>=3){lecture='Panier correct. Viser un peu plus de A et B ferait la différence.';cls='';}
  else{lecture='Beaucoup de produits mal notés (D et E). C\'est le poste le plus simple à améliorer.';cls='alerte';}

  // En-tête : part de A et de B affichées séparément (pas regroupées).
  const tete=[];
  if(N.a)tete.push('<span class="nutri a" style="width:18px;height:18px;font-size:10px;vertical-align:-3px;margin-right:4px">A</span>'+Math.round(pct('a'))+'%');
  if(N.b)tete.push('<span class="nutri b" style="width:18px;height:18px;font-size:10px;vertical-align:-3px;margin-right:4px">B</span>'+Math.round(pct('b'))+'%');
  const teteTxt=tete.length?tete.join('<span style="color:var(--soft);margin:0 6px">·</span>'):'Aucun produit bien noté';

  let h='<section><h2>Qualité des produits scannés</h2>';
  h+='<div class="ns-tete"><div class="ns-note"><b>'+moy.toFixed(1).replace('.',',')+'</b><small>/5</small></div>'+
     '<div class="ns-tete-t"><b>'+teteTxt+'</b>'+
     '<small>sur '+tot+(tot>1?' produits consommés':' produit consommé')+'</small></div></div>';
  h+=barre+leg;
  h+='<p class="note '+cls+'">'+lecture+' Basé uniquement sur les produits que tu as enregistrés dans un repas, avec un Nutri-Score officiel Open Food Facts.</p>';
  h+='</section>';
  return h;
}

/* Perte réelle (balance) et théorique (déficit) sur la période.
   Fenêtre glissante qui se termine à la dernière pesée ; periode 0 = tout. */
function calcProgression(d,periode){
  const pes=(d.poids||[]).filter(x=>x&&x.date&&typeof x.poids==='number');
  const cumule=d.deficit&&d.deficit.cumule?d.deficit.cumule:[];
  if(pes.length<2&&cumule.length<2)return null;
  const finDate=pes.length?pes[pes.length-1].date:(cumule.length?cumule[cumule.length-1].date:auj());
  let debutISO=null;
  if(periode>0){
    const f=new Date(finDate+'T00:00:00Z');f.setUTCDate(f.getUTCDate()-periode);
    debutISO=f.toISOString().slice(0,10);
  }
  const jours=iso=>Math.round((new Date(iso+'T00:00:00Z'))/86400000);
  // poids à une date : interpolation entre les deux pesées qui l'encadrent
  function poidsA(iso){
    if(iso<=pes[0].date)return pes[0].poids;
    if(iso>=pes[pes.length-1].date)return pes[pes.length-1].poids;
    for(let i=0;i<pes.length-1;i++){
      const a=pes[i],b=pes[i+1];
      if(iso>=a.date&&iso<=b.date){
        if(iso===a.date)return a.poids;
        if(iso===b.date)return b.poids;
        return a.poids+(b.poids-a.poids)*(jours(iso)-jours(a.date))/(jours(b.date)-jours(a.date));
      }
    }
    return pes[pes.length-1].poids;
  }
  const pFin=pes.length?pes[pes.length-1]:null;
  let pRef=null,refEstime=false;
  if(pes.length){
    if(!debutISO||debutISO<=pes[0].date)pRef=pes[0];
    else{pRef={date:debutISO,poids:poidsA(debutISO)};refEstime=!pes.some(x=>x.date===debutISO);}
  }
  const reel=(pRef&&pFin&&pRef.date!==pFin.date)?(pFin.poids-pRef.poids):null;   // <0 = perte
  function cumulA(iso){
    let v=cumule[0].cumul;
    for(let i=0;i<cumule.length;i++){if(cumule[i].date<=iso)v=cumule[i].cumul;else break;}
    return v;
  }
  let theoKg=null;
  if(cumule.length)theoKg=(cumule[cumule.length-1].cumul-(debutISO?(cumulA(debutISO)||0):0))/7000;
  let ryth=null,nbJours=null;
  if(reel!==null){
    nbJours=jours(pFin.date)-jours(pRef.date);
    if(nbJours>0)ryth=reel/nbJours*7;
  }
  return {reel,theoKg,ryth,nbJours,debutISO,refDate:pRef?pRef.date:null,finDate:pFin?pFin.date:null,refEstime};
}
const kgSigne=v=>(v<0?'−':v>0?'+':'±')+Math.abs(v).toFixed(1).replace('.',',');
const coulKg=v=>{const s=sensObj();if(!v||s===0)return '';return (v>0)===(s>0)?'var(--under)':'var(--over)';};

    '<b>Théorique</b> : ce que ton écart aux besoins prévoit, 7000 kcal = 1 kg. L’eau et la digestion font varier la balance au jour le jour, c’est la tendance qui compte.</p>';
  if(cv==='poids'){
    const pts=p.filter(dansPer).map(r=>({date:r.date,v:r.poids}));
    h+=pts.length<2?peu:serieCourbe(pts,{h:150,unite:' kg',dec:1,moyenne:true,titre:'poids',badgeW:58});

  }else if(cv==='besoins'){

    if(bpts.length<2)h+=peu;
    else{
      h+=serieCourbe(bpts,{h:150,unite:' kcal',dec:0,moyenne:false,titre:'besoins',couleur:'var(--over)',legende:'besoins',badgeW:66});
      const eb=bpts[bpts.length-1].v-bpts[0].v;
      h+=aide('<p class="note">Tes besoins évoluent avec ton poids : chaque kilo perdu réduit un peu ta dépense. '+

  return h;

/* ---------- Journal : semaine en cours jour par jour, semaines passées repliées ----------
   Les totaux (jours, semaines) viennent de d.jours, qui couvre tout l'historique. Le détail
   des repas n'est livré par /data que depuis d.journal_depuis (lundi de la semaine
   précédente) ; au-delà, une semaine est chargée à la demande (action journal) quand on
   ouvre un de ses jours. */
function lundiJn(iso){const x=new Date(iso+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return isoLocal(x);}
function plusJours(iso,n){const x=new Date(iso+'T12:00:00');x.setDate(x.getDate()+n);return isoLocal(x);}
function semaineChargee(d,lun){
  if(!d.journal_depuis)return true;           // ancien workflow : tout est déjà là
  return lun>=d.journal_depuis||!!(d.__sem&&d.__sem[lun]);
}
function libJourCourt(iso){
  if(iso===auj())return 'Aujourd’hui';

}

      h+='<div class="ligne" data-ouvre="'+r.__i+'"><div class="quoi">'+
         '<div class="detail">'+pastille+esc(r.detail||'sans description')+'</div>'+
         '<div class="macro">P '+nb(r.prot)+' · L '+nb(r.lip)+' · G '+nb(r.gluc)+
         ((r.purines_risque||0)>0?' · <span'+((r.purines_risque||0)>=150?' class="sur"':'')+'>purines '+nb(r.purines_risque)+' mg</span>':'')+'</div></div>'+
         '<div class="kcal">'+nb(r.kcal)+' kcal</div>'+

}
function ligneJourJn(d,iso,J){

    '<span class="jn-bar">'+(c?'<i style="width:'+pct.toFixed(0)+'%;background:'+col+'"></i>':'')+'</span>'+

    const lun=lundiJn(iso);

    if(S.jn.err[lun])h+='<p class="alerte">'+esc(S.jn.err[lun])+'</p><button class="lien" data-jre="'+lun+'">Réessayer</button>';
    else if(!semaineChargee(d,lun))h+='<p class="note"><span class="attente"></span>Chargement du détail</p>';

    }

  }

}
function vueJournal(d){
  const jours=(d.jours||[]).filter(j=>j&&j.date&&(j.kcal>0||j.repas>0));
  (d.journal||[]).forEach((r,i)=>{r.__i=i;});
  if(!jours.length&&!(d.journal||[]).length)return '<p class="vide">Rien d\'enregistré pour le moment. Passe par Ajouter.</p>';
  const J={};jours.forEach(j=>{J[j.date]=j;});
  // jour présent dans le détail mais absent des totaux (cas limite) : total recalculé ici
  (d.journal||[]).forEach(r=>{if(!J[r.date])J[r.date]={date:r.date,kcal:0,repas:0,cible:0,__ajoute:1};
    const j=J[r.date];if(j.__ajoute){j.kcal+=r.kcal;if(r.kcal>0)j.repas++;}});
  const dates=Object.keys(J).sort().reverse();
  const cur=lundiJn(auj());
  if(!S.jn.ouv){
    // à l'ouverture : le jour le plus récent déplié (et sa semaine si elle est passée)
    S.jn.ouv={};
    if(dates[0]){S.jn.ouv['j:'+dates[0]]=1;const l=lundiJn(dates[0]);if(l!==cur)S.jn.ouv['s:'+l]=1;}
  }
  const sem={};dates.forEach(s=>{const l=lundiJn(s);(sem[l]=sem[l]||[]).push(s);});
  let h='<section class="jn">'+bilanSemaine(d)+'<div class="jn-t">Cette semaine</div>';
  if(sem[cur]){h+='<div class="jn-carte">';sem[cur].forEach(s=>{h+=ligneJourJn(d,s,J);});h+='</div>';}
  else h+='<p class="note">Rien de saisi cette semaine pour l’instant.</p>';
  const passees=Object.keys(sem).filter(l=>l!==cur).sort().reverse();
  if(passees.length)h+='<div class="jn-t">Semaines précédentes</div>';
  passees.slice(0,S.jn.nbSem).forEach(l=>{
    const ds=sem[l],fin=plusJours(l,6);

    const moy=base.reduce((t,j)=>t+j.kcal,0)/(base.length||1);
    const cibles=base.filter(j=>j.cible>0);const cm=cibles.length?cibles.reduce((t,j)=>t+j.cible,0)/cibles.length:0;
    const sur=js.filter(j=>j.cible>0&&!bonJourApp(j.kcal,j.cible)).length;
    const col=cm?couleurJourFini(moy,cm):'var(--ink)';
    const o=!!S.jn.ouv['s:'+l];
    const m0=MOIS[Number(l.slice(5,7))-1],m1=MOIS[Number(fin.slice(5,7))-1];
    h+='<div class="jn-sem'+(o?' o':'')+'"><button class="jn-sem-t" data-st="'+l+'" aria-expanded="'+(o?'true':'false')+'">'+
      '<span class="jn-sem-n"><b>Semaine du '+Number(l.slice(8,10))+(m0!==m1?' '+m0:'')+' au '+Number(fin.slice(8,10))+' '+m1+'</b>'+
      '<small>'+ds.length+' jour'+(ds.length>1?'s':'')+' saisi'+(ds.length>1?'s':'')+(cm?' · '+sur+' '+libRateApp():'')+'</small></span>'+
      '<span class="jn-moy"><b style="color:'+col+'">'+nb(moy)+'</b>&nbsp;<small>kcal/j</small>'+(cm?'<small class="e">'+sgn(moy-cm)+'&nbsp;/j</small>':'')+'</span>'+
      '<span class="jn-ch">›</span></button>';
    if(o){h+='<div class="jn-carte jn-dans">';ds.forEach(s=>{h+=ligneJourJn(d,s,J);});h+='</div>';}
    h+='</div>';
  });
  const reste=passees.length-S.jn.nbSem;
  if(reste>0)h+='<button class="jn-plus" id="jn-plus">Voir '+Math.min(4,reste)+' semaine'+(Math.min(4,reste)>1?'s':'')+' de plus</button>';
  return h+'</section>';
}
// Charge le détail d'une semaine ancienne (lundi -> dimanche) et le greffe au journal en mémoire.
async function chargerSemaine(lun){
  if(S.jn.charge[lun]||!S.data)return;
  S.jn.charge[lun]=true;
  const d=S.data;
  try{
    const r=await appel({action:'journal',debut:lun,fin:plusJours(lun,6)});
    if(S.data!==d)return;                      // données rechargées entre-temps : on laisse tomber
    const fin=plusJours(lun,6);
    d.journal=(d.journal||[]).filter(x=>!(x.date>=lun&&x.date<=fin)).concat(r.journal||[]);
    d.__sem=d.__sem||{};d.__sem[lun]=true;delete S.jn.err[lun];
  }catch(e){S.jn.err[lun]='Détail indisponible : '+e.message;}
  finally{delete S.jn.charge[lun];}
  if(S.vue==='journal')rendre();
}

/* ---------- Objectif de poids et projection ----------
   Rythme actuel = pente (régression linéaire) des pesées des 28 derniers jours, ou 56 si
   elles sont trop peu nombreuses. Rythme prévu = écart cible/besoins du jour, 7000 kcal = 1 kg. */
function nouvelId(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
const kgTxt=v=>{const r=Math.round(v*10)/10;return (r%1===0?String(r):r.toFixed(1)).replace('.',',');};
function penteKgJour(pes,jours){
  if(!pes.length)return null;
  const fin=pes[pes.length-1].date;
  const dj=s=>Math.round(new Date(s+'T12:00:00')/86400000);
  const pts=pes.filter(p=>dj(fin)-dj(p.date)<=jours);
  if(pts.length<3||dj(fin)-dj(pts[0].date)<10)return null;
  const xs=pts.map(p=>dj(p.date)),ys=pts.map(p=>p.poids);
  const mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)*(x-mx);});
  return den?{pente:num/den,sem:Math.round((dj(fin)-dj(pts[0].date))/7)}:null;
}
function dateDans(jours){const x=new Date();x.setHours(12,0,0,0);x.setDate(x.getDate()+Math.round(jours));return x;}
function libDateLongue(x){return x.getDate()+' '+MOIS[x.getMonth()]+' '+x.getFullYear();}
function blocObjectif(d){
  const pes=(d.poids||[]).filter(p=>p&&p.date&&typeof p.poids==='number').sort((a,b)=>a.date.localeCompare(b.date));
  if(!pes.length)return '';
  const ob=Number(d.reference&&d.reference.objectif_poids)||0;
  if(!ob)return '<section><p class="note">Fixe ton objectif de poids dans Réglages pour voir quand tu devrais l’atteindre.</p></section>';
  const cur=pes[pes.length-1].poids,reste=cur-ob,sens=reste>0?-1:1;   // -1 : il faut perdre
  let h='<section class="obj"><div class="obj-tete"><span>Objectif <b>'+kgTxt(ob)+' kg</b></span>';
  if(Math.abs(reste)<0.3){return h+'<span class="obj-reste bien">atteint</span></div><p class="note">Tu es à '+kgTxt(cur)+' kg. Bravo : pense maintenant à stabiliser (cible proche de tes besoins).</p></section>';}
  h+='<span class="obj-reste">reste '+kgTxt(Math.abs(reste))+' kg</span></div>';
  // barre de progression depuis la première pesée
  const dep=pes[0].poids,frac=dep!==ob?Math.max(0,Math.min(1,(dep-cur)/(dep-ob))):0;
  if(dep!==ob)h+='<div class="obj-barre"><i style="width:'+(frac*100).toFixed(0)+'%"></i></div><div class="obj-bornes"><span>'+kgTxt(dep)+' kg</span><span>'+kgTxt(cur)+' kg aujourd’hui</span><span>'+kgTxt(ob)+' kg</span></div>';
  const lignes=[];
  let p=penteKgJour(pes,28);if(!p)p=penteKgJour(pes,56);
  if(p){
    const r=p.pente*7;
    if(Math.sign(p.pente)===sens&&Math.abs(p.pente)>0.005){
      const j=Math.abs(reste/p.pente);
      lignes.push('Au rythme actuel ('+(r<0?'−':'+')+kgTxt(Math.abs(r))+' kg/sem sur '+p.sem+' sem.) : <b>'+(j>1095?'plus de 3 ans':'vers le '+libDateLongue(dateDans(j)))+'</b>');
    }else lignes.push('Au rythme actuel ('+(r<0?'−':r>0?'+':'±')+kgTxt(Math.abs(r))+' kg/sem sur '+p.sem+' sem.) : tendance '+(Math.abs(p.pente)<=0.005?'stable':'dans le mauvais sens')+', pas de date estimable.');
  }else lignes.push('Pas encore assez de pesées récentes pour estimer ton rythme (3 pesées sur au moins 10 jours).');
  const e=d.reference&&d.reference.ecart;
  if(typeof e==='number'&&e!==0&&Math.sign(e)===sens){
    const rp=e*7/7000,j=Math.abs(reste/(e/7000));
    lignes.push('Au rythme prévu par ta cible ('+(rp<0?'−':'+')+kgTxt(Math.abs(rp))+' kg/sem) : vers le '+libDateLongue(dateDans(j)));
  }
  return h+'<ul class="obj-l">'+lignes.map(l=>'<li>'+l+'</li>').join('')+'</ul></section>';
}

/* ---------- Bilan de la semaine dernière (lundi -> dimanche), en tête du Journal ----------
   Mêmes règles que le message Telegram du lundi matin. */
function bilanSemaine(d){
  const lun=plusJours(lundiJn(auj()),-7),dim=plusJours(lun,6);
  const js=(d.jours||[]).filter(j=>j.date>=lun&&j.date<=dim&&(j.kcal>0||j.repas>0));
  if(!js.length)return '';
  const val=js.filter(j=>j.valide),base=val.length?val:js;
  const moy=base.reduce((t,j)=>t+j.kcal,0)/base.length;
  const cib=base.filter(j=>j.cible>0),cm=cib.length?cib.reduce((t,j)=>t+j.cible,0)/cib.length:0;
  const sous=val.filter(j=>j.cible>0&&bonJourApp(j.kcal,j.cible)).length;
  const ec=val.filter(j=>j.ecart!==null&&j.ecart!==undefined),def=ec.reduce((t,j)=>t+j.ecart,0);
  const l=[];
  l.push('<b>'+nb(moy)+' kcal/j</b> en moyenne'+(cm?' (cible '+nb(cm)+')':'')+(val.length?', '+sous+' jour'+(sous>1?'s':'')+' sur '+val.length+' '+libBonApp():''));
  if(ec.length)l.push((def<0?'Déficit ':'Excédent ')+'<b>'+nb(Math.abs(def))+' kcal</b> sur '+ec.length+' jour'+(ec.length>1?'s':'')+' ≈ '+(def<0?'−':'+')+kgTxt(Math.abs(def)/7000)+' kg');
  const pes=(d.poids||[]).filter(p=>p&&typeof p.poids==='number').sort((a,b)=>a.date.localeCompare(b.date));
  const pw=pes.filter(p=>p.date>=lun&&p.date<=dim),av=pes.filter(p=>p.date<lun);
  if(pw.length){const fin=pw[pw.length-1].poids,ref=av.length?av[av.length-1].poids:pw[0].poids,dv=fin-ref;
    l.push('Poids <b>'+kgTxt(fin)+' kg</b>'+(av.length||pw.length>1?' ('+(dv>0?'+':dv<0?'−':'±')+kgTxt(Math.abs(dv))+' kg)':''));}
  const max=purMax(d);
  if(js.some(j=>(j.purines_risque||0)>0)){const mp=js.reduce((t,j)=>t+(j.purines_risque||0),0)/js.length,ns=js.filter(j=>(j.purines_risque||0)>max).length;
    l.push('Purines à risque <b>'+nb(mp)+' mg/j</b>'+(ns?', '+ns+' jour'+(ns>1?'s':'')+' au-dessus du plafond':', jamais au-dessus du plafond'));}
  const ja=js.filter(j=>(j.alcool||0)>0);
  if(ja.length)l.push('Alcool <b>'+ja.length+' jour'+(ja.length>1?'s':'')+'</b>, <b>'+verresTxt(ja.reduce((t,j)=>t+(j.alcool||0),0))+'</b> (repère : 10 par semaine)');
  const pas=(d.activite||[]).filter(a=>a.date>=lun&&a.date<=dim&&a.pas>0);
  if(pas.length)l.push('<b>'+nb(pas.reduce((t,a)=>t+a.pas,0)/pas.length)+' pas/j</b> en moyenne');
  const x0=new Date(lun+'T12:00:00'),x1=new Date(dim+'T12:00:00');
  return '<div class="bilan-s"><div class="bilan-t">Semaine dernière <small>du '+x0.getDate()+(x0.getMonth()!==x1.getMonth()?' '+MOIS[x0.getMonth()]:'')+' au '+x1.getDate()+' '+MOIS[x1.getMonth()]+'</small></div><ul>'+l.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>';
}

/* ---------- Objectif de la personne : sèche (-1), stabilisation (0), prise de masse (+1) ----------
   Toutes les couleurs « bien / pas bien » passent par ici, pour que l'appli lise juste quel que
   soit l'objectif. Vert = va dans le sens de l'objectif, orange = va contre. */
const OBJ_DEF={
  seche:{lib:'Sèche',ecart:-500,min:-1000,max:-100,aide:'Perdre de la graisse : manger sous tes besoins.'},
  stabilisation:{lib:'Stabilisation',ecart:0,min:-150,max:150,aide:'Garder ton poids : manger à hauteur de tes besoins.'},
  prise:{lib:'Prise de masse',ecart:300,min:100,max:800,aide:'Prendre du muscle : manger un peu au-dessus de tes besoins, avec de la musculation.'}
};
function objectifApp(d){
  const r=((d||S.data)||{}).reference||{};
  if(OBJ_DEF[r.objectif])return r.objectif;
  if(typeof r.ecart==='number')return r.ecart<-50?'seche':(r.ecart>50?'prise':'stabilisation');
  return 'seche';
}
function sensObj(d){const o=objectifApp(d);return o==='prise'?1:(o==='stabilisation'?0:-1);}
// Calories du jour en cours face à la cible : en prise de masse ou en stabilisation, être sous la
// cible pendant la journée est normal (vert) ; seul un net dépassement se colore.
function couleurKcal(v,t){
  const s=sensObj();
  if(s<0||!t)return couleurDepassement(v,t);
  const tol=s>0?1.15:1.05;
  return v<=t*tol?'var(--under)':couleurDepassement(v,t*tol);
}
function pastilleKcal(v,t){
  const s=sensObj(),d=Math.round(Math.abs(t-v));
  if(s>0){
    if(v<t)return {coul:'var(--under)',txt:nb(d)+' kcal à manger encore'};
    if(v<=t*1.15)return {coul:'var(--under)',txt:'Cible atteinte'+(d?' (+'+nb(d)+')':'')};
    return {coul:couleurKcal(v,t),txt:nb(d)+' kcal au-delà'};
  }
  if(s===0){
    if(v<t*0.95)return {coul:'var(--under)',txt:nb(d)+' kcal restantes'};
    if(v<=t*1.05)return {coul:'var(--under)',txt:'Dans la cible'};
    return {coul:couleurKcal(v,t),txt:nb(d)+' kcal en trop'};
  }
  return v>t?{coul:couleurDepassement(v,t),txt:nb(d)+' kcal en trop'}:{coul:'var(--under)',txt:nb(d)+' kcal restantes'};
}
// Journée terminée : réussie ou non au regard de l'objectif (mêmes règles que le serveur).
function bonJourApp(kcal,cible){
  if(!cible)return false;
  const s=sensObj();
  if(s>0)return kcal>=cible*0.95;
  if(s===0)return Math.abs(kcal-cible)<=cible*0.1;
  return kcal<=cible;
}
function libBonApp(){const s=sensObj();return s>0?'à la cible ou au-dessus':(s===0?'dans la cible (à 10 % près)':'sous la cible');}
function libRateApp(){const s=sensObj();return s>0?'sous la cible':(s===0?'hors de la cible':'au-dessus de la cible');}
function couleurJourFini(kcal,cible){
  if(!cible)return 'var(--soft)';
  const s=sensObj();
  if(s<0)return couleurDepassement(kcal,cible);
  if(bonJourApp(kcal,cible))return 'var(--under)';
  const r=Math.abs(kcal-cible)/cible;
  return r<=0.2?'var(--jaune)':'var(--over)';
}
// Écart du jour par rapport aux besoins (kcal mangées − besoins).
function coulEcart(e){
  const s=sensObj();
  if(s<0)return e<0?'var(--under)':'var(--over)';
  if(s>0)return e>0?'var(--under)':'var(--over)';
  return Math.abs(e)<=150?'var(--under)':'var(--over)';
}
function clsEcart(e){return coulEcart(e)==='var(--under)'?'sous':'sur';}
// Variation de poids (ou de pente) : descend en sèche, monte en prise, reste stable en stabilisation.
function coulPente(p,seuil){
  const s=sensObj(),sl=seuil||0.2;
  if(s===0)return Math.abs(p)<=sl?'var(--under)':'var(--ambre)';
  if(Math.abs(p)<=sl)return 'var(--ambre)';
  return (p>0)===(s>0)?'var(--under)':'var(--over)';
}
// Calories d'un repas face à sa part de cible.
function clsRepas(v,ci){
  if(!ci)return 'sous';
  const s=sensObj();
  if(s>0)return 'sous';
  if(s===0)return v>ci*1.1?'sur':'sous';
  return v>ci?'sur':'sous';
}
function libCouleursEcart(){const s=sensObj();return s>0?'Vert = surplus (au-dessus de tes besoins, tu construis), orange = sous tes besoins.':(s===0?'Vert = à 150 kcal près de tes besoins, orange = plus loin.':'Vert = déficit (sous tes besoins, tu perds), orange = surplus.');}
function noteRegulier(){
  const s=sensObj(),c=k=>'<span style="color:'+coulPente(k,0.2)+'">';
  const base='Chaque barre compare ta dernière pesée de la semaine à celle de la semaine d’avant (différence réelle en kg ; ramenée à une semaine quand plus de 7 jours séparent les deux pesées). La semaine en cours est en transparence : elle bouge jusqu’à dimanche. ';
  if(s===0)return base+c(0)+'Vert</span> : poids stable (moins de 0,2 kg). '+c(1)+'Ambre</span> : ça bouge, dans un sens ou dans l’autre.';
  return base+c(s)+'Vert</span> : tu '+(s>0?'prends':'perds')+'. '+c(0)+'Ambre</span> : tu stagnes (moins de 0,2 kg). '+c(-s)+'Orange</span> : tu '+(s>0?'perds':'reprends')+'. La régularité compte plus que la vitesse.';
}
function phraseAccord(diff){
  const s=sensObj(),e=kgTxt(Math.abs(diff));
  if(Math.abs(diff)<=0.8)return '<p class="crb-ac ok">La balance et le calcul concordent (écart '+e+' kg) : ton estimation de besoins est fiable.</p>';
  if(s<0)return diff>0?'<p class="crb-ac ecart"><b>Tu perds moins vite que prévu</b> ('+e+' kg d’écart) : besoins surestimés ou apports qui passent sous le radar.</p>'
                     :'<p class="crb-ac ecart"><b>Tu perds plus vite que prévu</b> ('+e+' kg d’écart) : garde un rythme tenable pour tes muscles.</p>';
  if(s>0)return diff<0?'<p class="crb-ac ecart"><b>Tu prends moins vite que prévu</b> ('+e+' kg d’écart) : besoins plus élevés qu’estimé, ou portions surestimées. Augmente un peu l’écart.</p>'
                     :'<p class="crb-ac ecart"><b>Tu prends plus vite que prévu</b> ('+e+' kg d’écart) : réduis un peu l’écart pour prendre surtout du muscle.</p>';
  return '<p class="crb-ac ecart"><b>Ton poids '+(diff>0?'monte':'baisse')+' plus que prévu</b> ('+e+' kg d’écart) : ajuste un peu l’écart pour rester stable.</p>';
}

function brancherIns(){
  const I=S.ins,F=I.f,on=(s,e,f)=>{const x=$(s);if(x)x.addEventListener(e,f);};
  on('#i-inv','click',()=>{I.etape='code';I.msg='';renduIns();});
  on('#c-ok','click',()=>{
    const api=$('#c-api').value.trim(),token=$('#c-token').value.trim();
    if(!api||!token){I.msg='Renseigne les deux champs.';renduIns();return;}
    S.ins=null;ecrireCfg({api:api,token:token});demarrer();
  });
  on('#i-retour','click',()=>{I.etape='choix';I.msg='';renduIns();});
  on('#i-code','input',e=>{I.code=e.target.value;});
  on('#i-coller','click',async()=>{
    try{const t=await navigator.clipboard.readText();const v=lireInvite(t);
      if(v){I.code=v.code;if(v.api)I.api=v.api;I.msg='';}else I.msg='Le presse-papiers ne contient pas d\'invitation.';}
    catch(e){I.msg='Collage refusé : appuie longuement dans le champ puis « Coller ».';}
    renduIns();
  });
  on('#i-suite','click',async()=>{
    const v=lireInvite(($('#i-code')||{}).value||I.code);
    if(!v){I.msg='Code incomplet : 8 caractères, par exemple ABCD-EFGH.';renduIns();return;}
    I.code=v.code;if(v.api)I.api=v.api;I.etat='envoi';I.msg='';renduIns();
    try{
      const r=await appelInvite({invite:I.code});
      I.etat=null;
      if(r.token){entrer(r);return;}
      I.etape='profil';if(r.prenom&&!F.prenom)F.prenom=r.prenom;
    }catch(err){I.etat=null;I.msg=err.message;}
    renduIns();
  });
  document.querySelectorAll('[data-if]').forEach(i=>i.addEventListener('input',()=>{F[i.dataset.if]=i.value;}));
  document.querySelectorAll('[data-isx]').forEach(b=>b.addEventListener('click',()=>{F.sexe=b.dataset.isx;renduIns();}));
  document.querySelectorAll('[data-iact]').forEach(b=>b.addEventListener('click',()=>{F.facteur=Number(b.dataset.iact);renduIns();}));
  document.querySelectorAll('[data-iob]').forEach(b=>b.addEventListener('click',()=>{F.objectif=b.dataset.iob;F.ecart=String(OBJ_DEF[F.objectif].ecart);renduIns();}));
  on('#i-creer','click',async()=>{
    const n=v=>Number(String(v||'').replace(',','.'));
    let m='';
    if(!F.prenom.trim())m='Indique ton prénom.';
    else if(!F.sexe)m='Choisis homme ou femme : le calcul du métabolisme en dépend.';
    else if(!(n(F.age)>=14&&n(F.age)<=100))m='Âge attendu entre 14 et 100 ans.';
    else if(!(n(F.taille)>=120&&n(F.taille)<=230))m='Taille attendue entre 120 et 230 cm.';
    else if(!(n(F.poids)>=30&&n(F.poids)<=300))m='Poids attendu entre 30 et 300 kg.';
    else if(!OBJ_DEF[F.objectif])m='Choisis ce que tu veux faire : sèche, stabilisation ou prise de masse.';
    else{const B=OBJ_DEF[F.objectif],e=parseInt(String(F.ecart).replace(/[^0-9-]/g,''),10);
      if(isNaN(e)||e<B.min||e>B.max)m='Écart attendu entre '+B.min+' et '+(B.max>0?'+':'')+B.max+' kcal par jour.';}
    if(m){I.msg=m;renduIns();return;}
    I.etat='envoi';I.msg='';renduIns();
    try{
      const r=await appelInvite({invite:I.code,profil:{prenom:F.prenom.trim(),sexe:F.sexe,age:n(F.age),taille:n(F.taille),poids:n(F.poids),
        facteur:Number(F.facteur),objectif:F.objectif,ecart_kcal:parseInt(String(F.ecart).replace(/[^0-9-]/g,''),10),objectif_poids:F.objp?n(F.objp):''}});
      if(r.token){entrer(r);return;}
      I.etat=null;I.msg='Réponse inattendue du serveur.';
    }catch(err){I.etat=null;I.msg=err.message;}
    renduIns();
  });
}

/* ---------- Qualité : graisses saturées, fibres, sodium, sucres ajoutés ----------
   Repères : saturées < 10 % des calories (OMS), sucres ajoutés < 10 % (OMS), sodium < 2 000 mg
   (OMS, 5 g de sel), fibres 30 g (25 g pour une femme) à atteindre. Plafonds calés sur la cible du jour. */
const NUTS=['satures','fibres','sodium','sucres_ajoutes'];
function seuilsQualite(d){
  const c=(d&&d.cibles&&d.cibles.kcal)||2000,fem=d&&d.profil&&String(d.profil.sexe||'').toUpperCase()==='F';
  return {satures:{max:Math.round(c*0.10/9),lib:'Graisses saturées',court:'Saturées',u:'g',plancher:false},
    fibres:{max:fem?25:30,lib:'Fibres',court:'Fibres',u:'g',plancher:true},
    sodium:{max:2000,lib:'Sodium',court:'Sodium',u:'mg',plancher:false},
    sucres_ajoutes:{max:Math.round(c*0.10/4),lib:'Sucres ajoutés',court:'Sucres ajoutés',u:'g',plancher:false}};
}
function etatNut(q,v){
  const bon=q.plancher?v>=q.max:v<=q.max;
  const coul=bon?'var(--under)':(q.plancher?'var(--over)':(v<=q.max*1.1?'var(--jaune)':'var(--over)'));
  const e=nb(Math.abs(q.max-v));
  const txt=q.plancher?(bon?'objectif atteint':e+' '+q.u+' à prendre'):(bon?e+' '+q.u+' restant'+(q.max-v>1?'s':''):e+' '+q.u+' en trop');
  return {bon:bon,coul:coul,txt:txt};
}
function barreNut(q,v){
  const e=etatNut(q,v);
  return '<div class="hm"><div class="hm-l"><span>'+q.lib+' <b>'+nb(v)+'</b> / '+nb(q.max)+' '+q.u+'</span><span class="hm-e" style="color:'+e.coul+'">'+e.txt+'</span></div>'+
    '<div class="hm-b"><i style="width:'+Math.min(100,q.max?v/q.max*100:0).toFixed(0)+'%;background:'+e.coul+'"></i></div></div>';
}
function blocQualiteJour(d){
  const a=d.aujourdhui||{};
  if(!a.repas)return '';
  const Q=seuilsQualite(d);
  return '<div class="qj"><div class="qj-t">Qualité du jour</div>'+NUTS.filter(k=>a[k]!==undefined&&a[k]!==null).map(k=>barreNut(Q[k],Math.round(a[k]||0))).join('')+((Number(a.alcool)||0)>0?barreAlcool(a.alcool):'')+
    aide('<p class="note">Plafonds calés sur ta cible du jour : graisses saturées sous 10 % des calories, sucres ajoutés sous 10 % (repères de l\'OMS), sodium sous 2 000 mg (5 g de sel), alcool : 2 verres par jour au plus (1 verre = 10 g d\'alcool pur : un demi de bière, un verre de vin, un petit verre d\'alcool fort). Les fibres sont un objectif à atteindre, pas un plafond. Les valeurs viennent de l\'estimation de l\'IA ou de l\'étiquette des produits scannés : c\'est la tendance sur plusieurs jours qui compte.</p>','D\'où viennent ces repères ?')+'</div>';
}
function ongletQualite(d,P){
  const Q=seuilsQualite(d),k=NUTS.concat(['alcool']).indexOf(S.crb.nut)>=0?S.crb.nut:'satures',q=Q[k]||{};
  const js=(d.jours||[]).filter(j=>j.repas>0);
  const avec=js.filter(j=>j.satures!==null&&j.satures!==undefined);
  if(!js.length)return '<p class="vide">Pas encore de repas notés.</p>';
  let n=P;
  if(!P){const d0=new Date(js[0].date+'T12:00:00'),d1=new Date();d1.setHours(12,0,0,0);n=Math.max(1,Math.round((d1-d0)/86400000)+1);}
  const debut=plusJours(auj(),-(n-1));
  // tuiles : moyenne sur les journées complètes (2 repas ou plus) qui ont la donnée
  let h=avec.length?'':'<p class="note">Graisses saturées et sucres ajoutés : ils s\'afficheront au fil des nouveaux repas analysés, les repas enregistrés avant ce suivi n\'en ont pas.</p>';
  h+='<div class="tuiles t2">';
  NUTS.forEach(x=>{
    const qx=Q[x];
    const jv=js.filter(j=>j.date>=debut&&j.date<auj()&&j.valide&&j[x]!==null&&j[x]!==undefined);
    const ta=d.aujourdhui||{},enc=(ta.repas>0&&ta[x]!==null&&ta[x]!==undefined)?'aujourd\u2019hui en cours : '+nb(Math.round(Number(ta[x])||0))+' '+qx.u:'';
    if(!jv.length){h+=tuile(qx.court,'—',enc||'pas encore de données');return;}
    const moy=jv.reduce((t,j)=>t+(Number(j[x])||0),0)/jv.length,e=etatNut(qx,moy);
    const nb2=qx.plancher?jv.filter(j=>j[x]>=qx.max).length:jv.filter(j=>j[x]>qx.max).length;
    h+=tuile(qx.court,nb(moy)+' '+qx.u+'/j',(qx.plancher?'objectif ':'max ')+nb(qx.max)+' '+qx.u+' · '+nb2+' jour'+(nb2>1?'s':'')+(qx.plancher?' atteint'+(nb2>1?'s':''):' au-dessus')+(enc?' · '+enc:''),e.coul);
  });
  h+=blocAlcool(d)+'</div><div class="nut-sel" role="tablist">';
  NUTS.forEach(x=>{h+='<button data-cnut="'+x+'" class="'+(x===k?'on':'')+'">'+Q[x].court+'</button>';});
  h+='<button data-cnut="alcool" class="'+(k==='alcool'?'on':'')+'">Alcool</button></div>';
  if(k==='alcool')return h+graphiqueAlcool(d,n)+aide('<p class="note">1 verre standard = 10 g d\'alcool pur : un demi de bière (25 cl à 5 %), un verre de vin (10 cl), une coupe de champagne, un petit verre d\'alcool fort (3 cl). Repères de Santé publique France : au plus 10 verres par semaine, 2 par jour, et des jours sans alcool. Pour l\'acide urique, la bière est un facteur aggravant : elle apporte à la fois de l\'alcool et des purines.</p>');
  const par={};js.forEach(j=>{if(j[k]!==null&&j[k]!==undefined)par[j.date]=Math.round(Number(j[k])||0);});
  h+=barresSeuil(joursCalendaires(n,par),{seuil:q.max,bonSiHaut:q.plancher,libSeuil:(q.plancher?'objectif ':'max ')+nb(q.max)+' '+q.u,titre:q.lib+' par jour',cle:'nut',fmt:v=>nb(v)+' '+q.u});
  // ce qui en apporte le plus : aliments des repas chargés (deux dernières semaines au plus)
  const tot={};
  (d.journal||[]).filter(r=>r.date>=debut&&Array.isArray(r.aliments)).forEach(r=>r.aliments.forEach(a=>{
    const v=Number(a[k])||0;if(v<=0)return;
    const nom=String(a.nom||'').trim();if(!nom)return;
    const cle=nom.toLowerCase();tot[cle]=tot[cle]||{nom:nom,v:0};tot[cle].v+=v;}));
  const top=Object.values(tot).sort((x,y)=>y.v-x.v).slice(0,6);
  if(top.length){
    h+='<div class="pur-top"><div class="pur-top-t">'+'Ce qui en apporte le plus'+(n>14?' (deux dernières semaines)':'')+'</div>';
    top.forEach(t=>{h+='<div class="pur-top-l"><span>'+esc(t.nom)+'</span><b'+(q.plancher?' style="color:var(--under)"':'')+'>'+nb(t.v)+' '+q.u+'</b></div>';});
    h+='</div>';
  }
  h+=aide('<p class="note">Tuiles : moyenne des journées complètes (au moins deux repas), sans aujourd\'hui, affiché à part tant que la journée n\'est pas finie. Barres : total de chaque jour, '+(q.plancher?'vert quand l\'objectif est atteint.':'vert sous le repère, orange au-dessus.')+
    ' Graisses saturées : charcuterie, fromage, beurre, crème, viennoiseries, viandes grasses. Sucres ajoutés : sodas, jus, confiseries, pâtisseries, céréales sucrées ; les sucres des fruits entiers et du lait nature ne comptent pas. Fibres : légumes, légumineuses, céréales complètes, fruits, oléagineux.</p>');
  return h;
}

/* ---------- Corps : onglets (pesée, pas, mesures, photos, goutte) ---------- */
const CORPS_ONGLETS=[['pesee','Pesée'],['pas','Pas'],['mesures','Mesures'],['photos','Photos'],['goutte','Goutte']];
function corpsOngletInit(){try{const v=localStorage.getItem('suivi.corps.onglet');return CORPS_ONGLETS.some(x=>x[0]===v)?v:'pesee';}catch(e){return 'pesee';}}
function vueCorps(d){

/* ---------- Crises de goutte ---------- */
const ARTICS=[['gros orteil','Gros orteil'],['cheville','Cheville'],['genou','Genou'],['pied','Pied'],['poignet, main','Poignet, main'],['autre','Autre']];
// Ce qui s'est passé les 3 jours avant une crise (d.jours couvre tout l'historique).
function analyseCrise(d,c){
  const jrs=[1,2,3].map(n=>(d.jours||[]).find(j=>j.date===plusJours(c.date,-n))).filter(j=>j&&j.repas>0);
  if(!jrs.length)return null;
  const max=purMax(d),Q=seuilsQualite(d);
  const moy=(f)=>{const v=jrs.filter(j=>j[f]!==null&&j[f]!==undefined);return v.length?v.reduce((t,j)=>t+(Number(j[f])||0),0)/v.length:null;};
  const pur=moy('purines_risque'),alc=jrs.reduce((t,j)=>t+(Number(j.alcool)||0),0),sa=moy('sucres_ajoutes'),ec=moy('ecart');
  const purMaxJ=Math.max.apply(null,jrs.map(j=>Number(j.purines_risque)||0));
  return {n:jrs.length,pur:pur,purDessus:purMaxJ>max,alc:alc,sa:sa,saDessus:sa!==null&&sa>Q.sucres_ajoutes.max,ec:ec,grosDef:ec!==null&&ec<-800,max:max,maxSa:Q.sucres_ajoutes.max};
}
function sectionGoutte(d){
  const G=S.gt,cr=d.crises||[];
  const hier=plusJours(auj(),-1);
  let h='<section><h2>Noter une crise</h2>'+
    '<label>Quand</label><div class="chips" id="g-quand">'+
      [['auj','Aujourd’hui'],['hier','Hier'],['autre','Autre date']].map(x=>'<button data-gq="'+x[0]+'" class="'+(G.quand===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>';
  if(G.quand==='autre')h+='<input id="g-date" type="date" max="'+auj()+'" value="'+esc(G.date||hier)+'">';
  h+='<label>Où</label><div class="chips">'+ARTICS.map(x=>'<button data-ga="'+x[0]+'" class="'+(G.art===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>'+
    '<label>Intensité (1 = gêne, 5 = impossible de poser le pied)</label><div class="chips">'+[1,2,3,4,5].map(i=>'<button data-gi="'+i+'" class="'+(G.int===i?'on':'')+'">'+i+'</button>').join('')+'</div>'+
    '<label for="g-rem">Remarque (facultatif)</label><input id="g-rem" type="text" maxlength="120" placeholder="Ex : côté droit, traitement pris" value="'+esc(G.rem||'')+'">'+
    '<button class="primaire" id="g-noter"'+(G.etat==='envoi'?' disabled':'')+'>'+(G.etat==='envoi'?'<span class="attente"></span>Enregistrement':'Noter la crise')+'</button>';
  if(G.etat==='ko')h+='<p class="alerte">'+esc(G.message)+'</p>';
  if(G.etat==='ok')h+='<p class="bien">'+esc(G.message)+'</p>';
  h+='</section>';
  if(!cr.length)return h+'<section><p class="note">Aucune crise notée. Chacune apparaîtra ici avec ce que tu as mangé et bu les trois jours avant, pour repérer ce qui revient. Tu peux aussi noter les crises passées dont tu te souviens (Autre date).</p></section>';
  const an=cr.map(c=>({c:c,a:analyseCrise(d,c)}));
  const conn=an.filter(x=>x.a);
  h+='<section><h2>Mes crises</h2>';
  if(conn.length===1){
    const a=conn[0].a,l=[];
    if(a.purDessus)l.push('au moins un jour au-dessus de ton plafond de purines');
    if(a.alc>0)l.push('de l\u2019alcool');
    if(a.saDessus)l.push('des sucres ajoutés au-dessus du repère');
    if(a.grosDef)l.push('un gros déficit (plus de 800 kcal par jour)');
    h+='<div class="synth"><b>Ta crise</b> a suivi '+(l.length?l.join(', '):'des jours sans excès marquant')+'. Avec quelques crises notées, cette synthèse montrera ce qui revient.</div>';
  }else if(conn.length){
    const np=conn.filter(x=>x.a.purDessus).length,na=conn.filter(x=>x.a.alc>0).length,ns=conn.filter(x=>x.a.saDessus).length,nd=conn.filter(x=>x.a.grosDef).length;
    const l=[np+' après au moins un jour au-dessus de ton plafond de purines',na+' après un jour avec alcool'];
    if(conn.some(x=>x.a.sa!==null))l.push(ns+' après des sucres ajoutés au-dessus du repère');
    l.push(nd?nd+' après un gros déficit (plus de 800 kcal par jour)':'aucune après un gros déficit');
    h+='<div class="synth"><b>Sur tes '+conn.length+' crises avec des repas notés</b> : '+l.join(', ')+'.'+
      (conn.length<3?' La synthèse devient parlante à partir de quelques crises.':'')+'</div>';
  }
  an.forEach(x=>{
    const c=x.c,a=x.a;
    h+='<div class="crise"><div class="crise-t"><b>'+jjmm(c.date)+' · '+esc(c.articulation)+'</b><span>'+c.intensite+'/5</span></div>'+
      (c.remarque?'<div class="crise-i">'+esc(c.remarque)+'</div>':'');
    if(!a)h+='<p class="note" style="margin:4px 0 0">Pas de repas notés les trois jours avant.</p>';
    else{
      const o=v=>' style="color:var(--over)"';
      h+='<div class="crise-i">Les 3 jours avant ('+a.n+' jour'+(a.n>1?'s':'')+' notés)</div><ul>'+
        '<li>Purines à risque <b'+(a.purDessus?o():'')+'>'+nb(a.pur)+' mg/j</b> en moyenne (plafond '+nb(a.max)+')</li>'+
        '<li>'+(a.alc>0?'Alcool <b'+o()+'>'+verresTxt(a.alc)+'</b>':'Pas d’alcool')+'</li>'+
        (a.sa!==null?'<li>Sucres ajoutés <b'+(a.saDessus?o():'')+'>'+nb(a.sa)+' g/j</b> (repère '+nb(a.maxSa)+')</li>':'')+
        (a.ec!==null?'<li>Écart aux besoins <b'+(a.grosDef?o():'')+'>'+sgn(a.ec)+' kcal/j</b></li>':'')+'</ul>';
    }
    h+='<button class="lien crise-sup" data-gdel="'+esc(c.id)+'">Retirer</button></div>';
  });
  return h+'<p class="note">Les crises apparaissent aussi en repères rouges sur le graphique des purines (Courbes). Une crise peut suivre un excès de purines, d’alcool ou de sucres, mais aussi une perte de poids trop rapide ou un changement de traitement : parles-en à ton médecin.</p></section>';
}

/* ---------- Alcool en verres standard ----------
   1 verre standard = 10 g d'alcool pur (25 cl de bière à 5 %, 10 cl de vin à 12 %, 3 cl d'alcool fort).
   Repères Santé publique France : 10 verres par semaine au maximum, 2 par jour, des jours sans. */
function verresNb(g){return Math.round((Number(g)||0)/10);}
function verresTxt(g){const v=verresNb(g);if(!v&&(Number(g)||0)>0)return 'moins d\u2019un verre';return v+' verre'+(v>1?'s':'');}
function barreAlcool(g){
  const x=Number(g)||0,v=verresNb(x),bon=x<=20,coul=bon?'var(--under)':(x<=30?'var(--jaune)':'var(--over)');
  return '<div class="hm"><div class="hm-l"><span>Alcool <b>'+(!v&&x>0?'<1':v)+'</b> / 2 verres</span><span class="hm-e" style="color:'+coul+'">'+(bon?'dans le repère':'au-delà du repère')+'</span></div>'+
    '<div class="hm-b"><i style="width:'+Math.min(100,x/20*100).toFixed(0)+'%;background:'+coul+'"></i></div></div>';
}
// Jours avec l'alcool : null = non suivi (repas antérieurs au suivi), sinon grammes d'alcool pur.
function alcJour(j){if(!j||!(j.repas>0))return {st:'vide'};if(j.alcool===null||j.alcool===undefined)return {st:'ns'};return {st:'ok',g:Number(j.alcool)||0};}
function alcDebut(d){const j=(d.jours||[]).find(x=>x.repas>0&&x.alcool!==null&&x.alcool!==undefined);return j?j.date:null;}
function vTxt(v){return String(v).replace('.',',');}
// Semaines (lundi → dimanche), la plus récente d'abord. Aujourd'hui ne compte pas comme jour sans tant qu'il n'est pas fini.
function semainesAlcool(d,nbs){
  const par={};(d.jours||[]).forEach(j=>{par[j.date]=j;});
  const a=auj(),res=[],ta=d.aujourdhui;
  if(ta&&ta.repas>0&&!par[a])par[a]=Object.assign({date:a},ta);
  for(let w=0;w<nbs;w++){
    const l=plusJours(lundiJn(a),-7*w),s={date:l,g:0,avec:0,sans:0,suivis:0,ns:0,exces:0,cours:w===0,jours:[]};
    for(let i=0;i<7;i++){
      const x=plusJours(l,i),e=alcJour(par[x]);e.date=x;e.futur=x>a;e.auj=x===a;s.jours.push(e);
      if(e.futur||e.st==='vide')continue;
      if(e.st==='ns'){s.ns++;continue;}
      s.suivis++;s.g+=e.g;
      if(e.g>0){s.avec++;if(e.g>20)s.exces++;}else if(!e.auj)s.sans++;
    }
    res.push(s);
  }
  return res;
}
function coulVerres(g){return g<=0?'var(--under)':(g<=20?'var(--jaune)':'var(--over)');}
function blocAlcool(d){
  const W=semainesAlcool(d,2),c=W[0],p=W[1];
  const cours='cette semaine : '+(c.suivis?vTxt(verresNb(c.g))+' pour l’instant':'rien de noté');
  if(!p.suivis)return '<div class="tu tu-large" data-tu="alcool"><small>Alcool · repère 10 verres par semaine</small><b style="color:'+(verresNb(c.g)<=10?'var(--under)':'var(--over)')+'">'+verresTxt(c.g)+' cette semaine</b><span>pour l’instant · '+c.avec+' jour'+(c.avec>1?'s':'')+' avec, '+c.sans+' sans</span></div>';
  const v=verresNb(p.g),inc=p.ns>0||p.suivis<5;
  return '<div class="tu tu-large" data-tu="alcool"><small>Alcool · repère 10 verres par semaine</small><b style="color:'+(v<=10?'var(--under)':'var(--over)')+'">'+verresTxt(p.g)+' la semaine dernière</b><span>'+
    p.avec+' jour'+(p.avec>1?'s':'')+' avec, '+p.sans+' sans'+(inc?' (semaine incomplète)':'')+' · '+cours+'</span></div>';
}
// Grille jour par jour : une ligne par semaine, la plus récente en haut.
function graphiqueAlcool(d,n){
  const nbS=Math.max(2,Math.min(6,Math.ceil(n/7)+1)),W=semainesAlcool(d,nbS),deb=alcDebut(d);
  let h='<div class="alc"><div class="alc-t">Verres d’alcool par jour</div><div class="alc-l alc-tete"><span></span>'+['L','M','M','J','V','S','D'].map(x=>'<i>'+x+'</i>').join('')+'<span></span></div>';
  W.forEach(s=>{
    h+='<div class="alc-l"><span class="alc-d">'+(s.cours?'Cette sem.':jjmm(s.date))+'</span>';
    s.jours.forEach(e=>{
      const t=jjmm(e.date);
      if(e.futur)h+='<i class="alc-c alc-f"></i>';
      else if(e.st==='vide')h+='<i class="alc-c alc-v" title="'+t+' : pas de repas">–</i>';
      else if(e.st==='ns')h+='<i class="alc-c alc-ns" title="'+t+' : non suivi">?</i>';
      else{const v=verresNb(e.g),peu=!v&&e.g>0;
        h+='<i class="alc-c'+(e.auj?' alc-auj':'')+'" title="'+t+' : '+verresTxt(e.g)+'" style="'+(e.auj&&!e.g?'background:transparent;color:var(--soft)':'background:'+coulVerres(e.g))+'">'+(v?v:(peu?'<1':(e.auj?'·':'0')))+'</i>';}
    });
    const v=verresNb(s.g),tot=s.suivis?'<b style="color:'+(v<=10?'var(--under)':'var(--over)')+'">'+vTxt(v)+'</b>':'<b>–</b>';
    h+='<span class="alc-s">'+tot+'</span></div>';
    h+='<div class="alc-r">'+(s.suivis?(s.cours?'En cours : ':'')+verresTxt(s.g)+(s.cours?' pour l’instant':'')+' · '+s.avec+' jour'+(s.avec>1?'s':'')+' avec, '+s.sans+' sans'+(s.exces?' · '+s.exces+' à plus de 2 verres':'')+(s.ns?' · '+s.ns+' non suivi'+(s.ns>1?'s':''):''):(s.ns?'Non suivi':'Pas de repas notés'))+'</div>';
  });
  h+='<div class="alc-leg"><span><i style="background:var(--under)"></i>aucun</span><span><i style="background:var(--jaune)"></i>1 à 2 verres</span><span><i style="background:var(--over)"></i>plus de 2</span><span><i class="alc-ns"></i>non suivi</span></div>';
  // moyenne sur les semaines passées suivies au moins 5 jours
  const pl=W.slice(1).filter(s=>s.suivis>=5&&!s.ns);
  if(pl.length>1)h+='<div class="micro">Moyenne '+Math.round(pl.reduce((t,s)=>t+s.g,0)/pl.length/10)+' verres par semaine sur '+pl.length+' semaines complètes.</div>';
  if(deb&&W.some(s=>s.ns))h+='<div class="micro">Alcool suivi depuis le '+jjmm(deb)+' : les jours d’avant (?) ne comptent dans aucune moyenne.</div>';
  else if(!deb)h+='<div class="micro">Pas encore de repas avec le suivi de l’alcool.</div>';
  return h+'</div>';
}

/* ---------- Sans IA : saisie à la main et repas en attente d'analyse ----------
   Saisie à la main : l'utilisateur tape les valeurs, l'appli calcule les purines avec la
   même table que le workflow (famille × grammes), puis passe par l'écran de résultat
   habituel et l'action « enregistrer » (aucun appel à l'IA).
   En attente : quand l'IA refuse, la photo et la description sont gardées sur l'iPhone
   (localStorage « suivi.attente ») ; l'appli relance l'analyse à l'ouverture, au retour
   du réseau et toutes les 4 minutes, puis enregistre au jour et au créneau d'origine
   avec un identifiant fixe (pas de doublon si l'enregistrement est rejoué). */
const FAMILLES=[['autre','Autre / mélange'],['volaille','Volaille'],['viande_rouge','Viande rouge'],['porc','Porc'],['charcuterie','Charcuterie'],
  ['abats','Abats'],['poisson_gras','Poisson gras'],['poisson_blanc','Poisson blanc'],['petits_poissons','Petits poissons (sardine, anchois)'],
  ['fruits_de_mer','Fruits de mer'],['oeuf','Œuf'],['laitier','Laitage, fromage'],['legumes','Légumes'],['legumes_riches','Champignons, épinards, asperges'],
  ['legumineuses','Légumineuses'],['soja','Soja, tofu'],['cereales_raffinees','Pain, pâtes, riz, pommes de terre'],['cereales_completes','Céréales complètes'],
  ['fruits','Fruits'],['oleagineux','Oléagineux'],['sucreries','Sucreries, desserts'],['matiere_grasse','Matière grasse, sauce'],
  ['boisson','Boisson (hors bière)'],['biere','Bière'],['bouillon_viande','Bouillon de viande']];
const PUR_FAM={abats:[400,1],petits_poissons:[330,1],poisson_gras:[180,1],poisson_blanc:[110,1],fruits_de_mer:[150,1],viande_rouge:[120,1],
  porc:[130,1],volaille:[150,1],charcuterie:[110,1],bouillon_viande:[40,1],biere:[15,1],oeuf:[5,0],laitier:[5,0],legumineuses:[70,0],soja:[70,0],
  legumes_riches:[50,0],legumes:[15,0],fruits:[10,0],cereales_raffinees:[30,0],cereales_completes:[60,0],oleagineux:[60,0],sucreries:[20,0],
  matiere_grasse:[0,0],boisson:[0,0],autre:[30,0]};
function numSaisi(v){const x=Number(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isNaN(x)||x<0?0:x;}
// "230 g", "33 cl", "1,5 l", "50 ml" -> grammes (ou ml) ; sinon 0
function grammesDe(q){
  const m=String(q||'').toLowerCase().replace(',','.').match(/(\d+(?:\.\d+)?)\s*(kg|g|gr|grammes?|mg|ml|cl|dl|l|litres?)(?![a-zà-ÿ])/);
  if(!m)return 0;const v=parseFloat(m[1]),u=m[2];
  if(u==='kg'||u==='l'||u.indexOf('litre')===0)return v*1000;if(u==='cl')return v*10;if(u==='dl')return v*100;if(u==='mg')return v/1000;return v;
}
function manVide(nom){return {nom:nom||'',quantite:'',kcal:'',prot:'',lip:'',gluc:'',satures:'',fibres:'',sucres_ajoutes:'',sodium:'',verres:'',famille:'autre'};}
function alimentManuel(m){
  const R1=x=>Math.round(numSaisi(x)*10)/10;
  const fam=PUR_FAM[m.famille]?m.famille:'autre',g=Math.round(grammesDe(m.quantite)),t=PUR_FAM[fam],pur=Math.round(g*t[0]/100);
  return {nom:String(m.nom||'').trim().slice(0,80),quantite:String(m.quantite||'').trim().slice(0,40),kcal:Math.round(numSaisi(m.kcal)),
    prot:R1(m.prot),lip:R1(m.lip),gluc:R1(m.gluc),fibres:R1(m.fibres),sucres:0,sodium:Math.round(numSaisi(m.sodium)),satures:R1(m.satures),
    sucres_ajoutes:R1(m.sucres_ajoutes),famille:fam,grammes:g,purines:pur,purines_risque:t[1]?pur:0,alcool:Math.round(numSaisi(m.verres)*100)/10,sucree:0};
}
function totalManuel(){
  const t={kcal:0,prot:0,lip:0,gluc:0};
  (S.man.als||[]).forEach(m=>{t.kcal+=numSaisi(m.kcal);t.prot+=numSaisi(m.prot);t.lip+=numSaisi(m.lip);t.gluc+=numSaisi(m.gluc);});
  return nb(Math.round(t.kcal))+' kcal · P '+nb(Math.round(t.prot))+' · L '+nb(Math.round(t.lip))+' · G '+nb(Math.round(t.gluc));
}

      (M.als.length>1?'<button class="lien" data-mdel="'+i+'">Retirer</button>':'')+'</div>'+

      '<div class="man-g3">'+ch(i,'prot','Protéines g','0','decimal')+ch(i,'lip','Lipides g','0','decimal')+ch(i,'gluc','Glucides g','0','decimal')+'</div>'+
      '<label for="mf-'+i+'-famille">Famille (pour les purines)</label><select id="mf-'+i+'-famille" data-mf="'+i+'.famille">'+
        FAMILLES.map(f=>'<option value="'+f[0]+'"'+(m.famille===f[0]?' selected':'')+'>'+f[1]+'</option>').join('')+'</select>'+
      '<details class="aide"><summary>Qualité et alcool (facultatif)</summary>'+
        '<div class="man-g3">'+ch(i,'satures','Saturées g','0','decimal')+ch(i,'fibres','Fibres g','0','decimal')+ch(i,'sucres_ajoutes','Sucres aj. g','0','decimal')+'</div>'+
        '<div class="man-g2">'+ch(i,'sodium','Sodium mg','0','decimal')+ch(i,'verres','Alcool (verres)','0','decimal')+'</div></details></div>';
  });
  h+='<button class="raccourci" id="man-plus">+ Ajouter un aliment</button>'+
    '<div class="man-tot"><span>Total</span><b id="man-tot">'+totalManuel()+'</b></div>';
  if(M.msg)h+='<p class="alerte">'+esc(M.msg)+'</p>';
  h+='<button class="primaire" id="man-ok">Continuer</button>'+
    '<p class="note">Quantité en g, cl ou ml pour que les purines soient calculées. Continuer ouvre l’écran habituel : choix du repas et du jour, puis Enregistrer. Chaque aliment saisi rejoint ensuite « Mes aliments ».</p></div>';
  return h;
}

function lireAttente(){try{const a=JSON.parse(localStorage.getItem('suivi.attente'));return Array.isArray(a)?a:[];}catch(e){return [];}}
function ecrireAttente(){try{localStorage.setItem('suivi.attente',JSON.stringify(S.att||[]));return true;}catch(e){return false;}}
function blocAttente(){

        '<div class="att-a"><button class="lien" data-att-man="'+esc(it.id)+'">Saisir à la main</button><button class="lien" data-att-del="'+esc(it.id)+'">Retirer</button></div></div>';
    });
    h+='<button class="raccourci" id="att-go"'+(S.attEtat==='envoi'?' disabled':'')+'>'+(S.attEtat==='envoi'?'<span class="attente"></span>Analyse en cours':'Réessayer maintenant')+'</button>'+
      '<p class="note" style="margin-top:8px;font-size:12px">L’appli réessaie à chaque ouverture et toutes les 4 minutes quand elle est ouverte. Ces repas ne comptent dans ta journée qu’une fois analysés.</p></div>';
  }
  return h?'<section class="att-z">'+h+'</section>':'';
}
let attEnCours=false;
async function traiterAttente(force){
  if(attEnCours||!S.cfg)return;
  S.att=lireAttente();if(!S.att.length)return;
  if(typeof navigator!=='undefined'&&navigator.onLine===false)return;
  if(!force&&Date.now()-(S.attDernier||0)<240000)return;
  S.attDernier=Date.now();attEnCours=true;S.attEtat='envoi';
  if(S.vue==='jour'&&!S.reglages)rendre();
  let fait=0;
  try{
    for(const it of S.att.slice()){
      try{
        const r=await appel({action:'repas',repas:it.repas,description:it.desc||'',photo:it.photo||'',mime:'image/jpeg'});
        const lib=libelleRepas(it.repas),t=r.total||{};
        const l=Object.assign({detail:(r.aliments||[]).map(a=>a.nom+(a.quantite?' ('+a.quantite+')':'')).join(', '),kcal:t.kcal||0,prot:t.prot||0,lip:t.lip||0,gluc:t.gluc||0,
          fibres:t.fibres||0,sucres:t.sucres||0,sodium:t.sodium||0,satures:t.satures||0,sucres_ajoutes:t.sucres_ajoutes||0,nutriscore:''},r.ligne||{},{repas:lib});
        const w=await appel(Object.assign({action:'enregistrer',date:it.date},l,{id:it.id,aliments:alimentsAEnvoyer(r)}));
        S.att=S.att.filter(x=>x.id!==it.id);ecrireAttente();fait++;
        S.attFait={repas:lib,kcal:(w&&w.kcal)||l.kcal,date:it.date};
      }catch(e){it.essai=Date.now();it.err=(e&&e.message)||'';ecrireAttente();break;}
    }
  }finally{attEnCours=false;S.attEtat=null;}
  if(fait){try{await rafraichir();}catch(e){}}
  if(!S.reglages&&(S.vue==='jour'||(fait&&S.vue!=='ajout')))rendre();
}

  const r=(d&&d.reference)||{};
  const mb=Number(r.mb)||0;const td=mb?Math.round(mb*(f||r.facteur||1.2)):(Number(r.tdee)||0);
  return td?{td:td,cible:Math.max(mb,td+e)}:null;
}

}

/* ---------- purines ---------- */
// Plafond de purines "à risque" (animales + bière) en mg/jour, réglable dans les Réglages.
function purMax(d){const v=Number(d&&d.reference&&d.reference.purines_max);return v>0?v:400;}
// Niveau d'un aliment : f(aible) / m(odéré) / e(levé). Absent si l'analyse est antérieure au suivi.
// Seules comptent les purines animales, de la bière et de la levure : ce sont les seules
// associées aux crises de goutte. Un aliment végétal ou sans purines n'a pas de pastille.
function niveauPurines(al){
  if(!al||al.purines===undefined)return '';
  const r=Number(al.purines_risque)||0;
  if(r<=0)return '';
  if(r>=150)return 'e';
  if(r>=50)return 'm';
  return 'f';
}
function pastillePurines(al){
  const n=niveauPurines(al);if(!n)return '';
  const lib={f:'purines faibles',m:'purines modérées',e:'purines élevées'}[n];
  return '<span class="pur p-'+n+'" title="'+lib+'">'+nb(al.purines_risque)+' mg</span>';
}
// Ligne discrète purines / alcool pour un total (repas, produit scanné).
function lignePurines(o,max,id){
  if(!o||o.purines===undefined)return '';
  const t=Math.round(o.purines||0),r=Math.round(o.purines_risque||0),alc=Number(o.alcool)||0;
  let s='purines à risque '+nb(r)+' mg';
  if(max&&r)s+=' ('+Math.round(r/max*100)+' % du plafond)';
  if(alc>0)s+=' · alcool '+verresTxt(alc);
  if(o.sucree||o.boissons_sucrees)s+=' · boisson sucrée';
  return '<div class="micro"'+(id?' id="'+id+'"':'')+'>'+s+'</div>';
}
// Les 6 jours de calendrier qui précèdent aujourd'hui : avec aujourd'hui, une fenêtre de 7 jours.
// (Avant : les 7 derniers jours SAISIS, donc 8 jours au total et plus loin si des jours manquaient.)
function sept(d){
  const a=auj(),x=new Date();x.setHours(12,0,0,0);x.setDate(x.getDate()-6);
  const deb=isoLocal(x);
  return (d.jours||[]).filter(j=>j.date>=deb&&j.date<a);
}
function blocPurinesJour(d){
  const a=d.aujourdhui||{},max=purMax(d);
  const r=Math.round(a.purines_risque||0);
  const aDesDonnees=(d.jours||[]).some(j=>j.purines>0)||(a.purines||0)>0;
  if(!aDesDonnees)return '';
  const coul=couleurDepassement(r,max);
  const w=320,h=26,maxi=Math.max(r,max)*1.08,lx=(max/maxi)*w,cx=Math.min((r/maxi)*w,w);
  let o='<section><h2>Purines</h2>';
  o+='<div class="pur-tete"><span><b style="color:'+(r>max?coul:'var(--ink)')+'">'+nb(r)+'</b> / '+nb(max)+' mg</span>'+
     '<span class="pur-lib">animales et bière</span></div>';
  o+='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Purines à risque : '+nb(r)+' mg sur un plafond de '+nb(max)+'">'+
     '<rect x="0" y="5" width="'+w+'" height="12" rx="6" fill="var(--creux)"/>'+
     '<rect x="0" y="5" width="'+cx.toFixed(1)+'" height="12" rx="6" fill="'+coul+'"/>'+
     '<line x1="'+lx.toFixed(1)+'" y1="1" x2="'+lx.toFixed(1)+'" y2="22" stroke="var(--ink)" stroke-width="1.5"/></svg>';
  const s7=sept(d).concat([a]);
  const alc=s7.reduce((s,j)=>s+(Number(j.alcool)||0),0);
  const suc=s7.reduce((s,j)=>s+(Number(j.boissons_sucrees)||0),0);
  o+=pastilles7(d,max);
  o+='<div class="micro">Sur 7 jours : alcool '+verresTxt(alc)+' · '+suc+' boisson'+(suc>1?'s':'')+' sucrée'+(suc>1?'s':'')+'</div>';
  o+='<details class="aide"><summary>Comment c\'est calculé ?</summary><p class="note">Seules comptent les purines des viandes, abats, charcuteries, poissons, fruits de mer, bouillons et de la bière : ce sont celles qui favorisent les crises de goutte. Les purines végétales (lentilles, épinards, champignons) n\'augmentent pas ce risque et ne sont pas comptées. Valeurs estimées par famille d\'aliments : une tendance, pas une mesure au milligramme.</p></details>';
  return o+'</section>';
}
// Purines à risque des 7 derniers jours (aujourd'hui compris), une pastille par jour.
function pastilles7(d,max){
  const par={};(d.jours||[]).forEach(j=>{par[j.date]=j;});
  const JL=['D','L','M','M','J','V','S'];
  const ajd=auj(),a=d.aujourdhui||{},it=[];
  const x=new Date();x.setHours(12,0,0,0);x.setDate(x.getDate()-6);
  for(let i=0;i<7;i++){
    const k=isoLocal(x),j=par[k],estAuj=(k===ajd);
    let v=null;
    if(estAuj){if((a.repas||0)>0||(a.kcal||0)>0)v=Math.round(a.purines_risque||0);}
    else if(j&&(j.repas>0||j.kcal>0))v=Math.round(j.purines_risque||0);
    it.push({date:k,v:v,auj:estAuj,lib:estAuj?'Auj.':JL[x.getDay()]+' '+x.getDate()});
    x.setDate(x.getDate()+1);
  }
  let s='<div class="pur7-t">7 derniers jours</div><div class="pur7">';
  it.forEach(i=>{
    const cl=i.v===null?'vide':(i.v>max?'haut':(i.v>max*0.75?'moyen':'bas'));
    s+='<div class="pur7-c '+cl+(i.auj?' auj':'')+'" title="'+esc(jjmmJour(i.date))+'"><span class="j">'+i.lib+'</span><b>'+(i.v===null?'\u2013':nb(i.v))+'</b><span class="u">mg</span></div>';
  });
  s+='</div>';
  const hier=it[5],passes=it.slice(0,6).filter(i=>i.v!==null);
  const moy=passes.length?Math.round(passes.reduce((t,i)=>t+i.v,0)/passes.length):null;
  const dep=passes.filter(i=>i.v>max).length;
  s+='<div class="micro">Hier : <b>'+(hier.v===null?'pas de saisie':nb(hier.v)+' mg')+'</b>'+
     (moy!==null?' · moyenne '+passes.length+' jour'+(passes.length>1?'s':'')+' : '+nb(moy)+' mg':'')+
     (dep?' · <span class="sur">'+dep+' jour'+(dep>1?'s':'')+' au-dessus du plafond</span>':'')+'</div>';
  return s;
}
// Alertes acide urique, en tête de l'écran Jour, affichées seulement si elles se déclenchent.
function alertesGoutte(d){
  const a=d.aujourdhui||{},max=purMax(d),ajd=auj(),al=[];
  if(!(d.jours||[]).some(j=>j.purines>0)&&!(a.purines>0))return '';
  const r=Math.round(a.purines_risque||0);
  // alerte seulement au-delà du plafond + 20 % (un léger dépassement n'est pas une alerte)
  const seuilA=Math.round(max*1.2);
  if(r>seuilA){
    // l'aliment le plus chargé du jour (pas le début du texte du repas)
    let top=null;
    (d.journal||[]).filter(x=>x.date===ajd).forEach(x=>{
      const als=Array.isArray(x.aliments)&&x.aliments.length?x.aliments:[{nom:x.detail,quantite:'',purines_risque:x.purines_risque}];
      als.forEach(al=>{const v=Number(al.purines_risque)||0;if(v>0&&(!top||v>top.v))top={v:v,nom:String(al.nom||'').trim(),q:String(al.quantite||'').trim(),repas:x.repas};});
    });
    al.push('<b>Plafond dépassé de plus de 20 % aujourd\'hui</b> : '+nb(r)+' mg pour '+nb(max)+' mg.'+
      (top?' Le plus chargé : '+esc(top.nom.slice(0,50))+(top.q?' ('+esc(top.q.slice(0,25))+')':'')+', '+nb(top.v)+' mg au '+esc(String(top.repas||'').toLowerCase())+'.':'')+
      ' Pour le reste de la journée : œufs, laitages, légumes, féculents.');
  }
  // jours consécutifs au-dessus du plafond, en remontant depuis aujourd'hui (ou hier si rien aujourd'hui)
  const par={};(d.jours||[]).forEach(j=>{par[j.date]=j;});
  let n=0;const x=new Date();x.setHours(12,0,0,0);
  if(!(r>seuilA))x.setDate(x.getDate()-1);
  for(let i=0;i<30;i++){const j=par[isoLocal(x)];if(j&&(j.purines_risque||0)>seuilA){n++;x.setDate(x.getDate()-1);}else break;}
  if(n>=3)al.push('<b>'+n+' jours d\'affilée à plus de 20 % au-dessus du plafond.</b> C\'est la répétition qui fait monter l\'acide urique : prévois une journée sans viande ni poisson.');
  const s7=sept(d).concat([a]);
  const jAlc=s7.filter(j=>(Number(j.alcool)||0)>0).length,gAlc=s7.reduce((t,j)=>t+(Number(j.alcool)||0),0);
  if(jAlc>=3||gAlc>=70)al.push('<b>Alcool '+jAlc+' jour'+(jAlc>1?'s':'')+' sur 7</b> ('+verresTxt(gAlc)+'). La bière et les alcools forts freinent l\'élimination de l\'acide urique, la bière apporte en plus ses propres purines.');
  const suc=s7.reduce((t,j)=>t+(Number(j.boissons_sucrees)||0),0);
  if(suc>3)al.push('<b>'+suc+' boissons sucrées sur 7 jours.</b> Le fructose des sodas et des jus fait monter l\'acide urique, même sans purines.');
  const v=sept(d).filter(j=>j.valide&&j.ecart!==null);
  if(v.length>=5){
    const m=v.reduce((t,j)=>t+j.ecart,0)/v.length;
    if(m<-900)al.push('<b>Déficit moyen de '+nb(Math.abs(m))+' kcal par jour</b> sur '+v.length+' jours. Un déficit aussi marqué fait monter l\'acide urique et coûte du muscle : vise plutôt 500 à 700.');
  }
  if(!al.length)return '';
  const ouv=S.jour.alerteOuv;
  return '<section><button class="vg" id="j-alerte" aria-expanded="'+ouv+'">\u26A0\uFE0F <b>Vigilance acide urique</b><span class="vg-n">'+al.length+'</span><span class="vg-ch">\u203A</span></button>'+
    (ouv?'<div class="goutte">'+al.map(t=>'<p>'+t+'</p>').join('')+'</div>':'')+'</section>';
}
// Barres journalières avec un seuil (plafond de purines, objectif de pas).
// bonSiHaut : vert au-dessus du seuil (pas) ; sinon vert en dessous (purines).
function barresSeuil(items,o){
  if(!items.length)return '<p class="vide">Pas encore de données.</p>';
  const w=320,h=o.h||140,pt=18,pb=18,pl=2,pr=2;
  const vmax=Math.max(o.seuil*1.25,Math.max.apply(null,items.map(i=>i.v)))||1;
  const Y=v=>pt+(1-v/vmax)*(h-pt-pb);
  const pas=(w-pl-pr)/items.length,lg=Math.max(3,Math.min(16,pas*0.62));
  let s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.titre||'barres')+'">';
  const sel=o.cle?(S.corps.selBar||{})[o.cle]:null;
  let selIt=null,selCx=0;
  items.forEach((it,i)=>{
    const bon=o.bonSiHaut?it.v>=o.seuil:it.v<=o.seuil;
    const cx=pl+pas*(i+0.5),y=Y(it.v),estSel=(sel===it.date);
    s+='<rect x="'+(cx-lg/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+lg.toFixed(1)+'" height="'+Math.max(1,(h-pb)-y).toFixed(1)+'" rx="2" fill="'+(bon?'var(--under)':'var(--over)')+'"'+(it.vide&&!estSel?' opacity="0.25"':'')+(estSel?' stroke="var(--ink)" stroke-width="1.6"':'')+'/>';
    // zone de toucher pleine hauteur, plus large que la barre (les barres fines sont difficiles à viser)
    if(o.cle)s+='<rect data-bar="'+o.cle+'|'+it.date+'" x="'+(pl+pas*i).toFixed(1)+'" y="0" width="'+pas.toFixed(1)+'" height="'+h+'" fill="transparent"/>';
    if(estSel){selIt=it;selCx=cx;}
  });
  if(o.marques&&o.marques.length)items.forEach((it,i)=>{
    if(o.marques.indexOf(it.date)<0)return;
    const cx=pl+pas*(i+0.5);
    s+='<path d="M'+(cx-5).toFixed(1)+' 2 L'+(cx+5).toFixed(1)+' 2 L'+cx.toFixed(1)+' 10 Z" fill="var(--rouge)"><title>crise de goutte</title></path>';
  });
  const ys=Y(o.seuil);
  s+='<line x1="0" y1="'+ys.toFixed(1)+'" x2="'+w+'" y2="'+ys.toFixed(1)+'" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="4 3"/>';
  s+='<text x="'+(w-2)+'" y="'+Math.max(11,ys-5).toFixed(1)+'" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--ink)" stroke="var(--paper)" stroke-width="3.5" paint-order="stroke">'+esc(o.libSeuil||'')+'</text>';
  s+='<text x="0" y="'+(h-4)+'" font-size="10.5" fill="var(--soft)" font-weight="300">'+jjmm(items[0].date)+'</text>';
  s+='<text x="'+w+'" y="'+(h-4)+'" text-anchor="end" font-size="10.5" fill="var(--soft)" font-weight="300">'+jjmm(items[items.length-1].date)+'</text>';
  if(selIt){
    const txt=jjmm(selIt.date)+' : '+(selIt.vide?'aucune donnée':(o.fmt?o.fmt(selIt.v):nb(selIt.v)));
    const bw=Math.max(96,txt.length*6.6),bx=Math.min(Math.max(2,selCx-bw/2),w-bw-2);
    s+='<rect x="'+bx.toFixed(1)+'" y="0" width="'+bw.toFixed(1)+'" height="18" rx="4" fill="var(--ink)" pointer-events="none"/>'+
       '<text x="'+(bx+bw/2).toFixed(1)+'" y="12.5" text-anchor="middle" font-size="11" font-weight="700" fill="var(--paper)" pointer-events="none">'+esc(txt)+'</text>';
  }
  return s+'</svg>';
}
// n derniers jours calendaires jusqu'à aujourd'hui, valeur 0 si absente
function joursCalendaires(n,parDate){
  const out=[];const d=new Date();d.setHours(12,0,0,0);
  for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);const k=isoLocal(x);
    out.push({date:k,v:parDate[k]!==undefined?parDate[k]:0,vide:parDate[k]===undefined});}
  return out;
}
function blocPurinesCourbes(d,P){
  const js=(d.jours||[]).filter(j=>j.repas>0);
  if(!js.some(j=>j.purines>0))return '<p class="note">Les purines s\'afficheront ici au fil des nouveaux repas analysés (les repas enregistrés avant ce suivi n\'en ont pas).</p>';
  const max=purMax(d),par={};
  js.forEach(j=>{par[j.date]=Math.round(j.purines_risque||0);});
  let n=P;
  if(!P){const prem=js.filter(j=>j.purines>0)[0];const d0=new Date(prem.date+'T12:00:00');const d1=new Date();d1.setHours(12,0,0,0);n=Math.max(1,Math.round((d1-d0)/86400000)+1);}
  const items=joursCalendaires(n,par);
  const pleins=items.filter(i=>!i.vide);
  const dessus=pleins.filter(i=>i.v>max).length;
  const moyP=pleins.length?Math.round(pleins.reduce((t,i)=>t+i.v,0)/pleins.length):null;
  let h='<div class="tuiles">'+
    tuile('Moyenne',moyP===null?'—':nb(moyP),'mg/j',moyP===null?'':(moyP>max?'var(--over)':'var(--under)'))+
    tuile('Au-dessus',dessus+' / '+pleins.length,'jours saisis',dessus?'var(--over)':'var(--under)')+
    tuile('Plafond',nb(max),'mg/j')+
    '</div>';
  h+=barresSeuil(items,{seuil:max,bonSiHaut:false,libSeuil:'plafond '+nb(max)+' mg',titre:'Purines animales et bière par jour',cle:'pur',fmt:v=>nb(v)+' mg',marques:(d.crises||[]).map(c=>c.date)});
  // le détail des repas n'est chargé que depuis le lundi de la semaine précédente
  const debP=plusJours(auj(),-(n-1));
  const top=(d.journal||[]).filter(r=>r.date>=debP&&(r.purines_risque||0)>0).sort((a,b)=>(b.purines_risque||0)-(a.purines_risque||0)).slice(0,5);
  if(top.length){
    h+='<div class="pur-top"><div class="pur-top-t">Repas les plus chargés'+(n>14?' (deux dernières semaines)':'')+'</div>';
    top.forEach(r=>{h+='<div class="pur-top-l"><span>'+jjmm(r.date)+' · '+esc(r.repas)+' · '+esc(String(r.detail||'').slice(0,70))+'</span><b>'+nb(r.purines_risque)+' mg</b></div>';});
    h+='</div>';
  }
  h+=aide('<p class="note">Chaque barre : purines à risque du jour (viandes, poissons, fruits de mer, charcuterie, bière). Les purines végétales ne sont pas comptées. Vert sous ton plafond, orange au-dessus. Les jours pâles n\'ont aucune saisie. Touche une barre pour sa valeur. Les triangles rouges marquent les crises de goutte notées dans Corps. Le plafond se règle dans les Réglages. Pour réduire sans perdre en protéines : œufs, skyr, fromage blanc, tofu.</p>');
  return h;
}

/* ---------- corps : pas, mensurations, photos ---------- */
const OBJECTIF_PAS=8000;
function poidsA(d,date){
  const p=(d.poids||[]).filter(x=>x.date<=date);
  if(p.length)return p[p.length-1].poids;
  return (d.poids&&d.poids.length)?d.poids[0].poids:(d.reference&&d.reference.poids)||0;
}
// Estimation de la masse grasse, méthode US Navy (cm). Homme : taille + cou ; femme : + hanches.
function masseGrasse(sexe,stature,taille,cou,hanches){
  if(!stature||!taille||!cou)return null;
  let v;
  if(sexe==='F'){if(!hanches||taille+hanches-cou<=0)return null;
    v=495/(1.29579-0.35004*Math.log10(taille+hanches-cou)+0.22100*Math.log10(stature))-450;}
  else{if(taille-cou<=0)return null;
    v=495/(1.0324-0.19077*Math.log10(taille-cou)+0.15456*Math.log10(stature))-450;}
  return (v>3&&v<70)?v:null;
}
const fr1=v=>(Math.round(v*10)/10).toFixed(1).replace('.',',');
function kcalParPas(d){
  const p=Number(d&&d.reference&&d.reference.poids)||0;
  const t=Number(d&&d.profil&&d.profil.taille)||0;
  if(!p||!t)return 0;
  return 0.5*p*(t*0.415/100000);   // kcal/kg/km × kg × km par pas
}
// Repères de pas par jour (Tudor-Locke abaissés de 1 000 pas, choix de Samuel) rapprochés des niveaux d'activité des Réglages.
// La salle ne fait presque pas de pas : elle se rajoute à ce niveau, d'où la prudence du texte.
function conseilActivite(d,moy){
  const f=Number(d.reference&&d.reference.facteur)||1.2;
  const actuel=(ACTIV.filter(x=>Math.abs(x[0]-f)<0.001)[0]||[f,'?'])[1];
  let sug;
  if(moy<4000)sug='Sédentaire';
  else if(moy<6500)sug='Très peu actif';
  else if(moy<9000)sug='Peu actif';
  else if(moy<11500)sug='Modérément actif';
  else sug='Très actif';
  const txt=sug===actuel
    ?'Avec '+nb(moy)+' pas par jour en moyenne, ton réglage « '+actuel+' » est cohérent.'
    :'Avec '+nb(moy)+' pas par jour en moyenne, ta marche seule correspond plutôt au niveau « '+sug+' ». Ton réglage actuel : « '+actuel+' ».';
  return '<p class="note">'+txt+' Si tu fais aussi de la musculation 3 fois par semaine ou plus, monte d\'un cran. Le niveau se change dans les Réglages, les calories de la marche ne s\'ajoutent jamais en plus.</p>';
}
function sectionPas(d){
  const act=d.activite||[];
  const par={};act.forEach(a=>{par[a.date]=a.pas;});
  const a=auj(),ajd=par[a]||0;
  const prec=act.filter(x=>x.date<a).slice(-7);
  const moy=prec.length?Math.round(prec.reduce((s,x)=>s+x.pas,0)/prec.length):null;
  const C=S.corps;
  let h='<section><h2>Pas</h2>';
  h+='<div class="prog"><div class="col"><div class="lib">Aujourd\'hui</div><div class="big'+(ajd>=OBJECTIF_PAS?' pos':'')+'">'+nb(ajd)+'</div><div class="sub">objectif '+nb(OBJECTIF_PAS)+'</div></div>'+
     '<div class="col"><div class="lib">Moyenne 7 j</div><div class="big">'+(moy===null?'—':nb(moy))+'</div><div class="sub">'+(prec.length?prec.length+' jour'+(prec.length>1?'s':''):'aucune donnée')+'</div></div></div>';
  // Dépense de la marche : ~0,5 kcal par kg et par km au-dessus du repos ; foulée ≈ 0,415 × taille.
  const kpp=kcalParPas(d);
  if(kpp&&(ajd||moy)){
    // fourchette : le bas = pas comptés ; le haut = +20 % (pas faits sans téléphone, pentes, escaliers)
    const fk=v=>nb(v*kpp)+' à '+nb(v*kpp*1.2)+' kcal';
    h+='<div class="ryth-poids"><span class="k">Marche, dépense estimée</span><span class="v">'+
       (ajd?fk(ajd):'\u2014')+'</span></div>'+
       '<div class="micro">'+(moy!==null?'Moyenne 7 jours : '+fk(moy)+' par jour · ':'')+
       'environ '+nb(1000*kpp)+' kcal pour 1 000 pas comptés. Le bas de la fourchette ne compte que les pas enregistrés par l\'iPhone, le haut ajoute la marge probable des pas faits sans téléphone.</div>';
  }
  if(act.length){
    const P=C.periodePas===undefined?14:C.periodePas;
    let n=P;
    if(!P){const d0=new Date(act[0].date+'T12:00:00');const d1=new Date();d1.setHours(12,0,0,0);n=Math.max(1,Math.round((d1-d0)/86400000)+1);}
    const items=joursCalendaires(n,par);
    const pleins=items.filter(i=>!i.vide);
    const moyP=pleins.length?Math.round(pleins.reduce((t,i)=>t+i.v,0)/pleins.length):null;
    h+='<div class="periode-ligne"><div class="periode" id="k-periode-pas">';
    [[7,'7j'],[14,'14j'],[30,'30j'],[90,'90j'],[0,'Tout']].forEach(x=>{h+='<button data-kp="'+x[0]+'" class="'+(P===x[0]?'on':'')+'">'+x[1]+'</button>';});
    h+='</div>'+(moyP!==null?'<div class="periode-delta"><span class="pd-lib">moyenne</span><span class="pd-val">'+nb(moyP)+' pas</span></div>':'')+'</div>';
    h+=barresSeuil(items,{seuil:OBJECTIF_PAS,bonSiHaut:true,libSeuil:nb(OBJECTIF_PAS)+' pas',titre:'Pas par jour',cle:'pas',
      fmt:v=>nb(v)+' pas'+(kpp?' · '+nb(v*kpp)+'-'+nb(v*kpp*1.2)+' kcal':'')});
    h+='<p class="note">Touche une barre pour voir le nombre de pas du jour.</p>';
  }
  // aide au réglage manuel du niveau d'activité, sur au moins 5 jours de pas
  if(prec.length>=5)h+=conseilActivite(d,moy);
  const der=act.length?act[act.length-1].date:null;
  h+='<p class="note">'+(der?'Dernière synchronisation : '+jjmmJour(der)+'. ':'Aucun pas reçu pour l\'instant. ')+
     'Les pas arrivent tout seuls depuis ton Raccourci iPhone. En cas de besoin, corrige le total du jour ici.</p>';
  h+='<div class="qte-saisie pas-saisie"><input id="k-pas" type="number" inputmode="numeric" min="0" max="150000" placeholder="Pas du jour" value="'+(ajd||'')+'"><button class="secondaire" id="k-pas-ok"'+(C.pasEtat==='envoi'?' disabled':'')+'>'+(C.pasEtat==='envoi'?'<span class="attente"></span>':'Enregistrer')+'</button></div>';
  if(C.pasEtat==='ko')h+='<p class="alerte">'+esc(C.pasMsg)+'</p>';
  if(C.pasEtat==='ok')h+='<p class="bien">'+esc(C.pasMsg)+'</p>';
  return h+'</section>';
}
